name: Bug report
description: Something in a NobleCloak UI package does not work as documented.
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: '@noblecloak/react 0.1.0'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal repository or code snippet helps most.
    validations:
      required: true
  - type: markdown
    attributes:
      value: Security problems go through SECURITY.md, not a public issue.
