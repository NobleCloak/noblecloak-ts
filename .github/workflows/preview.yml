# Module and theme previews (Storybook): built and uploaded as an artifact on every pull request and main push. The deploy job
# runs only when PUBLIC_RELEASE_ENABLED is 'true'.
name: preview

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same ref (a Dependabot rebase, a fix-up) cancels the run it supersedes.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: preview build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun x turbo run preview:build --filter=@noblecloak/react --filter=@noblecloak/theme
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-preview
          path: packages/react/storybook-static
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theme-preview
          path: packages/theme/storybook-static
          if-no-files-found: error

  deploy:
    name: preview deploy
    needs: build
    if: github.event_name == 'push' && vars.PUBLIC_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        # No hosting target is provisioned yet. This step fails rather
        # than silently skipping if the repository is flipped before a target exists.
        run: |
          echo '::error::No preview hosting target is provisioned. Provision one before the repository is flipped.'
          exit 1
