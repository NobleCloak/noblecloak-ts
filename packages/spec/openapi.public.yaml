          in: header
          required: true
          description: |
            The id of the subscription this delivery is for. Not covered by the signature.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: "#/components/schemas/WebhookDelivery"
      responses:
        2XX:
          description: |
            Delivered.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A platform-issued access token whose `aud` is the origin of the govern host (see `servers`)
        exactly: no path, no trailing slash. `/v1` is a path under that origin and is never part of `aud`. A browser module obtains it as an OAuth 2.1
        public client (PKCE, dynamic client registration, RFC 8707 `resource`). A headless adapter obtains it as an
        organisation-scoped service principal (`client_credentials` with `private_key_jwt`); its token must carry the
        scope `module_api`, else 403 `insufficient_scope`. A token with no organisation claim is 403
        `organization_context_required` on an organisation-scoped route. DPoP proofs are optional per surface (`dpop` on capabilities): a deployment that
        does not verify them (`dpop` off) answers 401 `dpop_unsupported` to a token carrying `cnf.jkt` and to the `DPoP` authorization scheme.
        A request carrying `x-actor-id`, `x-actor-type`, `x-organization-id`, `x-permissions`, `x-scopes` or any other
        `x-actor-*` header is rejected with 401 `header_identity_rejected`, whatever the token.
      x-noblecloak-token-acquisition:
        user:
          flow: oauth2.1-public-client
          pkce: true
          dynamic_client_registration: true
          resource_indicator: RFC 8707
        machine:
          flow: client_credentials
          client_authentication: private_key_jwt
          principal: organisation-scoped service principal, never approver-eligible
          scope: module_api
          x-noblecloak-status: specified
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Replays within 24 hours return the original response and status. Never used on /consume or /resolve.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Cursor:
      name: cursor
      in: query
      description: |
        The `meta.next` of the previous page.
      schema:
        type: string
    CreatedBy:
      name: created_by
      in: query
      required: false
      description: |
        `me` returns only the approvals whose creating principal is the caller. Any other value is 400 `invalid_request`.
      schema:
        type: string
        enum:
          - me
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ApprovalStateSet:
      name: state
      in: query
      required: false
      description: |
        One approval state or a comma-separated set of them (`state=approved,rejected`): the approvals
        in any of them. A value that is not an `ApprovalState` is 400 `invalid_request`.
      schema:
        type: string
        pattern: ^(pending|approved|rejected|consumed|expired|withdrawn)(,(pending|approved|rejected|consumed|expired|withdrawn))*$
    ApprovalOrder:
      name: order
      in: query
      required: false
      description: |
        `created_at` (the default) orders newest first by creation. `resolved_at` orders newest first by resolution time and returns only the approvals that have one. Any other value is 400 `invalid_request`.
      schema:
        type: string
        enum:
          - created_at
          - resolved_at
        default: created_at
    ApprovalId:
      name: id
      in: path
      required: true
      description: |
        The approval id.
      schema:
        type: string
        minLength: 1
    RecordId:
      name: id
      in: path
      required: true
      description: |
        The record id.
      schema:
        type: string
        minLength: 1
    PolicyId:
      name: id
      in: path
      required: true
      description: |
        The policy id.
      schema:
        type: string
        minLength: 1
    ConnectionId:
      name: id
      in: path
      required: true
      description: |
        The connection id.
      schema:
        type: string
        minLength: 1
    ToolId:
      name: id
      in: path
      required: true
      description: |
        The tool id.
      schema:
        type: string
        minLength: 1
    AgentId:
      name: id
      in: path
      required: true
      description: |
        The agent id.
      schema:
        type: string
        minLength: 1
    RunId:
      name: id
      in: path
      required: true
      description: |
        The run id.
      schema:
        type: string
        minLength: 1
    WebhookId:
      name: id
      in: path
      required: true
      description: |
        The webhook id.
      schema:
        type: string
        minLength: 1
  responses:
    Unauthorized:
      description: |
        Authentication failed. A request that carries any of the headers `x-actor-id`, `x-actor-type`, `x-organization-id`, `x-permissions` or `x-scopes` (or any header whose name starts with `x-actor-`) is 401 `header_identity_rejected`, whatever the token.
      x-noblecloak-problem-types:
        - unauthorized
        - invalid_token
        - wrong_audience
        - header_identity_rejected
        - dpop_unsupported
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        The caller is not permitted.
      x-noblecloak-problem-types:
        - forbidden
        - organization_context_required
        - insufficient_scope
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ForbiddenEntitlement:
      description: |
        The caller is not permitted, or the organisation is not entitled to this route.
      x-noblecloak-problem-types:
        - forbidden
        - entitlement_required
        - organization_context_required
        - insufficient_scope
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ForbiddenNotEligible:
      description: |
        The caller is not eligible to resolve this obligation.
      x-noblecloak-problem-types:
        - not_eligible
        - forbidden
        - organization_context_required
        - insufficient_scope
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ForbiddenNotOwner:
      description: |
        Only the principal that created the obligation may read its Resumption.
      x-noblecloak-problem-types:
        - not_owner
        - forbidden
        - organization_context_required
        - insufficient_scope
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: |
        No such resource for this caller.
      x-noblecloak-problem-types:
        - not_found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotAvailableOnDeployment:
      description: |
        Not found, or not served on this deployment.
      x-noblecloak-problem-types:
        - not_available_on_deployment
        - not_found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: |
        The request does not match the schema.
      x-noblecloak-problem-types:
        - invalid_request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequestCreateApproval:
      description: |
        The request does not match the schema, or asserts an identity.
      x-noblecloak-problem-types:
        - invalid_request
        - identity_not_accepted
        - callback_unroutable
        - invalid_continuation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequestRecord:
      description: |
        The request does not match the schema, or supplies a server-derived field.
      x-noblecloak-problem-types:
        - invalid_request
        - attestation_not_accepted
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequestCallback:
      description: |
        The request does not match the schema, or the callback is not public-routable.
      x-noblecloak-problem-types:
        - invalid_request
        - callback_unroutable
        - invalid_continuation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConflictResolve:
      description: |
        The approval cannot be resolved as requested.
      x-noblecloak-problem-types:
        - already_resolved
        - approval_conflict
        - obligation_expired
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConflictWithdraw:
      description: |
        The approval can no longer be withdrawn.
      x-noblecloak-problem-types:
        - already_resolved
        - obligation_consumed
        - obligation_expired
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConflictConsume:
      description: |
        The obligation cannot be consumed as requested.
      x-noblecloak-problem-types:
        - approval_conflict
        - obligation_consumed
        - obligation_expired
        - continuation_expired
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConflictResumption:
      description: |
        The Resumption is no longer available (consumed, expired or withdrawn).
      x-noblecloak-problem-types:
        - already_resumed
        - obligation_consumed
        - obligation_expired
        - obligation_withdrawn
        - continuation_expired
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConflictContinuation:
      description: |
        The open obligation already has a different continuation.
      x-noblecloak-problem-types:
        - continuation_conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConflictCreateApproval:
      description: |
        The open obligation already has a different continuation, or an identical call was rejected within the window of the duplicate-requests policy (`rejected_duplicate`, with `rejected_approval_id`).
      x-noblecloak-problem-types:
        - continuation_conflict
        - rejected_duplicate
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConflictPolicy:
      description: |
        Another published policy already governs one of this policy's (tool, subject) pairs; `policy_id` names it.
      x-noblecloak-problem-types:
        - policy_conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConflictPrincipalBound:
      description: |
        The service principal is already bound to another agent (rev 13); `agent_id` names that agent.
      x-noblecloak-problem-types:
        - principal_bound
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConflictConnection:
      description: |
        The organisation already has a registration of the same tool server (`connection_exists`); `connection_id` names it when the caller may read it.
      x-noblecloak-problem-types:
        - connection_exists
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessablePolicyForm:
      description: |
        The policy uses a kind, a subject type, a target form, a mode or a config member this deployment cannot enforce; `member` names it (rev 13; a rev 12 deployment names it in `detail`).
      x-noblecloak-problem-types:
        - unsupported_policy_form
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessablePolicyWrite:
      description: |
        As `UnprocessablePolicyForm`, or (rev 14) the body targets a deployment-applied reference, whose policy is fixed (`policy_immutable`).
      x-noblecloak-problem-types:
        - unsupported_policy_form
        - policy_immutable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MethodNotAllowedGoverned:
      description: |
        A governed run is created by the platform.
      x-noblecloak-problem-types:
        - governed_run_not_creatable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableContinuation:
      description: |
        The deployment does not serve approvals, so it cannot store the continuation of a step-up.
      x-noblecloak-problem-types:
        - continuation_unsupported
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableIdempotency:
      description: |
        The Idempotency-Key was used with a different request.
      x-noblecloak-problem-types:
        - idempotency_key_reuse
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableCreateApproval:
      description: |
        The Idempotency-Key was used with a different request, the deployment cannot open or route an approval for the tool, or (rev 14) it refuses a deployment-applied proposal (`proposal_refused`, with `code`).
      x-noblecloak-problem-types:
        - idempotency_key_reuse
        - approval_unroutable
        - proposal_refused
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: |
        Rate limit exceeded.
      x-noblecloak-problem-types:
        - rate_limited
      headers:
        Retry-After:
          description: |
            The seconds to wait before retrying, when the deployment can say. The body carries the same value as `retry_after_seconds`.
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: |
        The request body is larger than this deployment accepts. `max_bytes` says how large it may be, when the deployment can say.
      x-noblecloak-problem-types:
        - payload_too_large
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequestDecisionBatch:
      description: |
        The request does not match the schema, the batch has more decisions than this deployment accepts (`batch_too_large`, with `max_items`), or an element's continuation is refused (`callback_unroutable`, `invalid_continuation`).
      x-noblecloak-problem-types:
        - invalid_request
        - batch_too_large
        - callback_unroutable
        - invalid_continuation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequestResolveBatch:
      description: |
        The request does not match the schema, or the batch has more elements than this deployment accepts (`batch_too_large`, with `max_items`).
      x-noblecloak-problem-types:
        - invalid_request
        - batch_too_large
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequestRecordBatch:
      description: |
        The request does not match the schema, supplies a server-derived field, or the batch has more records than this deployment accepts (`batch_too_large`, with `max_items`).
      x-noblecloak-problem-types:
        - invalid_request
        - attestation_not_accepted
        - batch_too_large
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConflictToolLevel:
      description: |
        The tool's side-effect level would fall.
      x-noblecloak-problem-types:
        - side_effect_level_downgrade
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableToolRef:
      description: |
        The tool reference is one this deployment does not let a caller register.
      x-noblecloak-problem-types:
        - reserved_tool_ref
        - system_tool_ref
        - tool_ref_in_use
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: |
        The deployment failed to answer. The request may be retried.
      x-noblecloak-problem-types:
        - internal_error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: |
        The deployment cannot answer right now. Retry later. `reason` names the cause when the deployment can (`eligibility_lookup`: it could not determine whether the caller may resolve an approval).
      x-noblecloak-problem-types:
        - service_unavailable
      headers:
        Retry-After:
          description: |
            The seconds to wait before retrying, when the deployment can say. The body carries the same value as `retry_after_seconds`.
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: |
        An RFC 9457 problem. `type` is a stable URI whose last path segment is the problem code.
      required:
        - type
        - title
        - status
        - request_id
      properties:
        type:
          type: string
          format: uri
          examples:
            - https://docs.noblecloak.com/problems/approval_conflict
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
          minLength: 1
          description: |
            The id of this request, of the same kind as `meta.request_id` on a success envelope. Every problem this API produces carries one, a server failure included, and it is never empty.
        max_items:
          type: integer
          minimum: 1
          maximum: 100
          description: |
            Only on `batch_too_large`: the most items this deployment accepts in the batch, so a client that never read `limits` on the capabilities can split the batch and retry.
        retry_after_seconds:
          type: integer
          minimum: 0
          description: |
            Only on `service_unavailable` and `rate_limited`, and only when the response carries the `Retry-After` header: the same number of seconds. A browser reads a response header cross-origin only if the server lists it, and it can always read the body.
        reason:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: |
            Only on `service_unavailable`: a code token naming the cause. The documented value is `eligibility_lookup` (the deployment could not determine whether the caller may resolve an approval, so it answers 503 and never a digest-only view or a refusal). A client treats a well-formed value it does not know as a plain 503; a client that matches on `type` keeps working.
        max_bytes:
          type: integer
          minimum: 1
          description: |
            Only on `payload_too_large`: the most bytes of body this deployment accepts, when it can say.
        policy_id:
          type: string
          minLength: 1
          description: |
            Only on `policy_conflict`: the published policy that already governs one of the (tool, subject) pairs of the policy being published.
        rejected_approval_id:
          type: string
          minLength: 1
          description: |
            Only on `rejected_duplicate`: the most recent rejected approval, within the window, whose identity the request repeats, readable under the rules of Who sees an approval.
        connection_id:
          type: string
          minLength: 1
          description: |
            Only on `connection_exists` (rev 11): the existing registration of the same server, when the caller may read it (see `Owner`); absent otherwise.
        agent_id:
          type: string
          minLength: 1
          description: |
            Only on `principal_bound` (rev 13): the agent the service principal is already bound to. Always present on `principal_bound`.
        member:
          type: string
          minLength: 1
          pattern: ^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*|\[[0-9]+\])*$
          description: |
            Only on `unsupported_policy_form` (rev 13) and on `proposal_refused` (rev 14, where it is present when the refusal has a part of the body to name), and (rev 16) on an `invalid_request` that refuses a fact binding or a condition, for example `facts.amount.path` or `config.rules[0].when[1].fact`: the member of the request body the deployment cannot enforce, as a dotted and bracketed path into the body as sent, for example `subjects[0].type`, `config.mode`, `subject`, on `POST /v1/policies/simulate` `policies[2].subjects[0].type`, or on `proposal_refused` `action.arguments.policies[1].policy.targets.tools[0]`. Keys are the member names as sent; an index is a decimal integer; the first segment is a top-level member of the request body. `detail` stays human prose. A client reads `member`, and falls back to `detail` when a rev 12 deployment omits it.
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: |
            Only on `proposal_refused` (rev 14), and always present on it: why the proposal was refused. The documented values are `not_a_user`, `shape`, `unknown_agent`, `principal_bound`, `tool_ref_in_use`, `target_unknown`, `baseline_exists` and `tightening_looser` (see `PolicySetProposal`). A client treats a well-formed value it does not know as a plain refusal; a client that matches on `type` keeps working.
    Meta:
      type: object
      required:
        - request_id
        - deployment
      properties:
        request_id:
          type: string
        deployment:
          type: string
          enum:
            - hosted
            - edge
        cursor:
          type:
            - string
            - "null"
        next:
          type:
            - string
            - "null"
          description: |
            Pass as `cursor` for the next page; null on the last page.
    Timestamp:
      type: string
      format: date-time
    Digest:
      type: string
      pattern: ^[0-9a-f]{64}$
      description: |
        Lowercase hex SHA-256.
    SideEffectLevel:
      type: string
      description: |
        How much a tool can change. The levels rank `read` < `write` = `external` < `delete` < `admin`: `write` and `external` are the same governance tier, so a tie counts as no change. A tool's level never falls: a move to a strictly lower rank is 409 `side_effect_level_downgrade`; a move to a higher rank, or between `write` and `external` in either direction, is allowed. The order of the members of this list is the order the vocabulary is written in, not the ranking.
      enum:
        - read
        - write
        - delete
        - external
        - admin
    DecisionValue:
      type: string
      description: |
        `defer` is reserved and has no emitter in v1.
      enum:
        - allow
        - deny
        - step_up
        - defer
    ObligationKind:
      type: string
      enum:
        - tool_invocation
        - spending
    Resolution:
      type: string
      description: "How an approval was resolved. Open-ended: the documented values are `approved`, `rejected` and `escalated`, and a client treats any other value as a resolution it does not act on. Known values: approved | rejected | escalated."
      x-noblecloak-known-values:
        - approved
        - rejected
        - escalated
    ApprovalState:
      type: string
      description: |
        The state of an approval. Separate from its resolution.
      enum:
        - pending
        - approved
        - rejected
        - consumed
        - expired
        - withdrawn
    PrincipalKind:
      type: string
      enum:
        - user
        - agent
        - service
        - group
        - role
    PrincipalRef:
      type: object
      description: |
        A principal by id and kind, never by name. A record's `actor` and a Resumption's `approver` are this shape: a name is shown only inside an approval (see `NamedPrincipalRef` and Who is named on an approval).
      required:
        - id
        - kind
      properties:
        id:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/PrincipalKind"
    NamedPrincipalRef:
      type: object
      description: |
        A principal as an approval names it: `PrincipalRef` with an optional name. Used only where the reference is part of an approval representation (`Approval.requester`, `Approval.approver`, the entries of `Approval.resolution_history`, the principals of `Approval.waiting_on`), and shown only to a reader who can see that approval.
      required:
        - id
        - kind
      properties:
        id:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/PrincipalKind"
        display_name:
          type: string
          minLength: 1
          description: |
            The name the deployment knows the principal by. Optional: absent when the deployment cannot name the principal, never the id repeated and never null (see Who is named on an approval).
    PolicyRef:
      type: object
      required:
        - id
        - version
      properties:
        id:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 0
    DecisionPolicy:
      type: object
      required:
        - id
        - version
        - side_effect_level
      properties:
        id:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 0
        side_effect_level:
          $ref: "#/components/schemas/SideEffectLevel"
    ActorHint:
      type: object
      description: |
        Hints about who is acting. The principal is the token's and is never read from here. `run_id` names an `external` run the caller owns and selects its scope. A deployment that does not advertise `runs` has no run to name, so a `run_id` there is 404 `not_found`, whatever its value. On a deployment that does advertise `runs`, a `run_id` that names no run the caller owns is 403 `forbidden`. `run_id` selects the scope and nothing else: the `agent_id` of the run it names never selects which policies apply to the call either (rev 13). `agent_id` is a display hint (rev 13): a deployment may show it, and it never selects which policies apply to the call. An agent's policies apply through the service principal bound to the agent (see Agent identity).
      additionalProperties: false
      properties:
        agent_id:
          type: string
          minLength: 1
          description: |
            A display hint, never identity (rev 13). For a caller with no bound agent, `Approval.agent` reflects this client-supplied value, which the deployment has not verified.
        run_id:
          type: string
          minLength: 1
    Action:
      type: object
      description: |
        What is about to run. Exactly one of `arg_digest` (the digest of the arguments as sent) or `arguments` (the arguments themselves, which the server digests). Rev 16: the facts a policy's rules test are read from `arguments` through the tool's fact bindings (`Tool.facts`); a call that sends only `arg_digest` has no facts, so a rule that needs one is unevaluable and its policy asks.
      required:
        - tool_ref
      additionalProperties: false
      properties:
        tool_ref:
          type: string
          minLength: 1
        method:
          type: string
          minLength: 1
        arg_digest:
          $ref: "#/components/schemas/Digest"
        arguments:
          type: object
          additionalProperties: true
      oneOf:
        - required:
            - arg_digest
        - required:
            - arguments
    Resource:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
        id:
          type: string
        properties:
          type: object
          additionalProperties: true
    DecisionContext:
      type: object
      additionalProperties: false
      properties:
        invocation_channel:
          $ref: "#/components/schemas/InvocationChannel"
        call_id:
          type: string
        group_id:
          type: string
    InvocationChannel:
      type: string
      enum:
        - interactive
        - headless
        - workflow
      description: |
        How the call was made. The same enum and meaning wherever it appears.
    RecordContext:
      type: object
      description: |
        The context a record carries: the invocation channel only. `call_id` and `group_id` belong to a decision request and are not accepted on a record.
      additionalProperties: false
      properties:
        invocation_channel:
          $ref: "#/components/schemas/InvocationChannel"
    Continuation:
      type: object
      description: |
        How the runtime is told that an approval resolved. One continuation per obligation. `correlation` is opaque, at most 8 KiB, and never an input to identity. `callback_url` is required if and only if `delivery` is `push`, must be https and public-routable: the server resolves the host and refuses loopback, RFC 1918, link-local and cloud-metadata ranges, follows no redirects, and checks again at every delivery. Wherever a continuation is echoed (`Approval.continuation`, the Resumption, the approval stream) it is the same JSON value as was sent; the order of an object's members and insignificant whitespace are not preserved and carry no meaning, and two continuations are the same when their RFC 8785 canonical forms are equal. A deployment may refuse a delivery it does not serve with 400 `invalid_continuation`, after the `callback_url` check for a push.
      required:
        - kind
        - delivery
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - adk
            - langgraph
            - vercel_ai
            - openai_agents
            - webhook
            - mcp_held
            - agt
        delivery:
          type: string
          enum:
            - push
            - pull
            - held
        correlation:
          type: object
          additionalProperties: true
        callback_url:
          type: string
          format: uri
          pattern: ^https://
        expires_at:
          $ref: "#/components/schemas/Timestamp"
          description: |
            The continuation's own validity. It is separate from the approval's per-policy `expires_after`.
      if:
        properties:
          delivery:
            const: push
      then:
        required:
          - callback_url
    DecisionRequest:
      type: object
      required:
        - action
      additionalProperties: false
      properties:
        actor:
          $ref: "#/components/schemas/ActorHint"
        action:
          $ref: "#/components/schemas/Action"
        resource:
          $ref: "#/components/schemas/Resource"
        context:
          $ref: "#/components/schemas/DecisionContext"
        continuation:
          $ref: "#/components/schemas/Continuation"
        expect_approval_id:
          type: string
          description: |
            A hint only, used to log a mismatch. This route never consumes.
    DecisionBatchRequest:
      type: object
      required:
        - requests
      additionalProperties: false
      properties:
        requests:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/DecisionRequest"
    ApprovalHandle:
      type: object
      description: |
        The obligation a step-up decision opened or matched. It never carries `arguments`: they are read from `GET /v1/approvals/{id}` only.
      required:
        - id
        - state
        - created
        - created_at
        - resume_token_will_issue
      properties:
        id:
          type: string
          description: |
            The approval id. It MUST be unguessable: not sequential and not derivable from the action, the scope or any other value a caller can compute. The 403 `not_eligible` that resolve, approve and deny answer to a service principal on kind alone shows that an approval with the id exists, and that exception relies on this (see Who sees an approval).
        state:
          $ref: "#/components/schemas/ApprovalState"
        created:
          type: boolean
          description: |
            True when this call opened the obligation, false when it matched an open one.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        resume_token_will_issue:
          type: boolean
          description: |
            True when the Resumption will carry a `resume_token` the caller must consume through `/consume`. When it is `false` the caller will receive no `resume_token`, has nothing to consume, and must not execute the action itself: the deployment executes the tool. A caller that holds a local function under a tool reference the deployment executes denies the call instead of running it, and withdraws the approval if its own decision opened it (`created`).
    Condition:
      type: object
      description: |
        A non-human condition a `defer` decision waits on. Reserved.
      required:
        - kind
      properties:
        kind:
          type: string
        resume_at:
          $ref: "#/components/schemas/Timestamp"
        ref:
          type: string
    Decision:
      type: object
      description: |
        What the server decided for one action. `policy` is optional: absent means no explicit policy matched and the default applied, and when present its `id` and `version` are required and never null.
      required:
        - decision
        - action_digest
        - enforced
      properties:
        decision:
          $ref: "#/components/schemas/DecisionValue"
        reason:
          type: string
          description: |
            For example `not_granted`, `rate_limited`, `unknown_tool`, `approval_unroutable`, `rejected_duplicate`, `credential_link_required` (rev 11: a `deny` for a direct call by a caller with no usable credential link to the `per_user` registration of the tool, when no approval is opened).
        action_digest:
          $ref: "#/components/schemas/Digest"
          description: |
            The argument digest the server computed for the action as received.
        policy:
          $ref: "#/components/schemas/DecisionPolicy"
          description: |
            The policy that decided; absent when the default applied. Where several policies contributed to the decision (rev 11; see `policies.tightest_wins` on `Capabilities.features`), it names one of the entries that contributed, the deployment's choice: the `considered` of a simulation lists the set.
        approval:
          $ref: "#/components/schemas/ApprovalHandle"
        enforced:
          type: boolean
        would_be:
          $ref: "#/components/schemas/DecisionValue"
        condition:
          $ref: "#/components/schemas/Condition"
        rejected_approval_id:
          type: string
          minLength: 1
          description: |
            Only on a `deny` with reason `rejected_duplicate` (rev 10): the most recent rejected approval, within the window, whose identity this call repeats, readable under the rules of Who sees an approval. Absent on every other decision.
        missing_facts:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/FactName"
          description: |
            Rev 16: on a `step_up`, the facts with no value that stopped the rule walk of a policy that contributed to it (see the evaluation in `ToolInvocationConfig`), each once, in the order the policies and their rules name them. Absent when every contributing policy's result came from a rule that matched or from its `mode`, and on every other decision. Set only by a deployment that lists the feature `policies.rules`.
    CreateApprovalRequest:
      type: object
      required:
        - action
        - continuation
      additionalProperties: false
      properties:
        action:
          $ref: "#/components/schemas/Action"
        continuation:
          $ref: "#/components/schemas/Continuation"
        run_id:
          type: string
          minLength: 1
        resource:
          $ref: "#/components/schemas/Resource"
        context:
          $ref: "#/components/schemas/DecisionContext"
    HistoryEntry:
      type: object
      required:
        - resolution
        - by
        - at
      properties:
        resolution:
          $ref: "#/components/schemas/Resolution"
        by:
          $ref: "#/components/schemas/NamedPrincipalRef"
        at:
          $ref: "#/components/schemas/Timestamp"
        reason:
          type: string
          description: |
            Why, in the resolver's words. Rev 14: on a deployment-applied approval that the deployment refused to apply when it was approved, the entry has `resolution: rejected`, `by` the administrator whose approval was refused, and `reason` of the form `proposal_refused:<code>`, where `<code>` is a `Problem.code` of `proposal_refused` or `policy_conflict` (see Deployment-applied proposals).
    Approval:
      type: object
      description: |
        An approval. `continuation_kind` is visible to every reader of the approval. `continuation`, the full continuation the approval was opened with, is present only when the reader is the principal that created the approval, in every state (pending, approved, rejected, consumed, expired, withdrawn); for every other reader the member is absent. A service principal reads only the approvals it created (see Who sees an approval). `policy` is optional: absent means no explicit policy matched and the default applied; it is never synthesised and never null, and when present its `id` and `version` are required.
      required:
        - id
        - state
        - tool_ref
        - obligation_kind
        - action_digest
        - scope_id
        - side_effect_level
        - created_at
      properties:
        id:
          type: string
          description: |
            The approval id. It MUST be unguessable: not sequential and not derivable from the action, the scope or any other value a caller can compute. The 403 `not_eligible` that resolve, approve and deny answer to a service principal on kind alone shows that an approval with the id exists, and that exception relies on this (see Who sees an approval).
        state:
          $ref: "#/components/schemas/ApprovalState"
        resolution:
          $ref: "#/components/schemas/Resolution"
        tool_ref:
          type: string
        obligation_kind:
          $ref: "#/components/schemas/ObligationKind"
        action_digest:
          $ref: "#/components/schemas/Digest"
        arguments:
          type: object
          additionalProperties: true
          description: |
            The arguments as the caller sent them (their digest is `action_digest`). Present only on `GET /v1/approvals/{id}`, and only when the tool has `show_arguments_to_approvers` on at the time of the read, the approval is not final and the reader is the principal that created it or one eligible to approve it; absent everywhere else, and then the digest is all a reader sees (see Who sees the arguments of an approval).
        arguments_state:
          type: string
          enum:
            - shown
            - not_enabled
            - not_sent
            - withheld
            - final
          description: |
            Why a read shows the arguments or not. Present on `GET /v1/approvals/{id}` and on each approval of `GET /v1/approvals`; a stream event may omit it, and a client then treats the state as unknown. `shown`: `arguments` is present (never on a list row, which carries no `arguments`; the state there says what the single read would show). `not_enabled`: the tool's `show_arguments_to_approvers` is off. `not_sent`: the approval holds no arguments, because the request that opened it carried only `arg_digest` or the setting was off then. `withheld`: the reader is neither the creator nor eligible to approve. `final`: the approval is in a final state. A reader who is neither the creator nor eligible to approve is told `final` for an approval in a final state and `withheld` otherwise, never `not_enabled`, `not_sent` or `shown`; the creator and an eligible approver are told the first of `final`, `not_enabled`, `not_sent`, `shown` that applies, never `withheld`. It discloses nothing of the arguments (see Who sees the arguments of an approval).
        scope_id:
          type: string
        side_effect_level:
          $ref: "#/components/schemas/SideEffectLevel"
        policy:
          $ref: "#/components/schemas/PolicyRef"
        requester:
          $ref: "#/components/schemas/NamedPrincipalRef"
          description: |
            The principal that created the approval. Present on every representation to any reader who can see the approval (see Who is named on an approval).
        waiting_on:
          type: object
          required:
            - count
          description: |
            Who a pending approval waits on, to the principal that created it and to no one else, on `GET /v1/approvals/{id}` only: never a row of `GET /v1/approvals` or an event of the stream. `count` is the number of principals eligible to resolve the approval that the deployment knows of at the time of the read; it may be zero, may change between reads, and is not a promise that any of them has been notified. `principals` is at most five of them. Rev 16: on an approval that carries `requirements`, the principals counted are those eligible for at least one unmet requirement, never the creator. Absent on an approval that is not pending and for every other reader, and absent when the deployment cannot determine who is eligible (the read is still 200, never an error on that account). For a service-principal creator `principals` is omitted and only the count is given.
          properties:
            count:
              type: integer
              minimum: 0
            principals:
              type: array
              maxItems: 5
              items:
                $ref: "#/components/schemas/NamedPrincipalRef"
        on_deny:
          type: string
          enum:
            - resume
            - halt
          description: |
            What the requester's run does when the approval is denied, as the policy that matched stated it when the approval was created (rev 9): a snapshot of that policy's `on_deny`, so a later edit of the policy does not change an approval that already exists. It is the creator's alone, on every representation of the approval that the creator reads, and absent for every other reader. It is absent when no named policy matched (`policy` is absent), when the matching policy states none, and when the matching policy's mode is not `ask` or `escalate`, where `ToolInvocationConfig` makes `on_deny` illegal. A deployment that does not implement `on_deny` on its policies omits it from every approval, and a client then treats what a deny does as not stated, never as `resume` or `halt`.
        prior_rejections:
          type: object
          required:
            - count
            - last_at
          description: |
            Set when the approval was opened for an identity a resolver had already rejected, because the organisation's duplicate-requests policy says `ask_again` (rev 10; see Terminal states free the identity): `count` is the number of a resolver's rejections of this identity within the policy's window since its last consumed approval, and `last_at` is when the latest of them was resolved. Present on every representation of the approval (the single read, a row of the list, a stream event) to every reader who can see the approval, and absent on an approval opened for an identity with no such rejection. A deployment that does not advertise `approvals.rejected_duplicate` never sets it.
          properties:
            count:
              type: integer
              minimum: 1
            last_at:
              $ref: "#/components/schemas/Timestamp"
        blocked_on:
          type: object
          required:
            - reason
            - connection_id
          description: |
            Rev 11: the call would run through the deployment as a principal with no usable credential link (none, consent not `given`, or `degraded`) to the `per_user` registration `connection_id`. It is shown only to the principal the call would run as (the run's owner; on a direct call, the creator), on the single read and on a row of the list, and is absent for every other reader and on every stream event. An approval with `blocked_on` may still be resolved; the deployment does not execute the call or issue its resume token while it is present, and clears it once that principal's link is `linked` with `consent: given`. It follows that link on every read of a pending or approved approval: revoking consent sets it again. The way out is the link routes: `POST /v1/connections/{connection_id}/link`, then, for a registration whose `auth_kind` is `oauth`, `POST /v1/connections/{connection_id}/authorize`. A deployment that does not advertise `connections.user_links`, and so every edge deployment, never sets it.
          properties:
            reason:
              type: string
              description: |
                Why the call waits. `credential_link_required`: the principal needs a usable link to the registration. Open-ended: a client treats a value it does not know as a block it cannot clear itself.
              x-noblecloak-known-values:
                - credential_link_required
            connection_id:
              type: string
              minLength: 1
        agent:
          type: object
          description: |
            The agent the approval names. For a caller bound to an agent it is that agent. For a caller with no bound agent it reflects the client's unverified `actor.agent_id` hint (rev 13): display only, and an approver must not treat it as identity.
          required:
            - id
          properties:
            id:
              type: string
            name:
              type: string
              minLength: 1
              description: |
                The agent's name (`Agent.name`), when the deployment can say. Absent otherwise.
            parent:
              type:
                - string
                - "null"
        run:
          type: object
          required:
            - id
            - kind
          properties:
            id:
              type: string
            kind:
              type: string
              enum:
                - external
                - governed
        continuation_kind:
          type: string
        continuation:
          $ref: "#/components/schemas/Continuation"
          description: |
            The continuation as it was sent, echoed to the principal that created the approval and to no one else. It is echoed as the same JSON value, not the same bytes: the order of an object's members and insignificant whitespace are not preserved and carry no meaning, so a deployment that keeps JSON in a normalising store may return the members in another order.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        resolved_at:
          type:
            - string
            - "null"
          format: date-time
        approver:
          $ref: "#/components/schemas/NamedPrincipalRef"
        outcome_record_id:
          type:
            - string
            - "null"
          description: |
            The record that reported what happened after consumption.
        resolution_history:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
        preview:
          $ref: "#/components/schemas/ApprovalPreview"
          description: |
            Rev 14: what approving a deployment-applied approval would change, computed when it was opened. Present only on `GET /v1/approvals/{id}`, only while the approval is `pending`, and only to a reader who may approve it; absent on every other representation, for every other reader and on an approval of an ordinary tool. A rev 13 reader never needs it.
        available_actions:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalAction"
          description: |
            Rev 15: what the reader may do on this approval, with the deployment's wording and the inputs each action takes. Present only on `GET /v1/approvals/{id}`, only while the approval is `pending`, and only to a reader who may resolve it, and only on a deployment that lists the feature `approvals.available_actions`; absent on every other representation (a list row, a stream event) and for every other reader. The `resolution` of each `resolve` action is one of `Capabilities.resolutions`. On a deployment that does not list `approvals.available_actions`, absent means the deployment does not say, and a client derives approve and deny from `Capabilities.resolutions`. On a deployment that lists it, absent means no action for this reader, and a client derives none. Being listed is not authorisation: resolving still decides eligibility when it is called. A rev 14 reader never needs it.
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalRequirement"
          description: |
            Rev 16: what must be met before the approval is approved, one entry per requirement. Each policy whose result asked and that contributed to the step-up that opened the approval (for one opened through `POST /v1/approvals`, the step-up a decision of the same call would give) contributes one requirement, and two policies whose approver entries in force and `exclude` are the same (an entry listed twice counts once) contribute one requirement between them, which lists both. Present on every representation of the approval to every reader who can see it, on a deployment that lists the feature `approvals.requirements`, and only there: a deployment that does not list it never sets the member. Where the feature is listed, an approval without the member has one requirement, satisfied as before rev 16.

            Joining: a decision or `POST /v1/approvals` whose call matches an open approval joins it (two requirements are the same when their approver entries and `exclude` are). A `pending` approval that lacks requirements the call sets gains them, unmet, and emits `approval.updated`, so a joined `pending` approval never carries fewer requirements than the call sets. An `approved` approval that has not been consumed is joined as it is: its requirements are the ones in force when it was approved, and a requirement the call sets later is not added to it and does not open another approval. An approval binds the decision it answered, the same reason `on_deny` and the organisation's break-glass setting are fixed when the approval opens, and there is one approval per call identity at a time.

            Approve: the approver satisfies every unmet requirement they are eligible for, so one person may satisfy several, and the approval is `approved` once every requirement is met. An approve that leaves a requirement unmet answers 200 with the approval still `pending`, no `resolution`, and the requirements it satisfied recording the approver; it emits `approval.updated`. Reject: any principal eligible for at least one unmet requirement rejects the approval, whatever has been met. An approve or reject by a principal eligible for no unmet requirement is 403 `not_eligible` while the approval is `pending`; once it is not, a principal eligible for any of its requirements is answered as before rev 16 (409 `already_resolved` for an approval already resolved). The rules on the creator (see Who may resolve, and `Capabilities.self_approval_from_approver_surface`) apply on top: a requirement whose `exclude` holds `requester` is never satisfied by the creator, from any surface. A rev 15 reader never needs it.
    ApprovalRequirement:
      type: object
      description: |
        Rev 16: one requirement of an approval. Who is eligible for it: a holder of one of its `approvers` (a role the principal holds when it acts, or the user named); with `approvers` empty, an administrator of the organisation. When the organisation's `approval_routing` setting has `org_admin_break_glass` on (the default), an administrator of the organisation is eligible for every requirement too, and satisfies it with `basis: break_glass`. A principal `exclude` names is eligible for none of it, whatever else holds.
      required:
        - id
        - policies
        - approvers
        - exclude
        - needed
        - met
        - approvals
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          description: |
            Stable within the approval.
        policies:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PolicyRef"
          description: |
            The policies that contributed the requirement, at the versions that decided.
        approvers:
          type: array
          items:
            $ref: "#/components/schemas/ApproverRef"
          description: |
            The approver entries in force when the approval was opened (the matching rule's `approvers` when it had them, else the policy's, keeping only the entries whose `when` held). Empty: the organisation's administrators.
        exclude:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - requester
        needed:
          type: integer
          minimum: 1
          description: |
            How many eligible principals must approve to meet it. Always 1 in rev 16.
        met:
          type: boolean
        approvals:
          type: array
          items:
            type: object
            required:
              - by
              - at
              - basis
            additionalProperties: false
            properties:
              by:
                $ref: "#/components/schemas/NamedPrincipalRef"
              at:
                $ref: "#/components/schemas/Timestamp"
              basis:
                type: string
                enum:
                  - listed
                  - break_glass
                description: |
                  `listed`: the approver was eligible for the requirement itself. `break_glass`: an administrator of the organisation under the `approval_routing` setting.
          description: |
            The approvals that count toward it, oldest first.
    ApprovalPreview:
      type: object
      description: |
        What approving a `tool:noblecloak:propose-policy-set` approval would change (rev 14), computed by the deployment when the approval is opened from the proposed bodies, with nothing stored, as `POST /v1/policies/simulate` does. It is no part of `arguments`.
      required:
        - simulations
        - loosening
      additionalProperties: false
      properties:
        simulations:
          type: array
          description: |
            One entry for each tool that the proposal's policies govern, in the order the tools first appear in `policies`: the decision for a call to that tool, composed for the agent of the proposal, as a simulation as `{ type: agent, id: <agent.id> }` with every proposed body standing beside the policies in force and the proposal's tools registered. Once the agent is bound, the bound service principal holds exactly those policies.
          items:
            type: object
            required:
              - tool_ref
              - result
            additionalProperties: false
            properties:
              tool_ref:
                type: string
                minLength: 1
              result:
                $ref: "#/components/schemas/SimulateResult"
        loosening:
          type: array
          description: |
            One entry for each `baseline` policy of the proposal whose mode is looser than the mode the deployment's own default gives the tool (the mode of the `considered` entry with `source` `default` that a simulation lists when no policy of the kind matched; for a tool this proposal registers, the mode it would have once registered). `deny` is tighter than `ask` and `escalate`, which are tighter than `always_allow`. A baseline that keeps or tightens the default has no entry, so an empty list says that approving loosens nothing.
          items:
            type: object
            required:
              - tool_ref
              - from
              - to
            additionalProperties: false
            properties:
              tool_ref:
                type: string
                minLength: 1
              from:
                $ref: "#/components/schemas/PolicyMode"
              to:
                $ref: "#/components/schemas/PolicyMode"
    ApprovalActionInput:
      type: object
      description: |
        One input of an `ApprovalAction` (rev 15): a value the person may give when they take the action. The input named `reason` fills `ResolveRequest.reason`; any other name is a member of `ResolveRequest.input`.
      required:
        - name
        - type
        - label
        - required
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          description: |
            How the input is entered. Open-ended: the documented value is `text`, and a client does not offer an action that has an input of a type it does not know.
          x-noblecloak-known-values:
            - text
        label:
          type: string
          minLength: 1
          description: |
            The deployment's wording for the input.
        required:
          type: boolean
          description: |
            Whether the action is refused without a value for this input.
        max_length:
          type: integer
          minimum: 1
          description: |
            The most characters the deployment accepts for a `text` input.
    ApprovalAction:
      type: object
      description: |
        One thing a reader may do on one approval (rev 15), typed, with the deployment's own wording and the inputs it takes. Listed in `Approval.available_actions`. Being listed is not authorisation: resolving still decides eligibility when it is called.
      required:
        - id
        - kind
        - label
        - inputs
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          description: |
            Names the action; unique within the list.
        kind:
          type: string
          description: |
            What the action does. Open-ended: the documented value is `resolve`, and a client ignores an action whose kind it does not know.
          x-noblecloak-known-values:
            - resolve
        resolution:
          $ref: "#/components/schemas/ResolveResolution"
          description: |
            The resolution the action sends to `POST /v1/approvals/{id}/resolve`. Present exactly when `kind` is `resolve`.
        label:
          type: string
          minLength: 1
          description: |
            The deployment's wording for the action, for example the wording of a denial.
        inputs:
          type: array
          description: |
            The inputs the action takes, possibly none.
          items:
            $ref: "#/components/schemas/ApprovalActionInput"
    PolicySetAssessment:
      type: object
      description: |
        The proposer's own account (rev 14) of what a policy's tool can do, for the administrator who decides. The deployment stores it with the approval and enforces nothing from it.
      required:
        - side_effect_level
        - blast_radius
        - reversible
        - external_party
        - financial
      additionalProperties: false
      properties:
        side_effect_level:
          $ref: "#/components/schemas/SideEffectLevel"
        blast_radius:
          type: string
          enum:
            - one_record
            - many_records
            - org_wide
        reversible:
          type: boolean
        external_party:
          type: boolean
          description: |
            Whether the tool acts on, or sends something to, a party outside the organisation.
        financial:
          type: boolean
    PolicySetEntry:
      type: object
      description: |
        One policy of a `PolicySetProposal` (rev 14), with the reasons the proposer gives for it.
      required:
        - role
        - rationale
        - assessment
        - policy
      additionalProperties: false
      properties:
        role:
          type: string
          enum:
            - baseline
            - tightening
          description: |
            `baseline`: the organisation's policy for the tool, which every caller holds (`everyone`). `tightening`: a policy of the agent alone, which only tightens what the baseline and the other policies in force give the agent.
        rationale:
          type: string
          minLength: 1
          maxLength: 500
        assessment:
          $ref: "#/components/schemas/PolicySetAssessment"
        policy:
          $ref: "#/components/schemas/PolicyWrite"
    PolicySetProposal:
      type: object
      description: |
        The arguments of `tool:noblecloak:propose-policy-set` (rev 14): an agent's tools, its binding to a service principal and the policies that govern it, proposed together and applied together (see Deployment-applied proposals). The schema is closed. The whole `action.arguments` fits `limits.approval_arguments_max_bytes` where the deployment advertises one; the two caps of 50 keep a typical proposal well inside the 32 KiB that a deployment commonly sets, and an agent that needs more is proposed in several sets.
        **Rules beyond the schema.** A `baseline` is a `tool_invocation` policy with exactly one subject, `{ type: role, id: everyone }`, and `targets.tools` a list of exactly one `tool_ref`. A `tightening` is a `tool_invocation` policy with exactly one subject, `{ type: agent, id: <agent.id> }`, and `targets.tools` a list of exactly one `tool_ref`. No two entries of `tools` have the same `tool_ref`. No two entries of `policies` have the same target tool and subject. No policy targets a reference in the namespace `tool:noblecloak:`. A proposed policy's `config` carries `mode` only: any other member (`approver_groups`, `expires_after`, `on_deny`, or any other) and any `origin` is not proposed. The approver does see the arguments, but what the checks at open (loosening and tightening) and the preview compare is the mode alone, so a change to the routing, the expiry or `on_deny` would get no check and no preview line. A proposal that breaks one of these is refused with `code` `shape` and, where it has a part to name, that part as `member` (for example `action.arguments.policies[1].policy.config.approver_groups`).
        **Refusals at open (422 `proposal_refused`, rev 14).** `code` is one of: `not_a_user` (the caller is not a user, a service principal or an agent; only a person proposes); `shape` (the body breaks the schema or a rule above, or `agent.principal_id` names no service principal of the organisation; `member` names the part); `unknown_agent` (`agent.id` is no agent of the organisation; `member` `action.arguments.agent.id`); `principal_bound` (`agent.principal_id` is bound to another agent; `member` `action.arguments.agent.principal_id`); `tool_ref_in_use` (a tool of the proposal collides with a tool of the organisation, or with one the deployment dispatches another way; `member` `action.arguments.tools[<i>].tool_ref`); `target_unknown` (a policy targets a tool that is neither registered nor in this proposal's `tools`; `member` `action.arguments.policies[<i>].policy.targets.tools[0]`); `baseline_exists` (a published policy of the role `everyone` already governs the tool, so a baseline would loosen or replace it without anyone choosing to: propose a tightening instead; `member` `action.arguments.policies[<i>]`); `tightening_looser` (the tightening gives the agent a looser mode than the policies in force and the proposal's baselines compose to for that tool; `member` `action.arguments.policies[<i>]`). When several apply, which one is reported is the deployment's choice. Opening applies nothing and stores nothing but the approval and its preview.
        **A tightening for an agent that already has a policy for the tool.** No check at open refuses a tightening because a published `tool_invocation` policy of the same agent already governs its tool, by name or by `all`. Such a proposal may open when no other check refuses it, but approving it never applies it: it is refused with `proposal_refused:policy_conflict` (or another code, when a check run again refuses it first), because at most one published policy governs a (tool, subject) pair. Such a tightening is made by changing that policy, or by retiring it before the proposal is approved.
      required:
        - agent
        - policies
      additionalProperties: false
      properties:
        agent:
          type: object
          description: |
            The agent the proposal is for, a row of `/v1/agents` of the organisation. `principal_id`, when present, is a service principal of the organisation to bind to the agent on approval, as `PUT /v1/agents/{id}/principal` binds it; absent, the agent's binding is left as it is.
          required:
            - id
          additionalProperties: false
          properties:
            id:
              type: string
              minLength: 1
            principal_id:
              type: string
              minLength: 1
        tools:
          type: array
          maxItems: 50
          description: |
            Tools to register on approval, as `POST /v1/tools` registers them, each owned by the organisation (`owner_kind: org`) and with a `tool_ref` that starts `ext:`.
          items:
            allOf:
              - $ref: "#/components/schemas/ToolWrite"
              - type: object
                required:
                  - owner_kind
                properties:
                  tool_ref:
                    type: string
                    pattern: "^ext:"
                  owner_kind:
                    type: string
                    const: org
        policies:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/PolicySetEntry"
    ResolveResolution:
      type: string
      description: |
        What a caller may resolve an approval as. Closed: any other value, including one this API may return in a response, is 400 `invalid_request`.
      enum:
        - approved
        - rejected
        - escalated
    ResolveRequest:
      type: object
      required:
        - resolution
        - expected_action_digest
      additionalProperties: false
      properties:
        resolution:
          $ref: "#/components/schemas/ResolveResolution"
        reason:
          type: string
        input:
          type: object
          additionalProperties: true
          description: |
            Typed human input. Opaque in v1.
        expected_action_digest:
          $ref: "#/components/schemas/Digest"
          description: |
            The digest the approver saw. A mismatch is 409 `approval_conflict`.
    ResolveBatchItem:
      type: object
      description: |
        One element of a batch: the body of `POST /v1/approvals/{id}/resolve` and the id of the approval it names. `expected_action_digest` is required, as it is there: an approver resolves the call they saw.
      required:
        - approval_id
        - resolution
        - expected_action_digest
      additionalProperties: false
      properties:
        approval_id:
          type: string
          minLength: 1
        resolution:
          $ref: "#/components/schemas/ResolveResolution"
        reason:
          type: string
        input:
          type: object
          additionalProperties: true
          description: |
            Typed human input. Opaque in v1.
        expected_action_digest:
          $ref: "#/components/schemas/Digest"
          description: |
            The digest the approver saw. A mismatch is 409 `approval_conflict` for this element.
    ResolveBatchRequest:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ResolveBatchItem"
    ResolveBatchResult:
      description: |
        The outcome of one element: the `Approval` after resolution, or a problem document. A problem has `type` and no `id`; an approval has `id` and no `type`.
      oneOf:
        - $ref: "#/components/schemas/Approval"
        - $ref: "#/components/schemas/Problem"
    AliasResolveRequest:
      type: object
      required:
        - expected_action_digest
      additionalProperties: false
      properties:
        reason:
          type: string
        expected_action_digest:
          $ref: "#/components/schemas/Digest"
    Resumption:
      type: object
      description: |
        The signed statement that an approval resolved. `signature` is a JWS compact serialization (ES256, `kid` in the header) whose payload is the JCS form of this object without `signature`. The payload carries `tool_ref` and `obligation_kind` because a digest binds the arguments but not the tool. `policy` is optional: absent means no explicit policy matched and the default applied; it is never synthesised and never null, and when present its `id` and `version` are required.
      required:
        - approval_id
        - action_id
        - tool_ref
        - obligation_kind
        - resolution
        - action_digest
        - approver
        - resolved_at
        - expires_at
        - continuation
        - signature
      properties:
        approval_id:
          type: string
        action_id:
          type: string
          description: |
            An opaque server id for the action.
        tool_ref:
          type: string
        obligation_kind:
          $ref: "#/components/schemas/ObligationKind"
        resolution:
          $ref: "#/components/schemas/Resolution"
        action_digest:
          $ref: "#/components/schemas/Digest"
        approver:
          $ref: "#/components/schemas/PrincipalRef"
        resolved_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        policy:
          $ref: "#/components/schemas/PolicyRef"
        resume_token:
          type: string
          description: |
            Present if and only if the caller consumes through `/consume`. Never given to an approving browser.
        continuation:
          $ref: "#/components/schemas/Continuation"
          description: |
            The continuation the approval was opened with, echoed as the same JSON value, not the same bytes: member order and insignificant whitespace are not preserved and carry no meaning. The signature covers the JCS form of the object, which does not depend on member order.
        signature:
          type: string
          description: |
            The JWS compact serialization.
    ConsumeRequest:
      type: object
      required:
        - resume_token
        - action
      additionalProperties: false
      properties:
        resume_token:
          type: string
          minLength: 1
        action:
          allOf:
            - $ref: "#/components/schemas/Action"
          description: |
            The action as the runtime is about to run it.
    ConsumeResult:
      type: object
      required:
        - approval_id
        - state
        - consumed_at
        - tool_ref
        - action_digest
      properties:
        approval_id:
          type: string
        state:
          type: string
          const: consumed
        consumed_at:
          $ref: "#/components/schemas/Timestamp"
        tool_ref:
          type: string
        action_digest:
          $ref: "#/components/schemas/Digest"
    ContinuationTestRequest:
      type: object
      required:
        - continuation
      additionalProperties: false
      properties:
        continuation:
          $ref: "#/components/schemas/Continuation"
    ContinuationTestResult:
      type: object
      required:
        - valid
      properties:
        valid:
          type: boolean
        reachable:
          type:
            - boolean
            - "null"
          description: |
            Set for `push`, after a signed challenge.
        problems:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
    RecordOutcome:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - succeeded
            - failed
            - unknown
        summary:
          type: string
        error:
          type: string
    Record:
      type: object
      description: |
        One appended record. Linkage is by reference (`approval_id`, `GET /v1/records/{id}/chain`), not a hash chain. Field names are TRACE-shaped. A deployment derives any further per-record fields itself (the caller never supplies them), and there is no second record shape. `context` is optional; a deployment that needs the channel and does not receive it rejects the record with 400, it never defaults it.
      required:
        - id
        - ts
        - actor
        - tool_ref
        - decision
        - attestation
      properties:
        id:
          type: string
        ts:
          $ref: "#/components/schemas/Timestamp"
        actor:
          $ref: "#/components/schemas/PrincipalRef"
        tool_ref:
          type: string
        policy:
          $ref: "#/components/schemas/PolicyRef"
          description: |
            The policy that matched. Absent when no policy matched explicitly and the default applied, as on the decision object; when present, `id` and `version` are both required and never null.
        decision:
          $ref: "#/components/schemas/DecisionValue"
        approval_id:
          type: string
        approval_link:
          $ref: "#/components/schemas/ApprovalLink"
          description: |
            Whether the deployment linked this record to the approval named by `approval_id`. Present on the 201 of `POST /v1/records` (and of each element of `POST /v1/records/batch`) only when the request carried `approval_id`; absent on a read and on a record appended without one. The record is appended whether or not the link was made: a refused link is not an error and the status is 201 either way.
        outcome:
          $ref: "#/components/schemas/RecordOutcome"
        prompt_id:
          type: string
        context:
          $ref: "#/components/schemas/RecordContext"
          description: |
            The context the caller supplied when it appended the record. Absent when none was supplied.
        enforced:
          type: boolean
          description: |
            `false` means the decision was observed, not enforced, as on the decision object. Echoed as supplied; absent means `true`.
        degraded:
          $ref: "#/components/schemas/Degraded"
          description: |
            Present when the caller could not obtain a decision and applied a fallback: `decision` is that fallback and `policy` is absent. Absent, not null, on every other record. A reader tolerates a `reason` it does not know. A deployment returns the members `Degraded` defines (`reason`, `status`, `request_id`) and no others at v1, so one schema serves the request and the response.
        attestation:
          type: string
          enum:
            - observed
            - asserted
          description: |
            Derived by the server. Every record appended through `/v1` is `asserted`. `observed` is a valid value on a read, reserved for records the platform captured itself.
      if:
        required:
          - degraded
      then:
        not:
          required:
            - policy
    ApprovalLink:
      type: object
      description: |
        The outcome of linking a record to the approval its `approval_id` names. `linked: true`: the record is now the approval's outcome record (`Approval.outcome_record_id`). `linked: false`: the record was appended and the approval was left as it was, and `reason` says why: `not_consumed` (the approval has not been consumed, so there is no outcome to attach), `already_linked` (the approval already has an outcome record; the first link stands) or `not_found` (the caller did not create the approval, or there is none it may link to; the two are not told apart). A reader tolerates a `reason` it does not know. `reason` is absent when `linked` is `true`.
      required:
        - linked
      additionalProperties: false
      properties:
        linked:
          type: boolean
        reason:
          type: string
          enum:
            - not_consumed
            - already_linked
            - not_found
    Degraded:
      type: object
      description: |
        Why a call went ahead without a decision from the deployment. `reason` is a code, never free text: the pattern admits no dot, colon, slash or space, so a hostname, a URL or a stack trace cannot be sent by mistake. The documented values are `timeout`, `unreachable`, `http_error`, `no_token` and `internal_error`; a deployment accepts any other value that matches the pattern, and a reader tolerates one it does not know. `status` is the HTTP status the deployment answered with and `request_id` the request id of that failed response; each is present only when the deployment answered. A record that carries `degraded` is `asserted`, like every record appended through `/v1`.
      required:
        - reason
      additionalProperties: false
      properties:
        reason:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          examples:
            - timeout
            - unreachable
            - http_error
            - no_token
            - internal_error
        status:
          type: integer
          minimum: 400
          maximum: 599
        request_id:
          type: string
          minLength: 1
          maxLength: 128
    RecordCreate:
      type: object
      required:
        - tool_ref
        - decision
      additionalProperties: false
      properties:
        tool_ref:
          type: string
          minLength: 1
        actor:
          $ref: "#/components/schemas/ActorHint"
        policy:
          $ref: "#/components/schemas/PolicyRef"
          description: |
            The policy that matched. Omit it when no policy matched explicitly and the default applied; when present, `id` and `version` are both required.
        decision:
          $ref: "#/components/schemas/DecisionValue"
        approval_id:
          type: string
          description: |
            Links the outcome to the approval it followed.
        outcome:
          $ref: "#/components/schemas/RecordOutcome"
        prompt_id:
          type: string
        context:
          $ref: "#/components/schemas/RecordContext"
          description: |
            The invocation channel, the same enum and meaning as `context.invocation_channel` on the `/decisions` request; `call_id` and `group_id` are not accepted. `tool_use_id`, `source` and `side_effect_level` are deliberately not accepted: a deployment derives them, and a caller can never lower a level.
        enforced:
          type: boolean
          description: |
            `true` when absent. `false` means the decision was observed, not enforced, as on the decision object. On a degraded record it says whether the caller enforced the fallback.
        degraded:
          $ref: "#/components/schemas/Degraded"
          description: |
            Set when the caller could not obtain a decision and went on under a fallback. `decision` is then the fallback the caller applied, `policy` must be absent (400 `invalid_request` otherwise), and `enforced` says whether the caller enforced that fallback. `side_effect_level` and everything else the deployment derives stay server-side.
      if:
        required:
          - degraded
      then:
        not:
          required:
            - policy
    RecordBatchRequest:
      type: object
      required:
        - records
      additionalProperties: false
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/RecordCreate"
    AgtEvent:
      type: object
      description: |
        An AGT audit event, mapped to a record.
      x-noblecloak-status: provisional
      required:
        - event_type
        - agent_id
        - tool_name
        - timestamp
      properties:
        event_type:
          type: string
        agent_id:
          type: string
        tool_name:
          type: string
        timestamp:
          $ref: "#/components/schemas/Timestamp"
        decision:
          type: string
        result:
          type: string
      additionalProperties: true
    ChainLink:
      type: object
      required:
        - id
        - reason
      properties:
        id:
          type:
            - string
            - "null"
        reason:
          type:
            - string
            - "null"
          description: |
            Why the link is null.
    RecordChain:
      type: object
      required:
        - prompt
        - action
        - decision
        - approval
        - outcome
      properties:
        prompt:
          $ref: "#/components/schemas/ChainLink"
        action:
          $ref: "#/components/schemas/ChainLink"
        decision:
          $ref: "#/components/schemas/ChainLink"
        approval:
          $ref: "#/components/schemas/ChainLink"
        outcome:
          $ref: "#/components/schemas/ChainLink"
    Checkpoint:
      type: object
      x-noblecloak-status: provisional
      required:
        - id
        - created_at
        - record_count
      properties:
        id:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
        record_count:
          type: integer
          minimum: 0
    Verification:
      type: object
      x-noblecloak-status: provisional
      required:
        - verified
        - checked_at
      properties:
        verified:
          type: boolean
        checkpoint_id:
          type: string
        checked_at:
          $ref: "#/components/schemas/Timestamp"
    EvidenceExport:
      type: object
      x-noblecloak-status: provisional
      required:
        - id
        - state
        - created_at
      properties:
        id:
          type: string
        state:
          type: string
          enum:
            - pending
            - ready
            - failed
        created_at:
          $ref: "#/components/schemas/Timestamp"
    PolicySource:
      type: string
      enum:
        - authored
        - suggested
        - imported
    PolicyFormat:
      type: string
      enum:
        - agt
        - cedar
    PolicyKind:
      type: string
      description: "What a policy governs (rev 10). Open-ended: the documented kinds are `tool_invocation` (whether a call to a tool is allowed, asked or denied), `spending` (provisional) and `duplicate_requests` (what happens to an identical call after a resolver rejected it) and, since rev 16, `approval_routing` (the organisation's setting for who may satisfy an approval's requirements, see `ApprovalRoutingConfig`). A client treats a kind it does not know as a policy it cannot evaluate, never as a decision, and treats that policy's `config` as opaque. Known values: tool_invocation | spending | duplicate_requests | approval_routing."
      x-noblecloak-known-values:
        - tool_invocation
        - spending
        - duplicate_requests
        - approval_routing
    PolicyState:
      type: string
      description: |
        `draft`: written and never published, or written after the last publish (then the policy's published version is still the one in force). `published`: the version in force.
      enum:
        - draft
        - published
    PolicyMode:
      type: string
      description: |
        The mode of a `tool_invocation` policy. `always_allow` maps to `allow`; `ask` and `escalate` to `step_up`; `deny` to `deny`. `not_granted` (rev 10): the subject holds no grant; maps to `deny` (reason `not_granted`). `not_granted` is provisional: no deployment implements it yet, and a deployment that does not implement it refuses a policy that sets it with 422 `unsupported_policy_form`.
      enum:
        - always_allow
        - ask
        - escalate
        - deny
        - not_granted
    ToolInvocationConfig:
      type: object
      description: |
        The configuration of a `tool_invocation` policy. Legality matrix: `on_deny`, `expires_after` and `approver_groups` apply only to `ask` and `escalate`; they are illegal with `always_allow`, `deny` and `not_granted`. Rev 16: `rules`, `approvers` and `exclude` are legal with every mode (a `deny` policy may carry an `always_allow` rule, which is still composed tightest-wins with every other policy that matched). `approvers` and `exclude` on a policy none of whose outcomes asks are legal and do nothing.

        Evaluation of one policy for one call (rev 16). The facts of the call are read from its `action.arguments` through the fact bindings of the tool (`Tool.facts`); a call that sends only `arg_digest` has no facts. Walk `rules` in order:

        - A condition is true, false or unevaluable. It is unevaluable when the fact it names has no value: the tool declares no such fact, the call carries no arguments, the binding's path selects nothing, or the value there does not have the binding's type. `exists` is never unevaluable: a fact with no value does not exist.
        - A rule with a false condition is skipped, whatever its other conditions.
        - Otherwise a rule with an unevaluable condition stops the walk: the policy's result is `ask`, and the facts with no value are its `missing_facts`. The requirement it contributes takes that rule's `approvers` when the rule's `then` is `ask` and it has them, and otherwise has no approver entries (the organisation's administrators): never the policy's `approvers`, since the facts that would have chosen them are missing.
        - Otherwise every condition is true and the rule matches: its `then` is the policy's result, and the walk stops (the first matching rule wins).
        - When no rule matches, the result is `mode`.

        The results of every policy that matched the call compose tightest-wins, as the feature `policies.tightest_wins` states. Each policy whose result asks and that contributed to a composed step-up contributes one requirement to the approval (see `ApprovalRequirement`). A deployment that does not list the feature `policies.rules` refuses `rules`, and one that does not list `approvals.requirements` refuses `approvers`, `exclude` and the `approvers` of a rule, each with 422 `unsupported_policy_form` naming the member, as it refuses any member its `policy_forms` does not list. A condition (of a rule or of an approver) that names a fact one of the targeted tools does not declare, or compares (`gt`, `gte`, `lt`, `lte`) a fact that one of them declares as neither `number` nor `count`, is 400 `invalid_request` naming the condition's `fact` in `member` (for example `config.rules[0].when[1].fact`) when every target names a tool the organisation has registered; with `targets: all`, or a target that names no tool yet, it is accepted and is unevaluable where it does not fit.
      required:
        - mode
      additionalProperties: false
      properties:
        mode:
          $ref: "#/components/schemas/PolicyMode"
          description: |
            The outcome when no rule matches; with no `rules`, the outcome. Required.
        on_deny:
          type: string
          enum:
            - resume
            - halt
        expires_after:
          type: string
          description: |
            An ISO 8601 duration, for example PT1H.
        approver_groups:
          type: array
          items:
            type: string
          description: |
            Together these groups form one approval requirement, satisfied by any eligible member of any listed group (rev 11, D-A90): each approval-requiring policy that matches a call contributes one requirement, and every requirement must be met. The schema may grow per ADR-0049 §6c.4.
        rules:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/PolicyRule"
          description: |
            Rev 16: rules over the facts of the call, evaluated in order; the first that matches gives the policy's result, and `mode` applies when none does (see the evaluation above). Served under the feature `policies.rules`.
        approvers:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/PolicyApprover"
          description: |
            Rev 16: who may satisfy the requirement this policy contributes when its result asks: `mode` asks and no rule matched, or a rule whose `then` is `ask` matched and carries no `approvers` of its own. Not when a fact with no value stopped the walk (see the evaluation above). Each entry is a role or a user, and is in force for a call only while its own `when` holds. The deployment enforces it, unlike `approver_groups`, which it leaves as it was. Served under the feature `approvals.requirements`.
        exclude:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - requester
          description: |
            Rev 16: who may never satisfy this policy's requirement, whatever else makes them eligible. `requester`: the principal that opened the approval, including from the approver surface and as an organisation administrator under break-glass. Served under the feature `approvals.requirements`.
      if:
        properties:
          mode:
            enum:
              - always_allow
              - deny
              - not_granted
      then:
        not:
          anyOf:
            - required:
                - on_deny
            - required:
                - expires_after
            - required:
                - approver_groups
    FactName:
      type: string
      pattern: ^[a-z][a-z0-9_]{0,62}$
      description: |
        Rev 16: the name of a fact a tool declares (`Tool.facts`) and a condition names (`PolicyCondition.fact`).
    FactBinding:
      type: object
      description: |
        Rev 16: how one fact of a call is read from the call's arguments. The value at `path` must have the JSON type `type` names: `number` a JSON number, `string` a string, `boolean` true or false, `count` an array, whose length is the fact's value. Nothing is coerced (`"42"` is not a number). A path that selects nothing, or a value of another type, leaves the fact with no value, and a condition that needs it is unevaluable (see `ToolInvocationConfig`). Facts are read by the deployment from the arguments of the call it decides; a client never asserts a fact.
      required:
        - path
        - type
      additionalProperties: false
      properties:
        path:
          type: string
          maxLength: 512
          pattern: ^(\.[A-Za-z_][A-Za-z0-9_-]*|\[[0-9]+\])+$
          description: |
            Where the value is, from the root of the arguments: one or more segments, each `.key` (a member; `key` starts with a letter or `_` and holds letters, digits, `_` and `-`) or `[N]` (the element at the non-negative index `N` of an array). For example `.amount`, `.target.env`, `.lines[0].price`. A wildcard (`[*]`) or a recursive descent (`..key`) selects a set, not one value, and is refused with 400 `invalid_request` naming the binding in `member`.
        type:
          type: string
          enum:
            - number
            - string
            - boolean
            - count
        description:
          type: string
          maxLength: 500
    ToolFacts:
      type: object
      description: |
        Rev 16: the facts a tool declares, by name: at most 32. A policy's conditions name them (see `ToolInvocationConfig`). Served under the feature `tools.facts`; a deployment that does not list it refuses a write that carries `facts` with 422 `unsupported_policy_form` naming `facts`.
      maxProperties: 32
      propertyNames:
        $ref: "#/components/schemas/FactName"
      additionalProperties:
        $ref: "#/components/schemas/FactBinding"
    PolicyCondition:
      type: object
      description: |
        Rev 16: one test of a fact of the call. `eq`, `ne`: `value` is a JSON scalar, compared for equality with the fact's value (a value of another JSON type is not equal). `in`, `not_in`: `value` is a list of 1 to 100 scalars, and the test is whether the fact's value equals one of them. `gt`, `gte`, `lt`, `lte`: `value` is a number, and the fact must be a `number` or a `count`. `exists`: no `value`; true when the fact has a value. A condition whose fact has no value is unevaluable, except under `exists`, where it is false.
      required:
        - fact
        - op
      additionalProperties: false
      properties:
        fact:
          $ref: "#/components/schemas/FactName"
        op:
          type: string
          enum:
            - eq
            - ne
            - in
            - not_in
            - gt
            - gte
            - lt
            - lte
            - exists
        value:
          description: |
            What the fact is tested against; its form depends on `op` (see above).
      allOf:
        - if:
            properties:
              op:
                enum:
                  - eq
                  - ne
          then:
            required:
              - value
            properties:
              value:
                type:
                  - string
                  - number
                  - boolean
                  - "null"
        - if:
            properties:
              op:
                enum:
                  - in
                  - not_in
          then:
            required:
              - value
            properties:
              value:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type:
                    - string
                    - number
                    - boolean
                    - "null"
        - if:
            properties:
              op:
                enum:
                  - gt
                  - gte
                  - lt
                  - lte
          then:
            required:
              - value
            properties:
              value:
                type: number
        - if:
            properties:
              op:
                const: exists
          then:
            not:
              required:
                - value
    PolicyConditions:
      type: array
      description: |
        Rev 16: one to eight conditions, all of which must hold (they are ANDed). An alternative is a separate rule.
      minItems: 1
      maxItems: 8
      items:
        $ref: "#/components/schemas/PolicyCondition"
    PolicyRule:
      type: object
      description: |
        Rev 16: when every condition of `when` holds, the policy's result is `then` (see the evaluation in `ToolInvocationConfig`). `approvers` is legal only with `then: ask`, and then replaces the policy's `approvers` for the requirement this rule's outcome contributes, and for the one the policy contributes when a fact with no value stops the walk at this rule.
      required:
        - when
        - then
      additionalProperties: false
      properties:
        when:
          $ref: "#/components/schemas/PolicyConditions"
        then:
          type: string
          enum:
            - always_allow
            - ask
            - deny
        approvers:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/PolicyApprover"
      if:
        properties:
          then:
            enum:
              - always_allow
              - deny
      then:
        not:
          required:
            - approvers
    PolicyApprover:
      description: |
        Rev 16: one entry of who may satisfy a requirement: every holder of a role (`role`, its bare key, as a role subject's id) or one user (`user`, the principal id). With `when`, the entry is in force for a call only when every condition holds; a condition that is false or unevaluable leaves it out.
      oneOf:
        - type: object
          required:
            - role
          additionalProperties: false
          properties:
            role:
              type: string
              minLength: 1
            when:
              $ref: "#/components/schemas/PolicyConditions"
        - type: object
          required:
            - user
          additionalProperties: false
          properties:
            user:
              type: string
              minLength: 1
            when:
              $ref: "#/components/schemas/PolicyConditions"
    ApproverRef:
      description: |
        Rev 16: an approver entry of a requirement, as it was in force when the approval was opened: a role by its bare key, or a user by principal id.
      oneOf:
        - type: object
          required:
            - role
          additionalProperties: false
          properties:
            role:
              type: string
              minLength: 1
        - type: object
          required:
            - user
          additionalProperties: false
          properties:
            user:
              type: string
              minLength: 1
    ApprovalRoutingConfig:
      type: object
      description: |
        The configuration of an `approval_routing` policy (rev 16): the organisation's setting for who may satisfy the requirements of its approvals. A policy of this kind takes the organisation subject only and targets every tool; any other subject or target form is 422 `unsupported_policy_form`. The organisation's setting is its most recently published `approval_routing` policy, in force from the answer of its publish; with none, `org_admin_break_glass` is `true`. Served under the feature `approvals.requirements`, and listed in `policy_forms` as `approval_routing`.
      required:
        - org_admin_break_glass
      additionalProperties: false
      properties:
        org_admin_break_glass:
          type: boolean
          description: |
            `true`: an administrator of the organisation may satisfy every unmet requirement of an approval in one approve (`basis: break_glass`), except a requirement whose `exclude` excludes them. `false`: an administrator satisfies only the requirements that list them, and those with no approver entries in force.
    SpendingConfig:
      type: object
      x-noblecloak-status: provisional
      required:
        - limit
      additionalProperties: false
      properties:
        limit:
          type: object
          required:
            - amount
            - currency
          properties:
            amount:
              type: number
            currency:
              type: string
    DuplicateRequestsConfig:
      type: object
      description: |
        The configuration of a `duplicate_requests` policy (rev 10): what happens to an identical call after a resolver rejected it (see Terminal states free the identity). Legality matrix: `max_reasks` applies only to `ask_again`; it is illegal with `deny`. A policy of this kind takes the organisation subject only and targets every tool; any other subject or target form is 422 `unsupported_policy_form`. The organisation's setting is its most recently published `duplicate_requests` policy, in force from the answer of its publish; with none, the deployment's default is `after_rejection: deny` with a window of 86 400 seconds (24 hours).
      required:
        - after_rejection
      additionalProperties: false
      properties:
        after_rejection:
          type: string
          enum:
            - deny
            - ask_again
          description: |
            `deny`: an identical call within the window of a rejection is answered `deny` with reason `rejected_duplicate` and opens nothing. `ask_again`: it opens a fresh approval carrying `prior_rejections`, until the count of rejections exceeds `max_reasks`.
        window_seconds:
          type: integer
          minimum: 60
          maximum: 2592000
          default: 86400
          description: |
            How long after a rejection the rule applies, in seconds: a rejection counts while its `resolved_at` lies within this many seconds of the call. Absent means 86 400 (24 hours).
        max_reasks:
          type: integer
          minimum: 1
          description: |
            Only with `ask_again`: how many resolver rejections of an identical call are each followed by a re-ask. With the count being the resolver's rejections of the identity within the window since its last consumed approval, a call whose count exceeds `max_reasks` is answered as under `deny` (`max_reasks: 1`: after the first rejection the call is asked again, after the second it is denied). It bounds rejections, not re-asks: a re-ask that is withdrawn or expires is not a rejection and does not count. Absent means no limit.
      if:
        properties:
          after_rejection:
            const: deny
      then:
        not:
          required:
            - max_reasks
    PolicyConfig:
      description: |
        The configuration of a policy, by its kind (rev 10): `ToolInvocationConfig` for `tool_invocation`, `SpendingConfig` for `spending`, `DuplicateRequestsConfig` for `duplicate_requests` and (rev 16) `ApprovalRoutingConfig` for `approval_routing`. The schema accepts any of them; that a configuration fits its policy's `kind` is checked by the server, which answers a write whose `config` does not fit 400 `invalid_request`. A client treats the `config` of a kind it does not know as opaque.
      anyOf:
        - $ref: "#/components/schemas/ToolInvocationConfig"
        - $ref: "#/components/schemas/SpendingConfig"
        - $ref: "#/components/schemas/DuplicateRequestsConfig"
        - $ref: "#/components/schemas/ApprovalRoutingConfig"
    PolicySubjectType:
      type: string
      description: |
        The type of a policy subject (rev 10): a principal kind, or `organization`.
      enum:
        - user
        - agent
        - service
        - group
        - role
        - organization
    PolicySubject:
      description: |
        Who a policy applies to: a principal by kind and id, or (rev 10) the organisation itself, `{ type: organization }`, with no id (it is the token's organisation). A role subject's id is the bare role key (for example `member`, or the reserved role `everyone` (rev 13), which every caller holds); a deployment maps it to its own form. Tools are never subjects: a policy names the tools it governs in `targets`.
      oneOf:
        - type: object
          required:
            - type
            - id
          additionalProperties: false
          properties:
            type:
              $ref: "#/components/schemas/PrincipalKind"
            id:
              type: string
        - type: object
          required:
            - type
          additionalProperties: false
          properties:
            type:
              type: string
              const: organization
    PolicyTargets:
      type: object
      description: |
        The tools a policy governs (rev 10): `{ tools: all }`, every tool, or `{ tools: [<tool_ref>, ...] }`. On a write, an absent `targets` means every tool; a server that implements rev 10 always returns `targets` on a read. A `tool_ref` is a deployment-assigned stable reference (rev 11): clients compare it for equality and never parse it, and a deployment keeps it stable while the tool's server identity is unchanged, across disconnect and reconnect.
      required:
        - tools
      additionalProperties: false
      properties:
        tools:
          oneOf:
            - type: string
              const: all
            - type: array
              minItems: 1
              maxItems: 100
              items:
                type: string
                minLength: 1
    PolicyWrite:
      type: object
      required:
        - kind
        - subjects
        - config
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/PolicyKind"
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Absent on create, the deployment derives one.
        description:
          type: string
          maxLength: 2000
        subjects:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PolicySubject"
        targets:
          $ref: "#/components/schemas/PolicyTargets"
          description: |
            Absent means every tool.
        config:
          $ref: "#/components/schemas/PolicyConfig"
        origin:
          $ref: "#/components/schemas/PolicyOrigin"
          description: |
            Where this version comes from, when it was imported (rev 11). A create that carries it makes a policy whose `source` is `imported`. `source` is fixed at create, so a later write with or without `origin` never changes it; `origin` describes the version it was written with.
    PolicyOrigin:
      type: object
      description: |
        Where an imported policy version came from (rev 11): the format of the file it was imported from, and the lowercase hex SHA-256 of that file's bytes as imported.
      required:
        - format
        - digest
      additionalProperties: false
      properties:
        format:
          $ref: "#/components/schemas/PolicyFormat"
        digest:
          $ref: "#/components/schemas/Digest"
    Policy:
      type: object
      description: |
        A policy at one version. The members rev 10 adds (`name`, `description`, `state`, `targets`, `unenforced_targets`, `updated_at`, `updated_by`) are optional on the wire, so a server of an earlier revision omits them; a server that implements rev 10 returns `name`, `state` and `targets` on every read. The members rev 11 adds (`draft_version`, `retired_at`, `origin`) are optional and read only.
      required:
        - id
        - version
        - source
        - kind
        - subjects
        - config
      properties:
        id:
          type: string
        version:
          type: integer
          minimum: 0
        source:
          $ref: "#/components/schemas/PolicySource"
        kind:
          $ref: "#/components/schemas/PolicyKind"
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        state:
          $ref: "#/components/schemas/PolicyState"
        subjects:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PolicySubject"
        targets:
          $ref: "#/components/schemas/PolicyTargets"
        unenforced_targets:
          type: array
          items:
            type: string
            minLength: 1
          description: |
            Read only. The `tool_ref`s of `targets` this deployment cannot currently enforce the policy on: the tool was removed, or another tool now answers to the reference. Absent or empty when it enforces every target; never left out silently when it does not.
        config:
          $ref: "#/components/schemas/PolicyConfig"
        published_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        updated_by:
          $ref: "#/components/schemas/PrincipalRef"
          description: |
            Who wrote this version, by id and kind (a policy carries no names).
        draft_version:
          type: integer
          minimum: 0
          readOnly: true
          description: |
            Read only (rev 11). On a published policy, the version of its pending draft (the draft a replace wrote after the last publish); absent when there is none, and on a policy that was never published, whose read is the draft itself. A row of `GET /v1/policies` carries it as the read does.
        retired_at:
          $ref: "#/components/schemas/Timestamp"
          readOnly: true
          description: |
            Read only (rev 11): when the policy was retired (`POST /v1/policies/{id}/retire`). Present on the versions of a retired policy, which `GET /v1/policies/{id}/versions` keeps listing; a retired policy is neither read nor listed otherwise.
        origin:
          $ref: "#/components/schemas/PolicyOrigin"
          readOnly: true
          description: |
            Read only (rev 11): where this version was imported from, as its write stated it (`PolicyWrite.origin`); absent on a version written without one.
    SimulateRequest:
      type: object
      required:
        - action
      additionalProperties: false
      properties:
        draft_version:
          type: integer
          minimum: 0
        actor:
          $ref: "#/components/schemas/ActorHint"
        action:
          $ref: "#/components/schemas/Action"
        resource:
          $ref: "#/components/schemas/Resource"
        context:
          $ref: "#/components/schemas/DecisionContext"
        subject:
          $ref: "#/components/schemas/PolicySubject"
          description: |
            Simulate for a hypothetical holder of exactly this subject (rev 11; see `POST /v1/policies/{id}/simulate`). Administrators only. The caller remains the token's principal.
    SimulateSetRequest:
      type: object
      description: |
        The body of `POST /v1/policies/simulate` (rev 13): proposed policy bodies and the call to decide. A proposed body's members that are meaningful only to a stored policy (`name`, `description`, `origin`) are accepted and ignored.
      required:
        - policies
        - action
      additionalProperties: false
      properties:
        policies:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/PolicyWrite"
          description: |
            The proposed bodies. They stand beside the policies in force and never replace one.
        actor:
          $ref: "#/components/schemas/ActorHint"
        action:
          $ref: "#/components/schemas/Action"
        resource:
          $ref: "#/components/schemas/Resource"
        context:
          $ref: "#/components/schemas/DecisionContext"
        subject:
          $ref: "#/components/schemas/PolicySubject"
          description: |
            Simulate for a hypothetical holder of exactly this subject, as on `POST /v1/policies/{id}/simulate`. Administrators only. The caller remains the token's principal.
    ConsideredPolicies:
      type: object
      description: |
        What a simulated decision considered (rev 10): the inputs and the outcome, never an order of precedence or why one entry won. `policies` lists every policy that matched the call, each matched subject included (not only the one that decided), and the deployment's defaults that applied (a default is listed when no policy of its kind matched) as entries whose `id` and `version` are null and whose `source` names the default. `composed` is the decision the entries composed to, the same as the simulated decision. Rev 11 marks the entries that determined it (`contributed`); which rule composed them is the deployment's, stated by the feature `policies.tightest_wins` where it is advertised.
      required:
        - policies
        - composed
      properties:
        policies:
          type: array
          items:
            type: object
            required:
              - kind
              - id
              - version
              - result
            not:
              required:
                - source
                - proposed_index
            properties:
              kind:
                $ref: "#/components/schemas/PolicyKind"
              id:
                type:
                  - string
                  - "null"
                minLength: 1
                description: |
                  The policy; null for a default of the deployment, or for a proposed body (rev 13).
              version:
                type:
                  - integer
                  - "null"
                minimum: 0
                description: |
                  The version considered (the draft, or the version simulated); null for a default of the deployment, or for a proposed body (rev 13).
              proposed_index:
                type: integer
                minimum: 0
                description: |
                  Rev 13: on an entry that comes from a proposed body of `POST /v1/policies/simulate`, the index of that body in the request's `policies`. A default of the deployment, which also has a null `id` and `version`, carries `source` and never `proposed_index`.
              result:
                type: string
                minLength: 1
                description: |
                  What the entry gave: a mode for a `tool_invocation` policy; for a `duplicate_requests` policy `none` (no rejection applies), `deny` or `ask_again`.
              subject:
                $ref: "#/components/schemas/PolicySubject"
                description: |
                  The subject of the policy that matched the call.
              source:
                type: string
                minLength: 1
                description: |
                  Present on a default: which one, for example `default` or `deployment_applied`. It is a value here and never a role: the reserved role is `everyone`. Absent on an entry from a stored policy or a proposed body; an entry is a default or a proposed body, never both.
              contributed:
                type: boolean
                description: |
                  Rev 11: true on every entry the deployment used to reach `composed`, and false or absent on one it did not. Under `policies.tightest_wins` it is every entry whose result gives the composed decision: when that is a step-up, every approval-requiring entry, each of which contributes a requirement that must be met. An entry a tighter one overruled (an `always_allow` beside a `deny`) did not contribute. It says which entries determined the outcome, not an order among them. A deployment that does not implement rev 11 omits it.
              rule:
                type: object
                description: |
                  Rev 16: on a `tool_invocation` entry whose result a rule of the policy gave, that rule: its index in the policy's `rules` and its `then`. Absent when no rule matched (the result is the policy's `mode`), when a missing fact stopped the walk (see `missing_facts`), and on a deployment that does not list `policies.rules`.
                required:
                  - index
                  - then
                additionalProperties: false
                properties:
                  index:
                    type: integer
                    minimum: 0
                  then:
                    type: string
                    enum:
                      - always_allow
                      - ask
                      - deny
              missing_facts:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  $ref: "#/components/schemas/FactName"
                description: |
                  Rev 16: on a `tool_invocation` entry whose rules could not be evaluated, the facts the rule that stopped the walk needed and the call did not supply; the entry's `result` is then `ask`. A simulation whose `action` carries only `arg_digest` supplies no fact. Absent otherwise.
        composed:
          type: object
          required:
            - decision
          properties:
            decision:
              $ref: "#/components/schemas/DecisionValue"
            reason:
              type: string
    SimulateResult:
      type: object
      description: |
        The decision a version of a policy would give (rev 10): the members of `Decision`, with the same rules (`policy` is absent when the default decided, and never null), and `considered`, which a server that implements rev 10 always returns. Nothing was opened or recorded.
      required:
        - decision
        - action_digest
        - enforced
      properties:
        decision:
          $ref: "#/components/schemas/DecisionValue"
        reason:
          type: string
          description: |
            For example `not_granted`, `unknown_tool`, `rejected_duplicate`.
        action_digest:
          $ref: "#/components/schemas/Digest"
          description: |
            The argument digest the server computed for the action as received.
        policy:
          $ref: "#/components/schemas/DecisionPolicy"
          description: |
            The policy that decided; absent when the default applied. Where several policies contributed to the decision (rev 11; see `policies.tightest_wins` on `Capabilities.features`), it names one of the entries that contributed, the deployment's choice: the `considered` of a simulation lists the set.
        approval:
          $ref: "#/components/schemas/ApprovalHandle"
        enforced:
          type: boolean
        would_be:
          $ref: "#/components/schemas/DecisionValue"
        condition:
          $ref: "#/components/schemas/Condition"
        rejected_approval_id:
          type: string
          minLength: 1
          description: |
            Only on a `deny` with reason `rejected_duplicate`, as on `Decision`.
        missing_facts:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/FactName"
          description: |
            Rev 16: only on a `step_up`, as on `Decision`: the facts whose absence stopped the walk of a contributing policy.
        considered:
          $ref: "#/components/schemas/ConsideredPolicies"
    PolicyImportReport:
      type: object
      required:
        - applied
        - unsupported
      properties:
        applied:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRef"
        unsupported:
          type: array
          items:
            type: object
            required:
              - path
              - reason
            properties:
              path:
                type: string
              reason:
                type: string
    Owner:
      type: object
      description: |
        Who owns a tool or a connection. A tool or a connection owned by a `principal` is visible to that principal and to administrators only (an administrator is a user, never a service principal; see Who registers tools and `GET /v1/tools`): to anyone else it is 404 `not_found` and absent from lists. One owned by the organisation (`org`) is visible to every principal of the organisation; for a connection (rev 11) that is what lets each member use the registration. Every connection route follows this rule.
      required:
        - kind
        - id
      properties:
        kind:
          type: string
          enum:
            - principal
            - org
        id:
          type: string
    Connection:
      type: object
      description: |
        The registration of a tool server. The members rev 11 adds are optional on the wire, so a server of an earlier revision omits them; a server that implements rev 11 returns `status`, `auth_kind` and `credential_tier` on every read. No operation returns a credential: not the organisation credential, and no user's.
      required:
        - id
        - name
        - url
        - transport
        - owner
        - created_at
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        transport:
          type: string
          enum:
            - mcp
            - a2a
        owner:
          $ref: "#/components/schemas/Owner"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        status:
          type: string
          description: "The state of the registration (rev 11), never a user's credential. `connected`: the registration is in force (for `org_shared`, its organisation credential is too). `pending_authorization`: an `org_shared` registration with `auth_kind: oauth` waiting for an administrator's consent; never used for a `per_user` registration. `degraded`: the deployment's last check of it failed (`status_detail` says how). Open-ended: a client treats a value it does not know as not `connected`. Known values: connected | pending_authorization | degraded."
          x-noblecloak-known-values:
            - connected
            - pending_authorization
            - degraded
        status_detail:
          type: string
          enum:
            - unreachable
            - credential_rejected
            - introspection_failed
          description: |
            Why the registration is `degraded` (rev 11): a code from this closed list, never text from the server. Absent otherwise.
        last_verified_at:
          type:
            - string
            - "null"
          format: date-time
          description: |
            When the deployment last checked the registration (rev 11); null when it never has.
        auth_kind:
          type: string
          enum:
            - none
            - bearer
            - oauth
          description: |
            How the server authenticates callers (rev 11; `ConnectionWrite.auth`). Never a credential.
        credential_tier:
          type: string
          description: "Whose credential calls through the registration use (rev 11): `org_shared`, one organisation credential an administrator sets; `per_user`, each user's own link. Fixed at create. Open-ended: a client treats a value it does not know as a tier it cannot use. Known values: org_shared | per_user."
          x-noblecloak-known-values:
            - org_shared
            - per_user
        my_link:
          $ref: "#/components/schemas/ConnectionLink"
          description: |
            The caller's own credential link to this registration, and nobody else's (rev 11). Present on every read of a `per_user` registration whose `auth_kind` is not `none`, by a deployment that advertises `connections.user_links`; absent otherwise. Never a credential.
    ConnectionLink:
      type: object
      description: |
        One caller's credential link to a `per_user` registration (rev 11), as that caller reads it.
      required:
        - status
        - consent
      properties:
        status:
          type: string
          description: "`linked`: the link holds a credential the deployment can use. `pending_authorization`: an OAuth link waiting for the caller to authorize it (`POST /v1/connections/{id}/authorize`). `degraded`: the deployment's last use of it failed. `none`: the caller has no link. Open-ended: a client treats a value it does not know as a link it cannot use. Known values: linked | pending_authorization | degraded | none."
          x-noblecloak-known-values:
            - linked
            - pending_authorization
            - degraded
            - none
        consent:
          type: string
          description: "`given`: the caller consents to the use of the link. `revoked`: it no longer does, and the deployment does not use the link (the credential is kept). `none`: there is no link. Open-ended: a client treats a value it does not know as consent not given. Known values: given | revoked | none."
          x-noblecloak-known-values:
            - given
            - revoked
            - none
        linked_at:
          $ref: "#/components/schemas/Timestamp"
          description: |
            When the link last came to hold a credential.
    ConnectionLinkRequest:
      type: object
      description: |
        The caller's link to a `per_user` registration (rev 11): consent, always, and for `auth_kind: bearer` the credential.
      required:
        - consent
      additionalProperties: false
      properties:
        consent:
          type: boolean
          const: true
          description: |
            The caller's consent to the use of its own link. Required, and only `true`.
        token:
          type: string
          minLength: 1
          writeOnly: true
          description: |
            For `auth_kind: bearer`: the credential, required on the first link and replacing the stored one when sent again. Never returned. Refused for `auth_kind: oauth`.
    ConnectionAuthorizeRequest:
      type: object
      required:
        - return_to
      additionalProperties: false
      properties:
        return_to:
          type: string
          format: uri
          description: |
            Where the browser returns after consent: on an origin the deployment admits for browser modules. The deployment keeps `return_to`'s own query and adds the `nc_*` parameters to it.
    ConnectionAuthorizeResult:
      type: object
      required:
        - authorization_url
        - expires_at
      properties:
        authorization_url:
          type: string
          format: uri
          description: |
            Where to send the browser. Good for one use.
        expires_at:
          $ref: "#/components/schemas/Timestamp"
    ConnectionAuth:
      description: |
        How a tool server authenticates callers (rev 11): `none`, `bearer` or `oauth`, which may name the `scopes` to ask for and the authorization server's `issuer` and the deployment's `client_id` there. It never carries a credential: an organisation credential is `org_credential`, and a user's is their link.
      oneOf:
        - type: object
          required:
            - kind
          additionalProperties: false
          properties:
            kind:
              type: string
              const: none
        - type: object
          required:
            - kind
          additionalProperties: false
          properties:
            kind:
              type: string
              const: bearer
        - type: object
          required:
            - kind
          additionalProperties: false
          properties:
            kind:
              type: string
              const: oauth
            scopes:
              type: array
              items:
                type: string
                minLength: 1
            issuer:
              type: string
              format: uri
            client_id:
              type: string
              minLength: 1
    OrgCredential:
      type: object
      description: |
        The organisation credential of an `org_shared` registration with `auth.kind: bearer` (rev 11): set and rotated by an administrator, write only, and never returned.
      required:
        - token
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          writeOnly: true
    ConnectionWrite:
      type: object
      required:
        - name
        - url
        - transport
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
          description: |
            The server's URL, which fixes the identity of its tools (rev 11). It carries no credential: a URL with userinfo is 400 `invalid_request`. It is shown to every principal who sees the registration.
        transport:
          type: string
          enum:
            - mcp
            - a2a
        owner_kind:
          type: string
          enum:
            - principal
            - org
          default: principal
          description: |
            Whose connection this is. The owner id is the token's.
        auth:
          $ref: "#/components/schemas/ConnectionAuth"
          description: |
            How the server authenticates callers (rev 11). Absent means `{ kind: none }`.
        credential_tier:
          type: string
          enum:
            - org_shared
            - per_user
          description: |
            Rev 11, administrator only, fixed at create: see `POST /v1/connections`. Absent, `per_user` where the deployment advertises `connections.user_links`, else `org_shared`.
        org_credential:
          $ref: "#/components/schemas/OrgCredential"
          description: |
            Rev 11, administrator only: legal only with `credential_tier: org_shared` and `auth.kind: bearer`, which needs it.
    ConnectionPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        org_credential:
          $ref: "#/components/schemas/OrgCredential"
          description: |
            Rev 11: rotates the organisation credential of an `org_shared` registration with `auth.kind: bearer`. Administrator only.
        url:
          type: string
          format: uri
          description: |
            Refused with 400 `invalid_request` (rev 11): a connection's URL is the identity of its tools.
    ConnectionRefreshResult:
      type: object
      description: |
        What `POST /v1/connections/{id}/refresh` registered (rev 11).
      required:
        - tool_count
        - added
        - removed
        - reactivated
      properties:
        tool_count:
          type: integer
          minimum: 0
          description: |
            The tools the server offers now.
        added:
          type: integer
          minimum: 0
          description: |
            Tools registered for the first time.
        removed:
          type: integer
          minimum: 0
          description: |
            Tools no longer offered, now `withdrawn`.
        reactivated:
          type: integer
          minimum: 0
          description: |
            Tools offered again after they were withdrawn, `active` under the same `tool_ref`.
        empty_upstream_suppressed:
          type: boolean
          description: |
            True when the server offered no tool at all and the deployment kept the registered tools rather than withdraw every one.
    Tool:
      type: object
      required:
        - id
        - tool_ref
        - transport
        - side_effect_level
        - data_routing
      properties:
        id:
          type: string
        tool_ref:
          type: string
          description: |
            A deployment-assigned stable reference (rev 11): clients compare it for equality and never parse it. A deployment keeps it stable while the tool's server identity is unchanged, across disconnect and reconnect.
        connection_id:
          type:
            - string
            - "null"
          description: |
            The connection the tool was registered from; a `withdrawn` tool keeps the one it was last registered from. Null for a tool registered through `POST /v1/tools`.
        status:
          type: string
          description: "Rev 11: `active`, or `withdrawn` when its server no longer offers it or its connection was deleted. A decision for a `withdrawn` tool is `deny` with reason `unknown_tool`, and it stays in `GET /v1/tools`. Absent means `active`; a hosted deployment returns it on every tool. Open-ended: a client treats a value it does not know as not callable. Known values: active | withdrawn."
          x-noblecloak-known-values:
            - active
            - withdrawn
        description:
          type: string
        transport:
          type: string
          enum:
            - mcp
            - a2a
            - external
        input_schema:
          type: object
          additionalProperties: true
        side_effect_level:
          $ref: "#/components/schemas/SideEffectLevel"
        data_routing:
          type: string
          description: |
            The orchestrator's data-routing value. Opaque to this contract.
        owner:
          $ref: "#/components/schemas/Owner"
        show_arguments_to_approvers:
          type: boolean
          description: |
            Whether the people who decide an approval of this tool see the call's arguments (see Who sees the arguments of an approval). Absent means `false`.
        facts:
          $ref: "#/components/schemas/ToolFacts"
          description: |
            Rev 16: the facts a call to this tool carries, each read from its arguments. Absent: the tool declares none. Set only by a deployment that lists the feature `tools.facts`.
    ToolWrite:
      type: object
      required:
        - tool_ref
        - transport
        - input_schema
        - side_effect_level
      additionalProperties: false
      properties:
        tool_ref:
          type: string
          minLength: 1
        transport:
          type: string
          const: external
        description:
          type: string
        input_schema:
          type: object
          additionalProperties: true
        side_effect_level:
          $ref: "#/components/schemas/SideEffectLevel"
        owner_kind:
          type: string
          enum:
            - principal
            - org
          default: principal
        show_arguments_to_approvers:
          type: boolean
          default: false
          description: |
            Show the call's arguments to the people who decide an approval of this tool. A deployment that does not serve approvals accepts the field and ignores it.
        facts:
          $ref: "#/components/schemas/ToolFacts"
          description: |
            Rev 16: the facts the tool declares (see `Tool.facts`).
    ToolPatch:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
        side_effect_level:
          $ref: "#/components/schemas/SideEffectLevel"
        input_schema:
          type: object
          additionalProperties: true
        show_arguments_to_approvers:
          type: boolean
        facts:
          description: |
            Rev 16: replaces the tool's whole map of facts; `null` removes every fact. A fact a published policy's condition names may be removed: that fact then has no value, so a condition naming it is unevaluable (false under `exists`), with the consequences the evaluation in `ToolInvocationConfig` gives.
          oneOf:
            - $ref: "#/components/schemas/ToolFacts"
            - type: "null"
    Principal:
      type: object
      required:
        - id
        - kind
        - display_name
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/PrincipalKind"
        display_name:
          type: string
    Agent:
      type: object
      required:
        - id
        - name
        - parent_id
        - created_at
      properties:
        id:
          type: string
        name:
          type: string
        parent_id:
          type:
            - string
            - "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        principal_id:
          type:
            - string
            - "null"
          minLength: 1
          description: |
            Rev 13: the service principal this agent is bound to (see Agent identity), or null when it is unbound. Optional on the wire so that a rev 12 deployment's agent still validates; a client treats an absent member as null.
    AgentPrincipalWrite:
      type: object
      description: |
        The body of `PUT /v1/agents/{id}/principal` (rev 13).
      required:
        - principal_id
      additionalProperties: false
      properties:
        principal_id:
          type: string
          minLength: 1
          description: |
            The id of a service principal of the organisation: the `id` that `Record.actor` carries on a record the service principal appended, and that `GET /v1/principals` lists it under. An id that names no service principal of the caller's organisation, a user or a principal of another organisation included, is 404 `not_found`.
    AgentWrite:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        parent_id:
          type: string
    Run:
      type: object
      required:
        - id
        - kind
        - scope_id
        - created_at
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - external
            - governed
        scope_id:
          type: string
          description: |
            The scope approvals under this run are deduplicated in. A delegated run has a fresh scope id, so it never shares an obligation with its delegator.
        agent_id:
          type:
            - string
            - "null"
          description: |
            The agent the run was created for, as `createRun` was given it. Like `actor.agent_id` it is a hint and never selects which policies apply to a call that names the run (rev 13): an agent's policies apply only through the service principal bound to the agent (see Agent identity).
        created_at:
          $ref: "#/components/schemas/Timestamp"
    RunWrite:
      type: object
      required:
        - kind
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - external
            - governed
          description: |
            `governed` is refused with 405.
        agent_id:
          type: string
          description: |
            An agent of the caller's organisation (a row of `/v1/agents`); any other id is 404 `not_found`.
    Webhook:
      type: object
      description: |
        A webhook subscription. Rev 12 removes `secret`: a delivery is signed with the deployment's key (see `createWebhook`), so there is no shared secret to return. The object is open: a response from a rev 11 deployment that still carries `secret` is accepted.
      required:
        - id
        - url
        - events
        - created_at
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEvent"
        state:
          type: string
          description: "Rev 12. Whether the webhook gets deliveries; absent means `active`. `disabled`: its deliveries failed continuously for 72 hours, and it gets none until it is deleted and created anew. A client treats a value it does not know as not `active`. Known values: active | disabled."
          x-noblecloak-known-values:
            - active
            - disabled
        created_at:
          $ref: "#/components/schemas/Timestamp"
    WebhookEvent:
      type: string
      enum:
        - approval.resolved
        - record.appended
        - policy.published
    WebhookWrite:
      type: object
      required:
        - url
        - events
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          pattern: ^https://
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/WebhookEvent"
    WebhookDelivery:
      type: object
      description: |
        Rev 12. The body of a webhook delivery: a CloudEvents 1.0 structured-mode JSON object plus `signature`, a JWS compact serialization (ES256, `kid` in the header) whose payload is the JCS form of this object without `signature`, as for a Resumption. Verify it against `/.well-known/jwks.json`. One signature per event, shared by every subscriber: the body names no subscriber (the request header `NobleCloak-Webhook-Id` carries the subscription's id, unsigned). `id` is the event id; a receiver dedupes on it.
      required:
        - specversion
        - id
        - type
        - source
        - subject
        - time
        - datacontenttype
        - data
        - signature
      properties:
        specversion:
          type: string
          enum:
            - "1.0"
        id:
          type: string
        type:
          $ref: "#/components/schemas/WebhookEvent"
        source:
          type: string
          format: uri
          description: |
            The origin of the deployment's govern host.
        subject:
          type: string
          description: |
            The id of the resource the event is about.
        time:
          $ref: "#/components/schemas/Timestamp"
        datacontenttype:
          type: string
          enum:
            - application/json
        data:
          description: |
            The event data for `type`, and only for `type`: `approval.resolved` carries ApprovalResolvedData, `record.appended` RecordAppendedData, `policy.published` PolicyPublishedData. Thin, never carrying the resource's representation.
          oneOf:
            - $ref: "#/components/schemas/ApprovalResolvedData"
            - $ref: "#/components/schemas/RecordAppendedData"
            - $ref: "#/components/schemas/PolicyPublishedData"
        signature:
          type: string
      allOf:
        - if:
            required:
              - type
            properties:
              type:
                const: approval.resolved
          then:
            properties:
              data:
                $ref: "#/components/schemas/ApprovalResolvedData"
        - if:
            required:
              - type
            properties:
              type:
                const: record.appended
          then:
            properties:
              data:
                $ref: "#/components/schemas/RecordAppendedData"
        - if:
            required:
              - type
            properties:
              type:
                const: policy.published
          then:
            properties:
              data:
                $ref: "#/components/schemas/PolicyPublishedData"
    WebhookResolution:
      type: string
      description: "Rev 12. The resolution an `approval.resolved` delivery reports. Open-ended: the documented values are `approved`, `rejected` and `escalated`, and a client treats any other value as a resolution it does not act on (fail closed). A deployment delivers only the documented values. Known values: approved | rejected | escalated."
      x-noblecloak-known-values:
        - approved
        - rejected
        - escalated
    ApprovalResolvedData:
      type: object
      description: |
        Rev 12. `data` of `approval.resolved`; `subject` is the approval id.
      required:
        - approval_id
        - state
        - resolution
        - resolved_at
        - tool_ref
      properties:
        approval_id:
          type: string
        state:
          type: string
          enum:
            - approved
            - rejected
        resolution:
          $ref: "#/components/schemas/WebhookResolution"
        resolved_at:
          $ref: "#/components/schemas/Timestamp"
        tool_ref:
          type: string
    RecordAppendedData:
      type: object
      description: |
        Rev 12. `data` of `record.appended`; `subject` is the record id.
      required:
        - record_id
        - tool_ref
        - decision
        - ts
      properties:
        record_id:
          type: string
        tool_ref:
          type: string
        decision:
          type: string
        ts:
          $ref: "#/components/schemas/Timestamp"
    PolicyPublishedData:
      type: object
      description: |
        Rev 12. `data` of `policy.published`; `subject` is the policy id.
      required:
        - policy_id
        - kind
        - version
        - published_at
      properties:
        policy_id:
          type: string
        kind:
          type: string
        version:
          type: integer
          minimum: 1
        published_at:
          $ref: "#/components/schemas/Timestamp"
    Origins:
      type: object
      required:
        - origins
      properties:
        origins:
          type: array
          items:
            type: string
            format: uri
    OriginsWrite:
      type: object
      required:
        - origins
      additionalProperties: false
      properties:
        origins:
          type: array
          maxItems: 50
          description: |
            Rev 12: each origin is exact, `scheme://host[:port]` as a browser sends it in `Origin`: no path, query, fragment, trailing slash, userinfo or wildcard; `https`, or `http` only for `localhost` and `127.0.0.1`. The host is lowercase and a default port (443 for `https`, 80 for `http`) is omitted. The `pattern` is a coarse filter only; the rule stated here governs, and a deployment refuses a non-canonical form the pattern lets through. One that is not exact is 400 `invalid_request`, naming it.
          items:
            type: string
            format: uri
            pattern: ^(https://[^/?#@*\s]+|http://(localhost|127\.0\.0\.1)(:[0-9]+)?)$
    Capabilities:
      type: object
      required:
        - deployment
        - entitlements
        - jwks_uri
        - kids
        - resolutions
        - features
        - authzen_configuration
      properties:
        deployment:
          type: string
          enum:
            - hosted
            - edge
        entitlements:
          type: array
          items:
            type: string
        jwks_uri:
          type: string
          format: uri
        kids:
          type: array
          items:
            type: string
        resolutions:
          type: array
          items:
            type: string
          description: |
            The resolutions this deployment can produce. Empty when it does not serve approvals. A resolution it does not serve, `escalated` where it has no escalation, is refused with 400 `invalid_request`.
        features:
          type: array
          items:
            type: string
          description: |
            The route families served here (every family except `approvals`, which `resolutions` advertises: `runs`, `webhooks`, `origins`, `policies`, `agents`, `principals`, `connections`, `records.checkpoints`, `records.chain`, `evidence`), the hosted-only features (`policies.author`, `policies.publish`, `policies.import_export`, `policies.retire` (rev 11: retiring a policy and discarding its draft), `connections.oauth` (rev 11: the OAuth authorize step of a connection), `connections.user_links` (rev 11: each user's own credential link to a `per_user` registration, with consent), `records.verify` and `evidence.export`) and the features a deployment of either kind may have. `approvals.rejected_duplicate` (rev 10) says the deployment applies the rejected-duplicate rule (see Terminal states free the identity), and a deployment that does not list it keeps the rev 9 behaviour, where a rejection frees the identity. `approvals.available_actions` (rev 15) says the deployment sets `Approval.available_actions` on the single read of a pending approval, and a deployment that does not list it never sets the member. `policies.tightest_wins` (rev 11) states how the deployment composes `tool_invocation` policies: across every entry that matched a call the tightest mode wins, `deny` over needs approval (`ask`, `escalate`) over `always_allow`, and `not_granted` composes as `deny` (provisional, as `not_granted` is); a mode is loosened only through an exemption the deployment defines. Its default is a fallback, listed in `considered` only when no policy of its kind matched. A decision's `policy` names one of the entries that contributed, the deployment's choice, and the `considered` of a simulation gives the set (`contributed`). A deployment that does not list `policies.tightest_wins` states no rule. Rev 16: `tools.facts` says the deployment reads the facts of a call through `Tool.facts`; `policies.rules` says it evaluates `ToolInvocationConfig.rules`, lists `rule` and `missing_facts` in `considered`, and sets `Decision.missing_facts`; `approvals.requirements` says it enforces `ToolInvocationConfig.approvers` and `exclude`, serves `approval_routing` policies, and sets `Approval.requirements`. A deployment that does not list one of them refuses its members (422 `unsupported_policy_form`) and never sets the members it serves, so it behaves as rev 15. An edge deployment omits the hosted-only features and the families that are hosted-only.
        authzen_configuration:
          type: string
          format: uri
        limits:
          type: object
          additionalProperties: false
          description: |
            The limits of this deployment. For the three batch limits (`decisions_batch_max_items`, `records_batch_max_items`, `resolutions_batch_max_items`) 100 is the most any deployment accepts, and a member that is absent means 100. A batch above a limit and no larger than 100 is 400 `batch_too_large`; one above 100 is 400 `invalid_request`, the schema's `maxItems`, whatever the limit.
          properties:
            decisions_batch_max_items:
              type: integer
              minimum: 1
              maximum: 100
              description: |
                The most items `POST /v1/decisions/batch` accepts.
            records_batch_max_items:
              type: integer
              minimum: 1
              maximum: 100
              description: |
                The most items `POST /v1/records/batch` accepts.
            resolutions_batch_max_items:
              type: integer
              minimum: 1
              maximum: 100
              description: |
                The most items `POST /v1/approvals/resolve/batch` accepts.
            approval_arguments_max_bytes:
              type: integer
              minimum: 1
              description: |
                The most bytes of arguments (RFC 8785 canonical JSON) this deployment keeps for an approval of a tool that shows its arguments to approvers. Larger arguments are refused with 400 `invalid_request`, whose `detail` says so; absent means this deployment sets no bound it advertises.
        continuation_deliveries:
          type: array
          items:
            type: string
            enum:
              - push
              - pull
              - held
          description: |
            The continuation deliveries this deployment serves. Absent means all three. A continuation whose delivery is not listed is refused with 400 `invalid_continuation`, as the routes that take one say.
        tool_registration:
          type: string
          enum:
            - any
            - administrators
          description: |
            Who may register or change tools: `any` principal of the organisation, or only its `administrators`. Absent means `any`. Any other principal is 403 `forbidden`, whatever the body. The per-tool setting `show_arguments_to_approvers` has no member of its own: it is honoured whenever `resolutions` is non-empty.
        connection_registration:
          type: object
          description: |
            Who may register a connection here (rev 11): the owner kinds it accepts, and whether `any` principal of the organisation or only its `administrators` may register. Absent means unrestricted. A refused owner kind, or a refused caller, is 403 `forbidden`. It governs registration only, never who may use a registration, and never who changes, refreshes or deletes one: an `org`-owned connection is changed by administrators only on every deployment (see `PATCH /v1/connections/{id}`).
          required:
            - owner_kinds
            - who
          properties:
            owner_kinds:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                enum:
                  - principal
                  - org
            who:
              type: string
              enum:
                - any
                - administrators
        connection_transports:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - mcp
              - a2a
          description: |
            The connection transports this deployment serves (rev 11). Absent means both. A create naming another is 400 `invalid_request`.
        policy_forms:
          type: object
          description: |
            The policy forms this deployment enforces (rev 11), by kind. For `tool_invocation`: the modes, the subject types, whether a policy may target every tool (`targets_all`), and the members of `ToolInvocationConfig` besides `mode` it implements (`config_members`; rev 16 adds `rules` under `policies.rules`, and `approvers` and `exclude` under `approvals.requirements`). For `approval_routing` (rev 16, under `approvals.requirements`): the members of `ApprovalRoutingConfig` it implements; the kind is not served where the entry is absent. An advertised form is never refused with 422 `unsupported_policy_form`; a form it does not list may be. Absent means the deployment does not say, and a refused form is learnt from the 422.
          properties:
            tool_invocation:
              type: object
              required:
                - modes
                - subject_types
                - targets_all
                - config_members
              properties:
                modes:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: "#/components/schemas/PolicyMode"
                subject_types:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: "#/components/schemas/PolicySubjectType"
                targets_all:
                  type: boolean
                config_members:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                  description: |
                    The members of `ToolInvocationConfig` besides `mode` this deployment implements, for example `on_deny`, `expires_after` and `approver_groups`.
            approval_routing:
              type: object
              description: |
                Rev 16: the deployment serves policies of kind `approval_routing` (organisation subject, every tool).
              required:
                - config_members
              properties:
                config_members:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                  description: |
                    The members of `ApprovalRoutingConfig` this deployment implements, for example `org_admin_break_glass`.
        deployment_applied:
          type: array
          description: |
            Rev 14: the deployment-applied references this deployment applies on approval (see Deployment-applied proposals). A reference that is not listed is answered 422 `approval_unroutable` when an approval is opened for it. Absent means none: a deployment that does not author and publish policies of its own lists none.
          items:
            type: object
            required:
              - tool_ref
              - arguments_schema_ref
            additionalProperties: false
            properties:
              tool_ref:
                type: string
                minLength: 1
                pattern: "^tool:noblecloak:"
              arguments_schema_ref:
                type: string
                minLength: 1
                description: |
                  The name of the schema in `components.schemas` that `action.arguments` of an approval for this reference must fit, for example `PolicySetProposal`.
        self_approval_from_approver_surface:
          type: boolean
          description: |
            Whether a person may resolve an obligation their own agent opened when the resolving token was issued to the deployment's approver surface (the approvals module's own client). `true`: such a token resolves it; the creating principal's own token, from any client but the approver surface, is never eligible, and a token issued to the approver surface may not open an obligation on any path (`POST /v1/approvals`, a `step_up` on `POST /v1/decisions` or its batch, or an AuthZEN evaluation: 403 `forbidden`; `allow` and `deny` decisions are still answered) and may not consume a Resumption (`POST /v1/approvals/{id}/consume`: 403 `forbidden`), so one such token cannot approve an obligation and spend it. `false`: the creating principal never resolves its own obligation, from any surface. Absent means `false`, the rev 6 behaviour. A scenario that depends on it runs only where the deployment advertises the matching value.
        user_resolve_scope:
          type: string
          minLength: 1
          description: |
            The OAuth scope a user-track token must carry to resolve an approval: `POST /v1/approvals/{id}/resolve`, `/approve`, `/deny` and `POST /v1/approvals/resolve/batch` answer 403 `insufficient_scope` to a user's token that lacks it, and answer it before the body is validated, before the approval is looked up and before eligibility: an approval id that does not exist is still 403 `insufficient_scope`, and a missing scope is never reported as `not_found`, `invalid_request` or `not_eligible`. Every non-service principal (a user or an agent) is asked for it; a service principal never resolves and is not asked. Withdraw, consume and every read are not gated by it. Absent means the deployment requires no user scope to resolve (the rev 7 behaviour). A scenario that depends on it runs only where the deployment advertises the member.
        dpop:
          type: string
          enum:
            - off
            - optional
            - required
          description: |
            Whether this deployment verifies DPoP proofs. `off` (the default when the member is absent): it verifies none, so a token that carries `cnf.jkt` and the `Authorization: DPoP` scheme are 401 `dpop_unsupported` and only bearer tokens are accepted. `optional`: a proof-bound token is accepted with its proof and a bearer token is accepted without one. `required`: a bearer token without a proof is 401. The `dpop_unsupported` negatives run only against `off`; against a deployment that advertises `optional` or `required` the conformance suite cannot check that it really verifies proofs, so those scenarios are reported as unverified skips, which count against the exit code unless skips are allowed.
