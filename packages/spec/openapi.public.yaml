# The NobleCloak module API. Generated by the build, do not edit here.
openapi: 3.1.0
info:
  title: NobleCloak module API
  version: 1.0.0
  summary: One contract for the control plane, the edge container, modules, adapters and plugins.
  contact:
    name: NobleCloak
    url: https://www.noblecloak.com
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    The module API is one OpenAPI 3.1 document under `/v1`, plus the root-mounted AuthZEN endpoint
    (`/access/v1/evaluation`, `/.well-known/authzen-configuration`) and the key set
    (`/.well-known/jwks.json`). Every operation is tagged with where it is served
    (`x-noblecloak-deployment`: `both` or `hosted`); a `hosted` operation answers 404 with problem type
    `not_available_on_deployment` on an edge container.

    **Envelope.** Every JSON 2xx body under `/v1` is `{ data, meta }`; the exceptions are named on their
    operations: the AuthZEN responses and the key set are bare (their specifications fix the shape), a
    policy export is text, the approval stream is server-sent events, and a 204 has no body. `meta` carries `request_id`, `deployment`
    (`hosted` or `edge`) and, on lists, `cursor` and `next`. Every error is an RFC 9457 problem
    (`application/problem+json`) whose `type` is a stable URI per code; the codes each operation can
    return are listed on the operation (`x-noblecloak-problem-types`) and in
    `info.x-noblecloak-problem-types`. Every problem this API produces carries `request_id`, the same kind of id a success
    envelope carries in `meta.request_id`. A server failure is a problem too: 500 `internal_error` and
    503 `service_unavailable` (which may carry `Retry-After`), so that a client tells "retry later" from
    "your request was wrong" by the type, not by the prose.

    **Reading a retry hint, and which 503.** A browser reads a cross-origin response header only if the
    server lists it, so the hint is also in the body: `Problem.retry_after_seconds` is present on every
    `service_unavailable` and `rate_limited` problem that carries the `Retry-After` header, equal to
    it. A deployment that answers a registered browser origin SHOULD list `Retry-After` and
    `X-Request-Id` in `Access-Control-Expose-Headers`. A `service_unavailable` problem may carry
    `reason`, a code token naming the cause; the documented value is `eligibility_lookup`, which says
    the deployment could not determine whether the caller may resolve an approval (see Who sees the
    arguments of an approval). A client keeps matching on `type`, and treats a `reason` it does not know
    as a plain 503. A body larger than the deployment accepts is 413 `payload_too_large`, on every
    route that takes a body, with `max_bytes` when the deployment can say.

    **Browser origins (rev 12).** An organisation registers the browser origins its modules run on
    (`PUT /v1/origins`; `GET /v1/origins` reads them). A deployment may admit origins of its own that no
    organisation registered (house origins); an organisation cannot remove them. Registered origins govern
    CORS in two steps. A preflight (`OPTIONS`) carries no token, so it is answered against the union of the
    deployment's own admitted origins and every organisation's registered origins: an origin in the union
    gets `Access-Control-Allow-Origin` with that origin (never `*`, never an origin the request did not
    send) and `Vary: Origin`. A preflight never reveals which organisation registered an origin. An actual
    request carries the token, so its `Origin` is checked against the caller organisation's registered
    origins plus the deployment's own: a request whose `Origin` is admitted by neither is 403 `forbidden`,
    and its response carries no `Access-Control-Allow-Origin`. A request without an `Origin` header is not
    affected. `PUT` replaces the whole set. A registered origin is exact: `scheme://host[:port]`, the form
    a browser sends in `Origin`, with no path, query, fragment, trailing slash, userinfo or wildcard, and
    `https`, or `http` only for `localhost` and `127.0.0.1`. The form is canonical: a lowercase scheme and
    host, and no port that is the scheme's default (`https://app.example.com:443` and
    `https://App.example.com` are not what a browser sends, so they are not exact). One that is not exact is 400 `invalid_request`
    naming it; a deployment never normalises a submitted origin (it does not strip a slash), it refuses it.
    An origin stored before rev 12 that is not exact admits nothing, neither for CORS nor as a `return_to`;
    `GET /v1/origins` still returns it, so an administrator can replace it. A deployment never normalises an
    origin at request time.
    `GET` is open to any principal of the organisation; `PUT` is for an administrator of the organisation
    (403 `forbidden` otherwise), the rule that applies to authoring a policy.

    **Authentication.** `securitySchemes.bearer` only. The token is issued by the platform's
    authorization server with `aud` equal to the origin of the capability-named govern host (see
    `servers`), exactly: scheme and host, no path and no trailing slash, for example
    `https://govern.beta.noblecloak.com`. `/v1` is a path under that origin and is never part of
    `aud`. A browser module is an OAuth 2.1 public client (PKCE, dynamic client registration,
    RFC 8707 `resource` = this audience). A headless adapter authenticates as an organisation-scoped
    service principal (`client_credentials` with `private_key_jwt`; never approver-eligible), which is
    marked `x-noblecloak-status: specified` until the issuer ships it. Its token must carry the scope
    `module_api`; without it every authenticated route answers 403 `insufficient_scope`. DPoP is optional
    per surface, and `GET /v1/capabilities` says which mode applies (`dpop`: `off`, `optional` or
    `required`; absent means `off`). A deployment with `dpop` off answers 401 `dpop_unsupported` to a token
    that carries `cnf.jkt` and to the `Authorization: DPoP` scheme, and accepts bearer tokens only. A
    verified token with no organisation claim is 403 `organization_context_required` on every
    organisation-scoped route, which is every authenticated route, `GET /v1/capabilities` included.
    A request that carries any of the headers `x-actor-id`, `x-actor-type`, `x-organization-id`,
    `x-permissions` or `x-scopes`, or any header whose name starts with `x-actor-`, is rejected with 401
    `header_identity_rejected`: they are the kind an upstream gateway sets to say who the caller is, which
    organisation it acts for or what it may do, and they are never read. The rejection applies whatever the
    token (none, or valid), on every route that requires authentication, and comes before the token
    is verified. Identity comes from the verified token and from nothing else. No third-party
    identity-provider token is accepted.

    **Tenancy.** Nothing identifying the organisation, principal or scope is accepted from a request
    body. All three come from the verified token. The one body-selected scope is `run_id`, which must
    name an `external` run the caller owns. A deployment that does not advertise `runs` has no run to
    name: a `run_id` there is 404 `not_found`, whatever its value.

    **Idempotency.** Every `POST` that creates or appends (`/approvals`, `/records`, `/records/batch`,
    `/agents`, `/runs`, `/webhooks`) accepts an `Idempotency-Key` header
    (draft-ietf-httpapi-idempotency-key-header). A replay within 24 hours returns the original response
    and status. `/consume` and `/resolve` are idempotent by the obligation's state (409 discriminators),
    never by the header.

    **Who may resolve.** The principal that created an obligation through this API (an adapter, a
    service principal, a governance toolkit's backend) is never eligible to resolve it: 403
    `not_eligible`.

    **Terminal states free the identity.** `consumed`, `expired` and `withdrawn` close the obligation, so
    the next identical call (the same tool and arguments, in the same scope) opens a fresh one. Nothing is
    dispatched, escalated or resumed on expiry. `rejected` closes it too. A deployment that does not
    advertise the feature `approvals.rejected_duplicate` on `GET /v1/capabilities` frees the identity on a
    rejection as on the other end states (the rev 9 behaviour). A deployment that advertises it frees the
    identity on a rejection subject to the organisation's duplicate-requests policy (a policy of kind
    `duplicate_requests`; with none, `after_rejection: deny` and a window of 24 hours): an identical call
    within the window of a rejection is answered `deny` with reason `rejected_duplicate` and
    `rejected_approval_id` naming the most recent rejected approval of the identity within the window, and
    opens nothing (`POST /v1/approvals` answers it
    409 `rejected_duplicate`, carrying `rejected_approval_id`); under `after_rejection: ask_again` it opens
    a fresh approval carrying `prior_rejections` instead, until the count of rejections exceeds
    `max_reasks`; outside the window it opens a fresh approval. The count is of the rejections of the
    identity whose `resolved_at` lies within the window and that came after the identity's last consumed
    approval: a consumed approval resets it. Only a resolver's rejection counts; an approval that ended
    `rejected` because the action it approved was refused when it ran does not. The rule is there so that
    a person who said no is not asked the same question again at once; it is not a security control, and
    changed arguments are a different call. It applies to calls whose identity is scoped to a run or to a
    user principal. A service principal's calls that name no run share one identity across every end user
    behind that principal, so they are not subject to it. It covers the decisions this API answers and
    `POST /v1/approvals`; whether calls a deployment governs through another channel (a gateway in front
    of a tool server) are subject to it is the deployment's to say.

    **Who may read the Resumption.** `GET /v1/approvals/{id}/resumption` is served only to the principal
    that created the obligation. Any other principal, an approver included, gets 403 `not_owner`; the
    `resume_token` never reaches the approving browser. A service principal that did not create the
    obligation gets 404 instead (see the next paragraph).

    **Who sees an approval.** A user principal sees every approval of its organisation. A service principal
    (kind `service`) sees only the approvals it created, whether or not it sends `created_by=me`: the
    approvals list and the approvals stream carry no other, and a read of one it did not create (`GET
    /v1/approvals/{id}`, `/wait`, `/resumption`) is 404 `not_found`, exactly as for an approval of another
    organisation, so that the approval's existence is not disclosed. The same holds for the writes that
    name the approval and are the creator's: withdraw and consume, and `POST /v1/records` and
    `POST /v1/records/batch` with an `approval_id`, answer 404 `not_found` to a service principal that
    did not create it, once the request itself is valid and before any other check (a batch is refused
    whole: no element of it is appended); a reader that does see the approval gets the rules
    unchanged (only the creating principal withdraws or consumes: 403 `forbidden`). Resolve, approve and
    deny are unchanged too: a service principal never resolves, so they answer it 403 `not_eligible` on
    kind alone, whoever created the approval, and therefore do show that an approval with that id exists
    in the organisation. The 404 of the other routes hides that existence only from a caller that does
    not already hold the id, and a caller can hold one it did not create: the `approval_id` member of the
    records the organisation's records list returns. So the 403 relies on the id being unguessable, and
    an approval `id` MUST be unguessable: not sequential and not derivable
    from the action, the scope or any other value a caller can compute. A deployment that issues
    guessable ids lets a service principal probe for the existence of approvals it cannot read. The
    creating principal alone reads the `continuation` of an approval, in every state; every other reader sees
    `continuation_kind` and no `continuation`. A wider read for a service principal arrives later as a
    scope, not as a change to this rule. Approvals created by a service principal are therefore readable
    by that principal only: replacing a revoked principal with a new one orphans the old one's open
    approvals.

    **Who is named on an approval.** `Approval.requester` is the principal that created the approval. It is
    present on every representation of the approval to any reader who can see the approval, so a user
    principal sees it on every approval of its organisation and a service principal only on its own.
    `NamedPrincipalRef.display_name` is the name a deployment knows the principal by: it is optional, it
    is never the id repeated and never null, and it is absent when the deployment cannot name the
    principal, which is never an error. A name appears only where the reference is part of an approval
    (`requester`, `approver`, the entries of `resolution_history`, the principals of `waiting_on`), and
    `Approval.agent.name` names the agent the same way. A name is shown only to a reader who already
    sees the approval. A record (`Record.actor` and every other principal reference in the records
    family) and the signed Resumption carry ids and kinds only (`PrincipalRef`), never names. `Approval.waiting_on` is the creator's alone, and
    appears on the single read (`GET /v1/approvals/{id}`) only, never on a row of the list or on a stream
    event: on a pending approval, the count of principals eligible to resolve it that the deployment
    knows of at the time of the read and, when the creator is a user principal, up to five of them with
    their names; for a service-principal creator it is the count only, and for any other reader, and on
    an approval that is not pending, it is absent. The count may be zero, may change between reads, and is
    not a promise that any of those principals has been notified. It is best-effort: when the deployment
    cannot determine who is eligible, the creator's read still succeeds and leaves `waiting_on` out, and
    never answers 503 for it (the creator's own read of their approval does not depend on that lookup at
    all). `Approval.on_deny` (rev 9) is the creator's alone too, but unlike `waiting_on` it appears on every
    representation of the approval the creator reads (the single read, a row of the list, a stream
    event), is a snapshot of the matching policy taken when the approval was created, and is absent for
    every other reader.

    **Who sees the arguments of an approval.** A tool's `show_arguments_to_approvers` setting is off
    unless set; when it is on, the people who decide an approval of that tool see the call itself, and
    no summary of it is written for them. `arguments` is the arguments as the caller sent them (their
    digest is `action_digest`). The arguments shown are those of the request that opened the approval; a
    later matching request adds nothing. An approval has arguments to show only if the request that
    opened it carried `arguments`, not `arg_digest`, whichever door it came through (a decision, a
    batch, `POST /v1/approvals`, AuthZEN). `Approval.arguments` is present only when all of these hold: the tool has the setting on at
    the time of the read; the approval is not in a final state (`consumed`, `rejected`, `expired` or
    `withdrawn`); the operation is `GET /v1/approvals/{id}`; and the reader is the principal that
    created the approval or one eligible to approve it. Eligible to approve means a principal the
    deployment would accept as an approver while the approval is pending: never its creator or a service
    principal, and otherwise the deployment's own rule for who resolves. Eligibility does not change
    because the approval was approved. In every other case `arguments` is absent and the digest is all
    a reader sees. A deployment that cannot determine whether the reader is eligible answers 503
    `service_unavailable`, never the digest-only view. The arguments are cleared when the approval
    reaches a final state and when the setting is turned off, and turning it on later restores nothing.
    A deployment may refuse oversized arguments for a tool that has the setting on with 400
    `invalid_request` (`limits.approval_arguments_max_bytes` on `GET /v1/capabilities` says the bound
    in canonical-JSON bytes, when it advertises one); it never truncates them. No other operation and no delivery carries `arguments`:
    not a decision, a batch, AuthZEN, `createApproval`, the list, `wait`, the stream, the answer of
    resolve, approve, deny or withdraw, the Resumption, a record, a webhook delivery or a push callback.
    A deployment that does not serve approvals accepts the setting and ignores it: it has nothing to show.
    `Approval.arguments_state` says why a read shows what it shows, on `GET /v1/approvals/{id}` and on
    each approval of `GET /v1/approvals`, with the same values and the same rule on both; the list still
    never carries `arguments`. An approval in any other representation (a stream event, for one) may
    omit it, and a client that finds it absent treats the state as unknown, never as `shown`:
    `shown` (`arguments` is present), `not_enabled` (the tool's setting is off), `not_sent` (the approval
    holds no arguments: the request that opened it carried only `arg_digest`, or the setting was off
    then), `withheld` (the reader is neither the creator nor eligible to approve) and `final` (the
    approval is in a final state). The state depends on the reader. A reader who is neither the creator
    nor eligible to approve is told `final` for an approval in a final state and `withheld` otherwise,
    and never `not_enabled`, `not_sent` or `shown`: such a reader learns nothing of the tool's setting
    or of how the request was made. The creator and a reader eligible to approve are told the first of
    `final`, `not_enabled`, `not_sent`, `shown` that applies, and never `withheld`. The state discloses
    nothing of the arguments.

    **Who registers tools.** A deployment may allow only some principals to register or change tools, for
    example only an organisation's administrators. Any other principal is answered 403 `forbidden`,
    whatever the body. An **administrator** is a user whom the deployment recognises as an administrator
    of the organisation. A service principal is never an administrator for visibility: it sees the tools
    it registered itself and the organisation-owned tools, and no other principal's `principal`-owned
    tools. Who may register tools on a deployment that restricts registration is the deployment's own
    rule (`Capabilities.tool_registration`) and is separate from who sees another principal's tools. A
    tool registered as `owner_kind: principal` is visible only to its owner and to administrators;
    `POST /v1/tools` gives the rule.

    **Agent identity (rev 13).** An agent is a row of `/v1/agents`. A row can be bound to at most one
    service principal of the organisation (`PUT /v1/agents/{id}/principal`; `Agent.principal_id` reads the
    binding, and is null when the agent is unbound), and a service principal is bound to at most one agent.
    Binding gives an agent an identity the deployment can trust: a service principal authenticates with a
    token, and the binding says which agent that token acts for. Policies whose subject is an agent
    (`{ type: agent, id }`) apply to a call **only** through that binding: a decision, a record, or a
    simulation without `subject` is held by an agent's policies when the caller is the service principal
    bound to that agent, and by no agent's policies otherwise. `actor.agent_id` on a request never selects a
    policy; it stays a hint that a deployment may show (see `ActorHint`). An approval's `agent` follows the
    same rule: when the caller is a bound service principal the approval names the bound agent and the hint is
    ignored, and when the caller is not bound the hint is shown as before. Binding and unbinding are for
    administrators of the organisation: any other caller, a service principal included, is 403
    `forbidden`. Agent policies only tighten: they compose under the same rule as every other policy
    (see `policies.tightest_wins`) and this revision changes no composition rule.

    **Reserved roles (rev 13).** Every caller of an organisation holds the role `everyone`, whatever its
    kind (a user, an agent, a service principal): it is the organisation's baseline. A policy may name it
    as a subject (`{ type: role, id: everyone }`), and a policy on `everyone` applies to every caller of
    the organisation beside the policies of the caller's other subjects. `everyone` is held implicitly and
    is reserved: a deployment never lets it be assigned to a principal, never lists it as a directory role
    and never lets it be created as a role: `GET /v1/principals?type=role` omits it, and so does a listing
    without `type`. A deployment maps a role key to its own form (see `PolicySubject`), so the rule covers
    every form: no listed entry names `everyone` by an `id` that is `everyone` or ends in `:everyone` or
    `/everyone`, or by a `display_name` of `everyone`, in any case. Simulating as
    `{ type: role, id: everyone }` gives the baseline: the policies of the `everyone` role plus the
    organisation's. The word `default` is not a role: it is only a value of `source` on a `considered`
    entry (a default of the deployment).

    **Deployment-applied proposals (rev 14).** A deployment-applied reference is a `tool_ref` in the
    namespace `tool:noblecloak:`. It names no tool that a caller runs: it names a change that the
    deployment itself makes when an approval for it is approved. A caller opens that approval through
    `POST /v1/approvals`, an administrator of the organisation approves it, and the deployment applies the
    change in one step. The first and only reference is `tool:noblecloak:propose-policy-set`, whose
    arguments are a `PolicySetProposal`: an agent's tools, its binding to a service principal and the
    policies that govern it, proposed together.

    - *The namespace is reserved.* Registering a tool under it is 422 `reserved_tool_ref`. A deployment-applied
      reference is never listed by `GET /v1/tools`, and is never decided as an ordinary tool: a decision on
      it is `deny` with reason `unknown_tool`. Its policy is fixed at `ask`, and no policy can change it:
      authoring a policy (or simulating a proposed body) whose `targets` name a reference in the namespace
      is 422 `policy_immutable`, and an import lists such a policy under `unsupported` instead of importing it.
    - *A deployment says which references it applies.* `Capabilities.deployment_applied` lists each as
      `{ tool_ref, arguments_schema_ref }`, where `arguments_schema_ref` names the schema in this document that
      `action.arguments` must fit. A deployment that does not list a reference answers 422
      `approval_unroutable` when one is opened for it. A deployment applies `tool:noblecloak:propose-policy-set`
      only if it authors and publishes policies of its own and lists it, which today means a hosted one.
    - *Opening.* `action.arguments` is required (an `arg_digest` alone is a refusal with `code` `shape`), the
      caller must be a user, and a refusal is 422 `proposal_refused` with a `code` (see `PolicySetProposal`). The
      approvers of a deployment-applied approval always see its `arguments`, whatever any tool's
      `show_arguments_to_approvers` says, under the rules of Who sees the arguments of an approval, and the
      arguments of a proposal fit `limits.approval_arguments_max_bytes` where the deployment advertises one
      (400 `invalid_request` otherwise). A proposal that is bigger than a deployment keeps is made in
      several smaller ones.
    - *Approving applies, all or nothing.* Approving re-runs the checks that opening ran against the state at
      that moment, then applies the change in a fixed order: the tools of the proposal are registered, the
      agent is bound to its service principal, and each policy is created and published, in the order of
      `policies`. If any step cannot be applied, nothing is applied, whatever the earlier steps did. The
      approval then resolves `rejected`, and the answer to the approve call is still 200 with the approval
      in that state; the approval is not left `approved`. `resolution_history` records why: its last entry
      has `resolution: rejected`, `by` the administrator whose approval the deployment refused to apply, and
      `reason` of the form `proposal_refused:<code>`, where `<code>` is a code of `proposal_refused` or
      `policy_conflict` (a policy to publish met a published policy of the same tool and subject). A
      rejection by a person carries the reason that person gave, if any. When the change
      is applied, the approval is `approved` and at once `consumed`: nothing resumes, because the change
      was made by the deployment. Denying applies nothing.
    - *Who approves.* An administrator of the organisation, under the deployment's own eligibility rules. The
      principal that opened the approval may approve it only on the terms of
      `Capabilities.self_approval_from_approver_surface`: with a token issued to the approver surface,
      never with the token it opened the approval with. That is the rule for every deployment-applied
      reference.
    - *The preview.* While a deployment-applied approval is pending, `GET /v1/approvals/{id}` returns
      `Approval.preview` to a reader who may approve it. The preview is computed when the approval is
      opened, is no part of `arguments` and counts toward no limit.

    **Argument digest.** `arg_digest` is the lowercase hex SHA-256 of the RFC 8785 canonical form of the
    arguments as sent, before schema defaults. A tool whose schema declares a `contentEncoding: base64`
    or `x-noblecloak-streaming: true` argument contributes the SHA-256 of the decoded bytes (or of the
    stream) in place of the value, declared in the tool's schema so both sides agree.

    **Vocabulary.** The decision, resolution, state and side-effect vocabularies, and how other policy
    engines map onto them, are published as `x-noblecloak-vocabulary` and summarised here. A decision
    is `allow`, `deny` or `step_up`; `defer` is reserved and has no emitter in v1. A policy mode
    `always_allow` maps to `allow`; `ask` and `escalate` map to `step_up`; `not_granted` and `deny` map
    to `deny`. A policy `ask` is `step_up` on every invocation channel (`interactive`, `headless` and
    `workflow`) when approvals are served: the channel never changes the decision. When the deployment
    cannot open or route the approval it answers `deny` with reason `approval_unroutable` on a decision,
    or 422 `approval_unroutable` on `POST /v1/approvals`, never a silent `allow` and never a `step_up`
    with nothing behind it. A governance toolkit's `requires_approval` maps to `step_up`, and `rate_limit` to `deny`
    with reason `rate_limited`. The reason `rejected_duplicate` is a `deny`: an identical call after a
    resolver rejected it, within the window of the organisation's duplicate-requests policy (see Terminal
    states free the identity). A policy's kind is open-ended: the documented kinds are `tool_invocation`,
    `spending` and `duplicate_requests`, and a client treats a kind it does not know as a policy it cannot
    evaluate, never as a decision. The resolution of an approval is `approved`, `rejected` or `escalated`;
    the set is open-ended, so a client treats an unknown value as a resolution it does not act on. The
    state of an approval is `pending`, `approved`, `rejected`, `consumed`, `expired` or `withdrawn`. The
    side-effect level is `read`, `write`, `delete`, `external` or `admin`, with no other spelling on the
    wire.
  x-noblecloak-problem-types:
    unauthorized:
      status: 401
      title: Authentication required
    invalid_token:
      status: 401
      title: Token invalid or expired
    wrong_audience:
      status: 401
      title: Token audience is not this API
    dpop_unsupported:
      status: 401
      title: This deployment does not verify DPoP proofs and accepts bearer tokens only
    header_identity_rejected:
      status: 401
      title: A request that carries a gateway identity header is rejected, whatever token it carries; identity comes only from the bearer token
    forbidden:
      status: 403
      title: Not permitted
    organization_context_required:
      status: 403
      title: The verified token carries no organisation, and this route is organisation-scoped
    insufficient_scope:
      status: 403
      title: "The token does not carry the scope the route requires: module_api for a service principal, or the Capabilities.user_resolve_scope for a user on a resolve route"
    entitlement_required:
      status: 403
      title: The organisation is not entitled to this route
    not_eligible:
      status: 403
      title: Principal is not eligible to resolve this obligation
    not_owner:
      status: 403
      title: Only the creating principal may read the Resumption
    not_found:
      status: 404
      title: Not found
    not_available_on_deployment:
      status: 404
      title: Route is not served on this deployment
    invalid_request:
      status: 400
      title: Request does not match the schema
    identity_not_accepted:
      status: 400
      title: Identity assertions are not accepted from a request body
    attestation_not_accepted:
      status: 400
      title: attestation is derived by the server
    callback_unroutable:
      status: 400
      title: callback_url is not public-routable https
    invalid_continuation:
      status: 400
      title: Continuation does not match its delivery, or the deployment does not serve that delivery
    already_resolved:
      status: 409
      title: Approval is already resolved
    approval_conflict:
      status: 409
      title: Digest mismatch or concurrent resolution
    already_resumed:
      status: 409
      title: Resumption was already consumed
    obligation_consumed:
      status: 409
      title: Obligation was already consumed
    obligation_expired:
      status: 409
      title: Obligation expired
    obligation_withdrawn:
      status: 409
      title: Obligation was withdrawn by its requester
    continuation_expired:
      status: 409
      title: Continuation expired
    continuation_conflict:
      status: 409
      title: Open obligation already has a different continuation
    governed_run_not_creatable:
      status: 405
      title: A governed run is created by the platform, not by a caller
    idempotency_key_reuse:
      status: 422
      title: Idempotency-Key was reused with a different request
    continuation_unsupported:
      status: 422
      title: This deployment does not serve approvals, so it cannot store a continuation
    rate_limited:
      status: 429
      title: Rate limit exceeded
    payload_too_large:
      status: 413
      title: The request body is larger than this deployment accepts
    batch_too_large:
      status: 400
      title: The batch has more items than this deployment accepts; max_items says how many it does
    reserved_tool_ref:
      status: 422
      title: "The tool reference is in a namespace this deployment reserves (rev 14: the namespace tool:noblecloak: is reserved to deployment-applied references)"
    system_tool_ref:
      status: 422
      title: The tool reference is a system tool's
    tool_ref_in_use:
      status: 422
      title: The tool reference is already in use in the caller's organisation, so a call under it would be ambiguous or the tool is not the caller's to see
    approval_unroutable:
      status: 422
      title: The deployment cannot open or route an approval for this tool
    unsupported_policy_form:
      status: 422
      title: The policy uses a kind, subject type, target form, mode or config member this deployment cannot enforce; member names it (rev 13; detail names it on a rev 12 deployment)
    policy_conflict:
      status: 409
      title: Another published policy already governs one of this policy's (tool, subject) pairs; policy_id names it
    principal_bound:
      status: 409
      title: The service principal is already bound to another agent (rev 13); agent_id names that agent
    proposal_refused:
      status: 422
      title: The deployment refuses to open this deployment-applied proposal (rev 14); code says why and member names the part of the body that caused it, where one does
    policy_immutable:
      status: 422
      title: The policy targets a deployment-applied reference, whose policy is fixed and no policy can change (rev 14)
    rejected_duplicate:
      status: 409
      title: An identical call was rejected within the window of the duplicate-requests policy; rejected_approval_id names the rejection
    connection_exists:
      status: 409
      title: A registration of the same tool server already exists in the organisation; connection_id names it when the caller may read it
    side_effect_level_downgrade:
      status: 409
      title: A tool's side-effect level may stay, rise or move to a level of equal rank through this API and never falls
    internal_error:
      status: 500
      title: The deployment failed to answer
    service_unavailable:
      status: 503
      title: The deployment cannot answer right now; retry later
  x-noblecloak-deployment-applied:
    tool:noblecloak:propose-policy-set:
      description: |
        Rev 14: the arguments of an approval for this reference. `Capabilities.deployment_applied` names the same schema by `arguments_schema_ref`.
      arguments:
        $ref: "#/components/schemas/PolicySetProposal"
  x-noblecloak-vocabulary:
    decision:
      - allow
      - deny
      - step_up
      - defer
    decision_from_policy_mode:
      always_allow: allow
      ask: step_up
      escalate:
        decision: step_up
        routing: escalated
      not_granted:
        decision: deny
        reason: not_granted
      deny: deny
    decision_from_governance_toolkit:
      allow: allow
      deny: deny
      requires_approval: step_up
      rate_limit:
        decision: deny
        reason: rate_limited
    decision_from_orchestrator:
      allow: allow
      deny: deny
      pending: step_up
    decision_from_reason:
      rejected_duplicate: deny
      credential_link_required: deny
    resolution:
      known:
        - approved
        - rejected
        - escalated
    state:
      known:
        - pending
        - approved
        - rejected
        - consumed
        - expired
        - withdrawn
    side_effect_level:
      - read
      - write
      - delete
      - external
      - admin
    reserved:
      defer: A non-human condition. Carries condition { kind, resume_at?, ref? } and the same obligation handle. No emitter in v1.
    annotations:
      observe: A decision that was not enforced carries enforced false and would_be set to the decision it would have been. It is never a decision value.
servers:
  - url: https://govern.{env}.{domain}
    description: |
      The module API's own capability-named host. The token audience is this host's origin (no path, no trailing slash), and it is never the shared platform API host.
    variables:
      env:
        default: beta
        description: |
          Environment segment.
      domain:
        default: noblecloak.com
        description: |
          Deployment domain.
security:
  - bearer: []
tags:
  - name: Decisions
    description: |
      Ask for a decision on an action.
  - name: Approvals
    description: |
      The obligation a step-up decision opens, and how it is resolved and consumed. Who sees an approval, and who reads its continuation, is stated once in the API description (Who sees an approval).
  - name: Continuations
    description: |
      How the runtime is told an approval resolved.
  - name: Records
    description: |
      The append-only record of what was decided and done.
  - name: Policies
    description: |
      Policy read, authoring, simulation, import and export.
  - name: Connections
    description: |
      Connections to tool servers.
  - name: Tools
    description: |
      Addressable tools that policies reference.
  - name: Principals
    description: |
      Users, agents, services, groups, roles and runs.
  - name: Webhooks
    description: |
      Signed event deliveries.
  - name: Origins
    description: |
      Registered browser origins.
  - name: Capabilities
    description: |
      What this deployment serves.
  - name: Keys
    description: |
      The key set that verifies Resumptions and deliveries.
  - name: Edge
    description: |
      The edge protocol, by reference only.
paths:
  /v1/decisions:
    post:
      operationId: decide
      tags:
        - Decisions
      summary: Ask for a decision on an action.
      description: |
        The platform's decide, as the module API serves it. The principal is the token's and is never read from the
        body. `actor.run_id` names an `external` run the caller owns and selects its scope; without it the
        principal scope applies. `continuation` is stored if and only if the decision is `step_up`; one
        continuation per obligation, so a different one for the same open identity is 409
        `continuation_conflict` and an identical one (the same JSON value; member order does not matter) is the idempotent retry. `expect_approval_id` is a
        hint only: this route never consumes.

        A deployment that does not advertise `approvals` (see `GET /v1/capabilities`) has nowhere to keep a
        continuation and opens no obligation. It answers 422 `continuation_unsupported` if, and only if,
        the request carries a `continuation` and the decision is `step_up`; on `allow` and `deny` it accepts
        the request and ignores the continuation. A deployment that advertises `approvals` stores it as
        described above.

        For an identity whose obligation is approved and not yet consumed, the answer is `allow` when the
        gateway will admit the call, and `step_up` with `approval.state: approved` when the caller must
        consume it through `/consume`. Tell which applies from `approval.resume_token_will_issue`; when it
        is `false` the caller has nothing to consume and must not execute the action itself.

        A policy `ask` is `step_up` on every invocation channel when approvals are served. When the
        deployment cannot open or route the approval it answers `deny` with reason `approval_unroutable`,
        never a silent `allow` and never a `step_up` with nothing behind it; a tool with no catalog row,
        or one that is `withdrawn` (rev 11; see `Tool.status`), stays `deny` with reason `unknown_tool`. On a
        deployment that advertises
        `approvals.rejected_duplicate`, a step-up for an identity a resolver rejected within the window of
        the duplicate-requests policy is answered `deny` with reason `rejected_duplicate` and
        `rejected_approval_id`, and opens nothing (see Terminal states free the identity). On a deployment that
        advertises `connections.user_links` (rev 11), a call to a tool of a `per_user` registration by a
        caller with no usable link to it (none, consent not `given`, or `degraded`) that opens no approval
        is `deny` with reason `credential_link_required`; a step-up opens the approval, which carries
        `blocked_on` for the principal the call runs as (the run's owner; on a direct call, the creator). The
        answer carries no `arguments`: the arguments of an
        approval are read from `GET /v1/approvals/{id}` only (see Who sees the arguments of an approval).
        A deployment may refuse a `continuation` whose delivery it does not serve with 400
        `invalid_continuation`, after the `callback_url` check for a push; `continuation_deliveries` on
        `GET /v1/capabilities` lists the deliveries it serves.

        Nothing identifying the organisation, principal or scope is accepted from the request body; it comes from the verified token.
      x-noblecloak-deployment: both
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: |
            The decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionEnvelope"
        "400":
          $ref: "#/components/responses/BadRequestCallback"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictContinuation"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableContinuation"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/decisions/batch:
    post:
      operationId: decideBatch
      tags:
        - Decisions
      summary: Ask for decisions on a list of actions.
      description: |
        Array in, array out, in the same order. For gateways evaluating a tool list. The elements are
        decided in order under the token's principal, each as `/v1/decisions` would decide it. Identical
        elements (the same tool and arguments, in the same scope) are one obligation: the first of them
        opens it or joins the open one, and the rest join it, or are denied with it under the
        rejected-duplicate rule (see Terminal states free the identity). The `continuation` rule of `/v1/decisions`
        applies to each element: on a deployment that does not advertise `approvals`, one element that is
        `step_up` and carries a `continuation` refuses the whole batch with 422 `continuation_unsupported`.

        At most 100 requests: a body above that is a schema violation (400 `invalid_request`). A deployment
        may accept fewer and says so in `limits.decisions_batch_max_items` on `GET /v1/capabilities`; a
        batch above that limit and no larger than 100 is 400 `batch_too_large`, whose problem body carries
        `max_items`.

        Nothing identifying the organisation, principal or scope is accepted from the request body; it comes from the verified token.
      x-noblecloak-deployment: both
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionBatchRequest"
      responses:
        "200":
          description: |
            One decision per request element.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionBatchEnvelope"
        "400":
          $ref: "#/components/responses/BadRequestDecisionBatch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictContinuation"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableContinuation"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /access/v1/evaluation:
    post:
      operationId: authzenEvaluate
      tags:
        - Decisions
      summary: AuthZEN access evaluation over the same decision schema.
      description: |
        The root-mounted AuthZEN Authorization API 1.0 evaluation endpoint. 1.0 is the OpenID Foundation's
        Final Specification (approved 2026-01-12), not a draft; the version this operation implements is
        pinned by its version extension. `resource.type` is `tool`,
        `resource.id` is the `tool_ref`, `action.name` is the tool method (or `invoke`), and
        `context.arguments` or `context.arg_digest` carries the action. `subject` is informational: the
        principal is the token's. The response is AuthZEN's `decision: true | false`; `context.noblecloak`
        carries the full decision object. A `step_up` decision answers `decision: false`.

        Nothing identifying the organisation, principal or scope is accepted from the request body; it comes from the verified token.
      x-noblecloak-deployment: both
      x-noblecloak-authzen-version: AuthZEN Authorization API 1.0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthzenEvaluationRequest"
      responses:
        "200":
          description: |
            The AuthZEN evaluation response. It is not wrapped in the envelope, as AuthZEN requires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthzenEvaluationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /.well-known/authzen-configuration:
    get:
      operationId: authzenConfiguration
      tags:
        - Decisions
      summary: AuthZEN discovery.
      description: |
        Policy decision point metadata for AuthZEN clients. Unauthenticated and not wrapped in the envelope.
      x-noblecloak-deployment: both
      security: []
      responses:
        "200":
          description: |
            The discovery document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthzenConfiguration"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/approvals:
    post:
      operationId: createApproval
      x-noblecloak-family: approvals
      tags:
        - Approvals
      summary: Open an approval for an action the caller's own engine decided on.
      description: |
        The door for callers whose own engine decided: a governance toolkit's escalation backend or a
        hand-rolled check. Creates an obligation from `action` and `continuation`. The server computes the
        identity and dedupes on the open obligation shared with `/decisions`: a match returns 200 with
        `created: false` and the same id. Rev 16: on a deployment that lists `approvals.requirements`, the
        approval carries the requirements a decision of the same call would set, and a match is joined only as
        `Approval.requirements` states (an `approved` match is joined as it is, 200, whatever the call sets: it
        keeps the requirements it was approved under and no other approval opens). An approval id supplied in the body is an identity assertion and
        is refused with 400 `identity_not_accepted`. `run_id` is an `external` scope from `POST /v1/runs`;
        absent, the principal scope applies. The creating principal can never resolve what it created.

        A tool with no catalog row, a `withdrawn` one (rev 11), or one whose approval the deployment cannot
        open or route, is 422 `approval_unroutable`, and `detail` names the reason. Rev 14: a
        `tool_ref` in the namespace `tool:noblecloak:` is a deployment-applied reference and is not a tool: a
        deployment that lists it in `Capabilities.deployment_applied` checks `action.arguments` against the
        schema named there and opens an approval whose approval applies a change (see Deployment-applied
        proposals); a refusal is 422 `proposal_refused` with `code`, and a deployment that does not list it
        answers 422 `approval_unroutable`. On a deployment that advertises
        `approvals.rejected_duplicate`, an identity a resolver rejected within the window of the
        duplicate-requests policy is 409 `rejected_duplicate`, carrying `rejected_approval_id`, and nothing
        is opened (see Terminal states free the identity). The handle carries no `arguments`: they are
        read from `GET /v1/approvals/{id}` only (see Who sees the arguments of an approval). A
        deployment may refuse a `continuation` whose delivery it does not serve with 400
        `invalid_continuation`, after the `callback_url` check for a push; `continuation_deliveries` on
        `GET /v1/capabilities` lists the deliveries it serves.

        Nothing identifying the organisation, principal or scope is accepted from the request body; it comes from the verified token.
      x-noblecloak-deployment: both
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApprovalRequest"
      responses:
        "200":
          description: |
            An open obligation for this action already existed (`created: false`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalHandleEnvelope"
        "201":
          description: |
            A new obligation was opened (`created: true`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalHandleEnvelope"
        "400":
          $ref: "#/components/responses/BadRequestCreateApproval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictCreateApproval"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableCreateApproval"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listApprovals
      x-noblecloak-family: approvals
      tags:
        - Approvals
      summary: The approval queue.
      description: |
        Approvals visible to the caller, newest first (by creation; `order=resolved_at` orders by
        resolution time and returns only the approvals that have been resolved). `state` takes one state
        or a comma-separated set. `approver=me` filters to those the caller may resolve, and
        `created_by=me` to those the caller created. Each row carries `arguments_state`, with the values
        and the reader-dependent rule it has on the single read (see Who sees the arguments of an
        approval), so a queue can tell why a row shows no arguments; a row never carries `arguments`
        themselves. A deployment that cannot determine which approvals
        the caller may resolve answers 503 `service_unavailable` with `reason` `eligibility_lookup`. A user principal sees every approval of
        its organisation; a service principal sees only the approvals it created, with or without
        `created_by=me` (see Who sees an approval). Each row carries `continuation` only when the caller
        created it.
      x-noblecloak-deployment: both
      parameters:
        - $ref: "#/components/parameters/ApprovalStateSet"
        - $ref: "#/components/parameters/ApprovalOrder"
        - name: approver
          in: query
          description: |
            `me` returns approvals the caller is eligible to resolve.
          schema:
            type: string
            enum:
              - me
        - $ref: "#/components/parameters/CreatedBy"
        - name: scope
          in: query
          description: |
            A scope id (see `GET /v1/runs/{id}`).
          schema:
            type: string
        - name: outcome
          in: query
          description: |
            `missing` returns consumed approvals that have no outcome record.
          schema:
            type: string
            enum:
              - missing
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: |
            A page of approvals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/approvals/{id}:
    get:
      operationId: getApproval
      x-noblecloak-family: approvals
      tags:
        - Approvals
      summary: Approval detail.
      description: |
        Includes lineage (`agent.parent`, run kind), `policy` when an explicit policy matched,
        `continuation_kind`, `resolution_history`, and `arguments` on this operation only: when the tool
        has `show_arguments_to_approvers` on at the time of the read, the approval is not final, and the
        reader is the principal that created it or one eligible to approve it (see Who sees the
        arguments of an approval); otherwise only the digest. A deployment that cannot determine
        whether the reader is eligible answers 503 `service_unavailable` with `reason`
        `eligibility_lookup`, never the digest-only view. `arguments_state` says why the arguments are
        shown or not, `requester` names the principal that created the approval, and `waiting_on` is
        present for the creator of a pending approval, on this operation only and best-effort: when the
        deployment cannot determine who is eligible the read is still 200 and `waiting_on` is absent; the
        creator's read does not depend on that lookup. `on_deny` (rev 9) is the creator's alone and is
        present only when the matching policy stated it at creation. `blocked_on` (rev 11) is shown only to
        the principal the call runs as (the run's owner; on a direct call, the creator): present while the call
        waits on that principal's own credential link. The full `continuation` is
        included only when the caller is the principal that created the approval, in every state; for
        every other reader the member is absent. A service principal reading an approval it did not create
        gets 404 `not_found` (see Who sees an approval).
      x-noblecloak-deployment: both
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          description: |
            The approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/approvals/{id}/resolve:
    post:
      operationId: resolveApproval
      x-noblecloak-family: approvals
      tags:
        - Approvals
      summary: Resolve an approval.
      description: |
        The canonical resolve. 409 `approval_conflict` when `expected_action_digest` does not match the
        approval's action or another resolution won; 403 `not_eligible` when the caller may not resolve
        it, which includes the principal that created the obligation. A deployment may refuse a
        resolution it does not serve, `escalated` where it has no escalation, with 400 `invalid_request`
        (`Capabilities.resolutions` says which it can produce). A deployment that cannot determine whether
        the caller is eligible answers 503 `service_unavailable` with `reason` `eligibility_lookup`.

        Rev 16: on an approval that carries `requirements`, `approved` satisfies every unmet requirement the caller is eligible for, and answers 200 with the approval still `pending` while any requirement is unmet (see `Approval.requirements`); `rejected` rejects the approval. A caller eligible for no unmet requirement is 403 `not_eligible` while the approval is `pending`.

        Where the deployment advertises `Capabilities.user_resolve_scope`, a user's token must carry that scope: without it the call is 403
        `insufficient_scope`, answered before the body is validated, before the approval is looked up and before eligibility is considered: an approval id that does not exist is still 403 `insufficient_scope`, and a missing scope is never reported as `not_found`, `invalid_request` or `not_eligible`.

        Nothing identifying the organisation, principal or scope is accepted from the request body; it comes from the verified token.
      x-noblecloak-deployment: both
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
      responses:
        "200":
          description: |
            The approval after resolution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenNotEligible"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictResolve"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/approvals/resolve/batch:
    post:
      operationId: resolveApprovalsBatch
      x-noblecloak-family: approvals
      tags:
        - Approvals
      summary: Resolve a list of approvals.
      description: |
        Array in, array out, in the same order. Each element names one approval and resolves it as
        `POST /v1/approvals/{id}/resolve` does, under the token's principal, with the same rules per
        element: eligibility, the `expected_action_digest` the approver saw, the resolutions the
        deployment serves. An element is answered by the resulting `Approval`, or by a problem document
        (the same `type` and `status` the single route would answer), so one `approval_conflict` or
        `not_found` does not fail the rest; the elements are resolved one at a time and independently, in
        order. An approval named twice is resolved by its first element and the repeat answers the conflict
        the single route gives for an approval that is no longer pending (`already_resolved`). Rev 16: on an
        approval that carries `requirements`, each element is applied as `/resolve` applies it (see
        `Approval.requirements`), so a first element that leaves a requirement unmet leaves the approval
        `pending`, and a repeat by an approver eligible for no unmet requirement left answers 403
        `not_eligible`; once the approval is no longer pending, a repeat answers `already_resolved` as above. The body is
        validated whole before any element is applied: one malformed element, or an empty list, is 400
        `invalid_request` and nothing in the batch is resolved. A service principal never resolves: the call is 403 `not_eligible` as a whole. A
        deployment that cannot determine whether the caller is eligible answers 503 `service_unavailable`
        with `reason` `eligibility_lookup`. `Idempotency-Key` is not used, as for `/resolve`.

        At most 100 elements: a body above that is a schema violation (400 `invalid_request`). A
        deployment may accept fewer and says so in `limits.resolutions_batch_max_items` on
        `GET /v1/capabilities`; a batch above that limit and no larger than 100 is 400
        `batch_too_large`, whose problem body carries `max_items`, and nothing in it is resolved.

        Where the deployment advertises `Capabilities.user_resolve_scope`, a user's token must carry that scope: without it the call is 403
        `insufficient_scope`, answered before the body is validated, before the approval is looked up and before eligibility is considered: an approval id that does not exist is still 403 `insufficient_scope`, and a missing scope is never reported as `not_found`, `invalid_request` or `not_eligible`.

        Nothing identifying the organisation, principal or scope is accepted from the request body; it comes from the verified token.
      x-noblecloak-deployment: both
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveBatchRequest"
      responses:
        "200":
          description: |
            One result per element, in order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveBatchEnvelope"
        "400":
          $ref: "#/components/responses/BadRequestResolveBatch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenNotEligible"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
