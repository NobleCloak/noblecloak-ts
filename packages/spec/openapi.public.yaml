        Hosted only, and only where the deployment advertises the feature `policies.import_export` (rev
        10: a hosted deployment that does not advertise it answers 404 `not_available_on_deployment`).
        Returns a report; nothing is lost silently. Whatever cannot be represented is listed under
        `unsupported`.

        Rev 14: a policy whose `targets` name a reference in the namespace `tool:noblecloak:` is never
        imported, because no policy changes a deployment-applied reference (see Deployment-applied
        proposals). It is listed under `unsupported`, with a `reason` that names `policy_immutable`.

        Nothing identifying the organisation, principal or scope is accepted from the request body; it comes from the verified token.
      x-noblecloak-deployment: hosted
      parameters:
        - name: format
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PolicyFormat"
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: |
            The import report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyImportEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotAvailableOnDeployment"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/policies/{id}/export:
    get:
      operationId: exportPolicy
      x-noblecloak-family: policies
      x-noblecloak-feature: policies.import_export
      tags:
        - Policies
      summary: Export a policy.
      description: |
        Hosted only, and only where the deployment advertises the feature `policies.import_export` (rev 10: a hosted deployment that does not advertise it answers 404 `not_available_on_deployment`).
      x-noblecloak-deployment: hosted
      parameters:
        - $ref: "#/components/parameters/PolicyId"
        - name: format
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PolicyFormat"
