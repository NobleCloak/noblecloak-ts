      operationId: deleteWebhook
      x-noblecloak-family: webhooks
      tags:
        - Webhooks
      summary: Delete a webhook.
      description: |
        Stops deliveries. For an administrator of the organisation (rev 12): any other principal is 403 `forbidden`. A webhook of another organisation is 404 `not_found`, answered before the administrator check.

