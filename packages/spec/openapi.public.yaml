        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/tools:
    get:
      operationId: listTools
      tags:
        - Tools
      summary: List tools.
      description: |
        Addressable tools that policies reference. A tool whose `owner.kind` is `principal` is listed only to the principal that registered it and to administrators (an administrator is a user, never a service principal; see Who registers tools); a tool whose `owner.kind` is `org` is listed to every principal of the organisation. A decision for a `principal` tool by any other principal is answered as for a tool with no catalog row: `deny` with reason `unknown_tool`. Tools registered by `POST /v1/connections/{id}/refresh` carry `transport` `mcp` or `a2a` and their `connection_id`. A tool its server no longer offers, or whose connection was deleted, stays listed with `status: withdrawn` (rev 11) and keeps the `connection_id` it was last registered from; a decision for it is `deny` with reason `unknown_tool`.
