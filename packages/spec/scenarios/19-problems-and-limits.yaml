- id: resolve-batch-eligibility-is-per-item
  title: A batch resolve applies the single route's eligibility rule to every element - a member who may not approve, and the approval's own creator, each get the refusal the single resolve gives for that element, while an eligible approver's element in the same position is served
  tags: [both, negative, lifecycle]
  requires: approvals
  needs: [creator_user, approver, member]
  steps:
    - name: register a tool the organisation shares
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:be:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
      expect: { status: 201 }
    - name: a user opens an approval
      as: creator_user
      request:
        method: POST
        path: /v1/decisions
        body:
          action: { tool_ref: 'ext:be:${uniq}', arguments: { q: 'a-${uniq}' } }
          continuation: { kind: adk, delivery: pull }
      expect: { status: 200 }
      save: { a_id: data.approval.id, a_digest: data.action_digest }
    - name: another user opens one
      as: approver
      request:
        method: POST
        path: /v1/decisions
        body:
          action: { tool_ref: 'ext:be:${uniq}', arguments: { q: 'd-${uniq}' } }
          continuation: { kind: adk, delivery: pull }
      expect: { status: 200 }
      save: { d_id: data.approval.id, d_digest: data.action_digest }
    - name: a member who may not approve gets the single route's refusal for the element
      as: member
      request:
        method: POST
        path: /v1/approvals/resolve/batch
        body:
          items:
            - {
                approval_id: '${a_id}',
                resolution: approved,
                expected_action_digest: '${a_digest}',
              }
      expect:
        status: 200
        body:
          - { path: data, length: 1 }
          - { path: data.0.status, equals: 403 }
          - { path: data.0.type, matches: 'not_eligible$' }
    - name: the creator gets the same refusal for its own approval, and its element on another's approval is served
      as: creator_user
      request:
        method: POST
        path: /v1/approvals/resolve/batch
        body:
          items:
            - {
                approval_id: '${a_id}',
                resolution: approved,
                expected_action_digest: '${a_digest}',
              }
            - {
                approval_id: '${d_id}',
                resolution: approved,
                expected_action_digest: '${d_digest}',
              }
      expect:
        status: 200
        body:
          - { path: data, length: 2 }
          - { path: data.0.status, equals: 403 }
          - { path: data.0.type, matches: 'not_eligible$' }
          - { path: data.1.id, equals: '${d_id}' }
          - { path: data.1.state, equals: approved }
    - name: the refused approval is still pending
      as: approver
      request: { method: GET, path: '/v1/approvals/${a_id}' }
      expect:
        status: 200
        body:
          - { path: data.state, equals: pending }
    - name: an eligible approver resolves it in the same position
      as: approver
      request:
        method: POST
        path: /v1/approvals/resolve/batch
        body:
          items:
            - {
                approval_id: '${a_id}',
                resolution: approved,
                expected_action_digest: '${a_digest}',
              }
      expect:
        status: 200
        body:
          - { path: data.0.id, equals: '${a_id}' }
          - { path: data.0.state, equals: approved }
- id: resolve-batch-edge-cases
  title: A batch that names an approval twice applies the first and answers the repeat with the conflict the single route gives, a body with a malformed element is refused whole before any element is applied, and an empty batch is refused
  tags: [both, negative, lifecycle]
  requires: approvals
  needs: [approver]
  steps:
    - name: register a tool the organisation shares
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:bx:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
      expect: { status: 201 }
    - name: two approvals are open
      as: creator
      request:
        method: POST
        path: /v1/decisions
        body:
          action: { tool_ref: 'ext:bx:${uniq}', arguments: { q: 'a-${uniq}' } }
          continuation: { kind: adk, delivery: pull }
      expect: { status: 200 }
      save: { a_id: data.approval.id, a_digest: data.action_digest }
    - as: creator
      request:
        method: POST
        path: /v1/decisions
        body:
          action: { tool_ref: 'ext:bx:${uniq}', arguments: { q: 'b-${uniq}' } }
          continuation: { kind: adk, delivery: pull }
      expect: { status: 200 }
      save: { b_id: data.approval.id, b_digest: data.action_digest }
    - name: a malformed later element refuses the whole body, and the valid element before it is not applied
      as: approver
      request:
        method: POST
        path: /v1/approvals/resolve/batch
        body:
          items:
            - {
                approval_id: '${a_id}',
                resolution: approved,
                expected_action_digest: '${a_digest}',
              }
            - { approval_id: '${b_id}', expected_action_digest: '${b_digest}' }
      expect: { status: 400, problem: invalid_request }
    - name: the valid element is still pending
      as: approver
      request: { method: GET, path: '/v1/approvals/${a_id}' }
      expect:
        status: 200
        body:
          - { path: data.state, equals: pending }
    - name: an empty batch is refused
      as: approver
      request:
        method: POST
        path: /v1/approvals/resolve/batch
        body: { items: [] }
      expect: { status: 400, problem: invalid_request }
    - name: the same approval twice - the first applies, the repeat is the conflict the single route gives
      as: approver
      request:
        method: POST
        path: /v1/approvals/resolve/batch
        body:
          items:
            - {
                approval_id: '${a_id}',
                resolution: approved,
                expected_action_digest: '${a_digest}',
              }
            - {
                approval_id: '${a_id}',
                resolution: approved,
                expected_action_digest: '${a_digest}',
              }
      expect:
        status: 200
        body:
          - { path: data, length: 2 }
          - { path: data.0.id, equals: '${a_id}' }
          - { path: data.0.state, equals: approved }
          - { path: data.1.status, equals: 409 }
          - { path: data.1.type, matches: 'already_resolved$' }
