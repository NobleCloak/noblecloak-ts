- id: problem-request-id-on-every-problem
  title: Every problem this API produces carries a non-empty request_id, whatever its status - 400, 401, 404 and 422 here
  tags: [both, negative, floor]
  steps:
    - name: no token
      as: none
      request: { method: GET, path: /v1/capabilities }
      expect:
        status: 401
        problem: unauthorized
        body:
          - { path: request_id, matches: '.+' }
    - name: a body that does not match the schema
      as: creator
      request: { method: POST, path: /v1/records, body: { decision: allow } }
      expect:
        status: 400
        problem: invalid_request
        body:
          - { path: request_id, matches: '.+' }
    - name: a record that does not exist
      as: creator
      request: { method: GET, path: '/v1/records/rec_${uniq}' }
      expect:
        status: 404
        problem: not_found
        body:
          - { path: request_id, matches: '.+' }
    - name: an Idempotency-Key reused with a different request
      as: creator
      request:
        method: POST
        path: /v1/records
        headers: { Idempotency-Key: 'rid-${uniq}' }
        body: { tool_ref: 'rid:${uniq}', decision: allow }
      expect: { status: 201 }
    - as: creator
      request:
        method: POST
        path: /v1/records
        headers: { Idempotency-Key: 'rid-${uniq}' }
        body: { tool_ref: 'rid:${uniq}', decision: deny }
      expect:
        status: 422
        problem: idempotency_key_reuse
        body:
          - { path: request_id, matches: '.+' }
- id: server-error-503-is-service-unavailable
  title: A 503 is the problem type service_unavailable, carries a request_id and Retry-After, and the next request is served
  tags: [both, negative, floor]
  steps:
    - name: the deployment cannot answer the next request to GET /v1/tools
      control: { fail: { operation: listTools, status: 503, retry_after: 7 } }
    - name: it answers 503, typed, with a request id and the wait
      as: creator
      request: { method: GET, path: /v1/tools }
      expect:
        status: 503
        problem: service_unavailable
        headers:
          - { name: retry-after, matches: '^7$' }
        body:
          - { path: status, equals: 503 }
          - { path: request_id, matches: '.+' }
    - name: the failure was once
      as: creator
      request: { method: GET, path: /v1/tools }
      expect: { status: 200 }
- id: server-error-500-is-internal-error
  title: A 500 is the problem type internal_error and carries a request_id
  tags: [both, negative, floor]
  steps:
    - name: the deployment fails the next request to GET /v1/tools
      control: { fail: { operation: listTools, status: 500 } }
    - as: creator
      request: { method: GET, path: /v1/tools }
      expect:
        status: 500
        problem: internal_error
        body:
          - { path: status, equals: 500 }
          - { path: request_id, matches: '.+' }
    - name: the failure was once
      as: creator
      request: { method: GET, path: /v1/tools }
      expect: { status: 200 }
- id: negative-tools-reserved-reference
