- id: negative-tools-side-effect-level-never-falls
  title: A tool's side-effect level never falls - 409 side_effect_level_downgrade on a lower level, by registering again and by patching
  tags: [both, negative, floor]
  steps:
    - name: register at delete
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:lvl:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: delete
          owner_kind: org
      expect: { status: 201 }
      save: { tool_id: data.id }
    - name: registering the reference again at write is refused
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:lvl:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
      expect: { status: 409, problem: side_effect_level_downgrade }
    - name: registering it again at the same level is not an upsert, it is 400 invalid_request
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:lvl:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: delete
          owner_kind: org
      expect: { status: 400, problem: invalid_request }
    - name: and so is registering it again at a higher level - a level rises through PATCH
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:lvl:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: admin
          owner_kind: org
      expect: { status: 400, problem: invalid_request }
    - name: so is patching it to read
      as: admin
      request:
        method: PATCH
        path: /v1/tools/${tool_id}
        body: { side_effect_level: read }
      expect: { status: 409, problem: side_effect_level_downgrade }
    - name: the level did not move
      as: creator
      request: { method: GET, path: '/v1/tools/${tool_id}' }
      expect:
        status: 200
        body:
          - { path: data.side_effect_level, equals: delete }
    - name: it may stay
      as: admin
      request:
        method: PATCH
        path: /v1/tools/${tool_id}
        body: { side_effect_level: delete, description: same level }
      expect:
        status: 200
        body:
          - { path: data.side_effect_level, equals: delete }
    - name: and it may rise
      as: admin
      request:
        method: PATCH
        path: /v1/tools/${tool_id}
        body: { side_effect_level: admin }
      expect:
        status: 200
        body:
          - { path: data.side_effect_level, equals: admin }
    - name: and then cannot fall from there either
      as: admin
      request:
        method: PATCH
        path: /v1/tools/${tool_id}
        body: { side_effect_level: external }
      expect: { status: 409, problem: side_effect_level_downgrade }
- id: negative-tools-write-and-external-share-a-rank
  title: write and external are one rank - a move between them, either way, is allowed, delete to external is a fall (409 side_effect_level_downgrade) and external to delete is a rise
  tags: [both, negative, floor]
  steps:
    - name: register at write
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:tie:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
      expect: { status: 201 }
      save: { tool_id: data.id }
    - name: registering it again at external is not an upsert, it is 400 invalid_request and not a downgrade
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:tie:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: external
          owner_kind: org
      expect: { status: 400, problem: invalid_request }
    - name: write to external is allowed
      as: admin
      request:
        method: PATCH
        path: /v1/tools/${tool_id}
        body: { side_effect_level: external }
      expect:
        status: 200
        body:
          - { path: data.side_effect_level, equals: external }
    - name: external to write is allowed
      as: admin
      request:
        method: PATCH
        path: /v1/tools/${tool_id}
        body: { side_effect_level: write }
      expect:
        status: 200
        body:
          - { path: data.side_effect_level, equals: write }
    - name: back to external, the starting point of the rise
      as: admin
      request:
        method: PATCH
        path: /v1/tools/${tool_id}
        body: { side_effect_level: external }
      expect: { status: 200 }
    - name: external to delete is a rise
      as: admin
      request:
        method: PATCH
        path: /v1/tools/${tool_id}
        body: { side_effect_level: delete }
      expect:
        status: 200
        body:
          - { path: data.side_effect_level, equals: delete }
    - name: delete to external is a fall
      as: admin
      request:
        method: PATCH
        path: /v1/tools/${tool_id}
        body: { side_effect_level: external }
      expect: { status: 409, problem: side_effect_level_downgrade }
    - name: delete to write is a fall too
      as: admin
      request:
        method: PATCH
        path: /v1/tools/${tool_id}
        body: { side_effect_level: write }
      expect: { status: 409, problem: side_effect_level_downgrade }
    - name: the level did not move
      as: creator
      request: { method: GET, path: '/v1/tools/${tool_id}' }
      expect:
        status: 200
        body:
          - { path: data.side_effect_level, equals: delete }
- id: advertised-decision-batch-limit-is-enforced
  title: Whatever decisions limit a deployment advertises on GET /v1/capabilities is the one it enforces - the limit is served, limit plus one is 400 batch_too_large with max_items equal to it
  tags: [both, negative, floor]
  limits: [decisions_batch_max_items]
  steps:
    - name: exactly the advertised limit is served
      as: creator
      request:
        method: POST
        path: /v1/decisions/batch
        body:
          requests:
            $repeat: '${decisions_batch_max_items}'
            item: { action: { tool_ref: '${allow_tool}', arguments: {} } }
      expect:
        status: 200
        body:
          - { path: data.decisions, length: '${decisions_batch_max_items}' }
    - name: one more is over it, and max_items names the advertised limit
      as: creator
      request:
        method: POST
        path: /v1/decisions/batch
        body:
          requests:
            $repeat: '${decisions_batch_max_items+1}'
            item: { action: { tool_ref: '${allow_tool}', arguments: {} } }
      expect:
        status: 400
        problem: batch_too_large
        body:
          - { path: max_items, equals: '${decisions_batch_max_items}' }
          - { path: request_id, matches: '.+' }
- id: advertised-records-batch-limit-is-enforced
