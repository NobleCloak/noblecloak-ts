- id: negative-service-principal-writes-to-another-service-principals-approval-are-404
  title: A service principal gets 404 not_found - not 403, not 201 - on the writes that name another service principal's approval and are its creator's (withdraw, consume, a record with approval_id), and nothing of the approval changes
  tags: [both, negative]
  requires: approvals
  needs: [other_service]
  steps:
    - name: the service principal opens an approval
      as: creator
      request:
        method: POST
        path: /v1/decisions
        body:
          action: { tool_ref: '${proxied_tool}', arguments: { title: 'sw-one ${uniq}' } }
      expect: { status: 200 }
      save: { sw_id: data.approval.id }
    - name: a second service principal cannot withdraw it
      as: other_service
      request: { method: POST, path: '/v1/approvals/${sw_id}/withdraw' }
      expect: { status: 404, problem: not_found }
    - name: nor consume it
      as: other_service
      request:
        method: POST
        path: /v1/approvals/${sw_id}/consume
        body:
          resume_token: 'not-a-token'
          action: { tool_ref: '${proxied_tool}', arguments: {} }
      expect: { status: 404, problem: not_found }
    - name: nor append a record that names it
      as: other_service
      request:
        method: POST
        path: /v1/records
        body: { tool_ref: 'sw:${uniq}', decision: allow, approval_id: '${sw_id}' }
      expect: { status: 404, problem: not_found }
    - name: nor append one in a batch
      as: other_service
      request:
        method: POST
        path: /v1/records/batch
        body:
          records: [{ tool_ref: 'sw:${uniq}', decision: allow, approval_id: '${sw_id}' }]
      expect: { status: 404, problem: not_found }
    - name: no record names the approval, so its outcome link did not move
      as: creator
      request: { method: GET, path: '/v1/records?approval_id=${sw_id}&limit=200' }
      expect:
        status: 200
        body:
          - { path: data, length: 0 }
    - name: the creating service principal still withdraws it
      as: creator
      request: { method: POST, path: '/v1/approvals/${sw_id}/withdraw' }
      expect:
        status: 200
        body:
          - { path: data.state, equals: withdrawn }
- id: negative-records-batch-with-an-invisible-approval-is-all-or-nothing
  title: A records batch in which one element names an approval the caller may not see (a service principal, another's approval) is 404 and appends nothing
  tags: [both, negative]
  requires: approvals
  needs: [other_service]
  steps:
    - name: the service principal opens an approval
      as: creator
      request:
        method: POST
        path: /v1/decisions
        body:
          action: { tool_ref: '${proxied_tool}', arguments: { title: 'ib-one ${uniq}' } }
      expect: { status: 200 }
      save: { ib_id: data.approval.id }
    - name: a second service principal sends a batch whose second element names it
      as: other_service
      request:
        method: POST
        path: /v1/records/batch
        body:
          records:
            - { tool_ref: 'ib:${uniq}', decision: allow }
            - { tool_ref: 'ib:${uniq}', decision: allow, approval_id: '${ib_id}' }
      expect: { status: 404, problem: not_found }
    - name: its first element was not appended
      as: other_service
      request: { method: GET, path: '/v1/records?tool=ib:${uniq}&limit=200' }
      expect:
        status: 200
        body:
          - { path: data, length: 0 }
    - name: no record names the approval
      as: creator
      request: { method: GET, path: '/v1/records?approval_id=${ib_id}&limit=200' }
      expect:
        status: 200
        body:
          - { path: data, length: 0 }
