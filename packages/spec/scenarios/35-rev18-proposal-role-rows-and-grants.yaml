# Contract revision 18: a policy-set proposal may carry `role` rows (policies for one role of the organisation), may
# leave out `agent` (a set of organisation policies alone), and may carry `tool_grants` for the agent's service
# principal. A `role` row needs the entitlement `policies.role_subjects`, refused `not_entitled` without it.
#
# A deployment says what it accepts in `Capabilities.proposals`; a scenario that needs a row kind or a member declares
# `serves_row_kind` or `serves_proposal_member` and is a capability skip where the deployment does not list it; a
# scenario that sends a proposal without an agent also needs `proposals` advertised, which says rev 18. The
# entitlement is the organisation's. A scenario that opens a role row as `entitled` and approves it as `admin` needs
# `entitled` to be a person of the organisation of `--token` and `--admin-token` that holds `policies.role_subjects`;
# the refusal is opened as `other_org`, a person of an organisation that does not hold it. Each first reads
# `GET /v1/capabilities` with that token and fails there, naming the entitlement, when the token's organisation is not
# the one it needs. Every scenario that applies a proposal retires the policies it
# published and unbinds any agent it bound in `cleanup`. A tool a proposal registers stays registered, under a
# reference no other run uses. What a tool grant does to the tools a service principal sees is the deployment's, so no
# scenario reads it: they read the open, the preview, the approval and the refusals. Rev 18 also simulates as a
# `service` subject (`POST /v1/policies/{id}/simulate`). One scenario binds the principal with a proposal; the other
# publishes `service` policies and so needs `service` in `policy_forms.subject_types`. Both are gated on `proposals`
# advertised, which says rev 18, as the proposal scenarios are.
- id: rev18-role-rows-applied-without-an-agent
  title: A proposal without an agent, of a baseline and a role row, opened by an entitled person, previews as the baseline every caller holds and is applied on approval - both policies are published and the approval is consumed
  tags: [hosted]
  only: hosted
  requires: [approvals, policies]
  features: [policies.retire]
  advertises: [deployment_applied, proposals]
  serves_row_kind: role
  arguments_bytes: 4096
  needs: [admin, entitled]
  steps:
    - name: the organisation of the entitled person holds policies.role_subjects
      as: entitled
      request: { method: GET, path: /v1/capabilities }
      expect:
        status: 200
        body: [{ path: data.entitlements, contains: policies.role_subjects }]
    - name: an entitled person opens a proposal of a baseline and a role row, and names no agent
      as: entitled
      request:
        method: POST
        path: /v1/approvals
        body:
          action:
            tool_ref: 'tool:noblecloak:propose-policy-set'
            arguments:
              tools:
                - tool_ref: 'ext:rr:${uniq}:refund'
                  transport: external
                  input_schema: { type: object }
                  side_effect_level: external
                  owner_kind: org
              policies:
                - role: baseline
                  rationale: Every caller asks before a refund.
                  assessment:
                    {
                      side_effect_level: external,
                      blast_radius: one_record,
                      reversible: false,
                      external_party: true,
                      financial: true,
                    }
                  policy:
                    kind: tool_invocation
                    subjects: [{ type: role, id: everyone }]
                    targets: { tools: ['ext:rr:${uniq}:refund'] }
                    config: { mode: ask }
                - role: role
                  rationale: Members never refund.
                  assessment:
                    {
                      side_effect_level: external,
                      blast_radius: one_record,
                      reversible: false,
                      external_party: true,
                      financial: true,
                    }
                  policy:
                    kind: tool_invocation
                    subjects: [{ type: role, id: member }]
                    targets: { tools: ['ext:rr:${uniq}:refund'] }
                    config: { mode: deny }
          continuation: { kind: mcp_held, delivery: held }
      expect:
        status: 201
        body:
          - { path: data.created, equals: true }
          - { path: data.state, equals: pending }
      save: { approval_id: data.id }
    - name: the administrator reads the preview - one simulation as everyone, nothing loosened, nothing shadowed (ineffective absent or empty)
      as: admin
      request: { method: GET, path: '/v1/approvals/${approval_id}' }
      expect:
        status: 200
        body:
          - { path: data.state, equals: pending }
          - { path: data.preview.simulations, length: 1 }
          - { path: data.preview.simulations.0.tool_ref, equals: 'ext:rr:${uniq}:refund' }
          - { path: data.preview.simulations.0.result.decision, equals: step_up }
          - { path: data.preview.loosening, length: 0 }
          - { path: data.preview.ineffective, lacks_key: tool_ref }
      save: { digest: data.action_digest }
    - name: the administrator approves, and the change is applied at once
      as: admin
      request:
        method: POST
        path: '/v1/approvals/${approval_id}/approve'
        body: { expected_action_digest: '${digest}' }
      expect:
        status: 200
        body:
          - { path: data.state, equals: consumed }
          - { path: data.resolution, equals: approved }
    - name: the baseline and the role row are both published
      as: admin
      request:
        method: GET
        path: '/v1/policies?kind=tool_invocation&tool=ext:rr:${uniq}:refund&subject_type=role&state=published&limit=200'
      expect:
        status: 200
        body:
          - { path: data, length: 2 }
          - path: data
            contains_where: { key: subjects.0.id, equals: everyone }
          - path: data
            contains_where: { key: subjects.0.id, equals: member }
      save: { first: data.0.id, second: data.1.id }
    - name: a service principal of the organisation
      as: creator
      request:
        method: POST
        path: /v1/records
        body: { tool_ref: 'rr:${uniq}', decision: allow, enforced: false }
      expect: { status: 201, body: [{ path: data.actor.id, exists: true }] }
      save: { sp: data.actor.id }
    - name: simulated as that principal, the baseline asks and the role row is not composed - a service principal holds no role the directory gives
      as: admin
      request:
        method: POST
        path: '/v1/policies/${first}/simulate'
        body:
          subject: { type: service, id: '${sp}' }
          action: { tool_ref: 'ext:rr:${uniq}:refund', arguments: { q: 'as service ${uniq}' } }
      expect:
        status: 200
        body:
          - { path: data.decision, equals: step_up }
          - { path: data.considered.policies, lacks_where: { key: result, equals: deny } }
  cleanup:
    - name: the policies the approval published are retired
      as: admin
      request: { method: POST, path: '/v1/policies/${first}/retire' }
      expect: { status: 200 }
    - as: admin
      request: { method: POST, path: '/v1/policies/${second}/retire' }
      expect: { status: 200 }
- id: rev18-role-row-not-entitled
  title: A role row opened by a person whose organisation is not entitled to policies with a role subject is refused 422 proposal_refused with code not_entitled, naming the row
  tags: [hosted, negative]
  only: hosted
  requires: [approvals]
  advertises: [deployment_applied, proposals]
  serves_row_kind: role
  arguments_bytes: 4096
  needs: [other_org]
  steps:
    - name: the other organisation does not hold policies.role_subjects
      as: other_org
      request: { method: GET, path: /v1/capabilities }
      expect:
        status: 200
        body: [{ path: data.entitlements, lacks: policies.role_subjects }]
    - name: a person of that organisation proposes a role row
      as: other_org
      request:
        method: POST
        path: /v1/approvals
        body:
          action:
            tool_ref: 'tool:noblecloak:propose-policy-set'
            arguments:
              tools:
                - tool_ref: 'ext:rn:${uniq}:refund'
                  transport: external
                  input_schema: { type: object }
                  side_effect_level: external
                  owner_kind: org
              policies:
                - role: baseline
                  rationale: Every caller asks before a refund.
                  assessment:
                    {
                      side_effect_level: external,
                      blast_radius: one_record,
                      reversible: false,
                      external_party: true,
                      financial: true,
                    }
                  policy:
                    kind: tool_invocation
                    subjects: [{ type: role, id: everyone }]
                    targets: { tools: ['ext:rn:${uniq}:refund'] }
                    config: { mode: ask }
                - role: role
                  rationale: Members never refund.
                  assessment:
                    {
                      side_effect_level: external,
                      blast_radius: one_record,
                      reversible: false,
                      external_party: true,
                      financial: true,
                    }
                  policy:
                    kind: tool_invocation
                    subjects: [{ type: role, id: member }]
                    targets: { tools: ['ext:rn:${uniq}:refund'] }
                    config: { mode: deny }
          continuation: { kind: mcp_held, delivery: held }
      expect:
        status: 422
        problem: proposal_refused
        body:
          - { path: code, equals: not_entitled }
          - { path: member, equals: 'action.arguments.policies[1]' }
