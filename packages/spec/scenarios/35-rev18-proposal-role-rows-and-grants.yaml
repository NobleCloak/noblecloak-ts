- id: rev18-simulate-as-a-service-principal
  title: An administrator simulates as a service principal - unbound, it gets the result of the everyone role; once a proposal binds it to an agent with a tightening, the same simulation gives the agent's tighter mode and considered names the agent's policy as what contributed; unbound again, the agent's policy is gone
  tags: [hosted]
  only: hosted
  requires: [agents, approvals, policies]
  features: [policies.retire, policies.tightest_wins]
  advertises: [deployment_applied, proposals]
  serves_policy_subject_type: [role, agent]
  arguments_bytes: 4096
  needs: [admin, creator_user]
  steps:
    - name: an agent, and the service principal the proposal binds to it
      as: creator
      request: { method: POST, path: /v1/agents, body: { name: 'simulated agent ${uniq}' } }
      expect: { status: 201 }
      save: { agent: data.id }
    - as: creator
      request:
        method: POST
        path: /v1/records
        body: { tool_ref: 'sv:${uniq}', decision: allow, enforced: false }
      expect: { status: 201, body: [{ path: data.actor.id, exists: true }] }
      save: { sp: data.actor.id }
    - name: a tool, and a published policy of everyone that asks
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:sv:${uniq}:lookup'
          transport: external
          input_schema: { type: object }
          side_effect_level: read
          owner_kind: org
      expect: { status: 201 }
    - as: admin
      request:
        method: POST
        path: /v1/policies
        body:
          kind: tool_invocation
          subjects: [{ type: role, id: everyone }]
          targets: { tools: ['ext:sv:${uniq}:lookup'] }
          config: { mode: ask }
      expect: { status: 201 }
      save: { everyone_policy: data.id }
    - as: admin
      request: { method: POST, path: '/v1/policies/${everyone_policy}/publish' }
      expect: { status: 200 }
    - name: the result of the everyone role
      as: admin
      request:
        method: POST
        path: /v1/policies/${everyone_policy}/simulate
        body:
          subject: { type: role, id: everyone }
          action: { tool_ref: 'ext:sv:${uniq}:lookup', arguments: { q: 'as everyone ${uniq}' } }
      expect: { status: 200 }
      save: { everyone_decision: data.decision }
    - name: unbound, the service principal gets the result of the everyone role
      as: admin
      request:
        method: POST
        path: /v1/policies/${everyone_policy}/simulate
        body:
          subject: { type: service, id: '${sp}' }
          action: { tool_ref: 'ext:sv:${uniq}:lookup', arguments: { q: 'as unbound ${uniq}' } }
      expect:
        status: 200
        body:
          - { path: data.decision, equals: '${everyone_decision}' }
          - path: data.considered.policies
            contains_members: { id: '${everyone_policy}', result: ask }
    - name: a person proposes the binding and a tightening that denies
      as: creator_user
      request:
        method: POST
        path: /v1/approvals
        body:
          action:
            tool_ref: 'tool:noblecloak:propose-policy-set'
            arguments:
              agent: { id: '${agent}', principal_id: '${sp}' }
              policies:
                - role: tightening
                  rationale: The agent never looks a record up.
                  assessment:
                    {
                      side_effect_level: read,
                      blast_radius: one_record,
                      reversible: true,
                      external_party: false,
                      financial: false,
                    }
                  policy:
                    kind: tool_invocation
                    subjects: [{ type: agent, id: '${agent}' }]
                    targets: { tools: ['ext:sv:${uniq}:lookup'] }
                    config: { mode: deny }
          continuation: { kind: mcp_held, delivery: held }
      expect: { status: 201 }
      save: { approval_id: data.id }
    - as: admin
      request: { method: GET, path: '/v1/approvals/${approval_id}' }
      expect: { status: 200 }
      save: { digest: data.action_digest }
    - name: the administrator approves, and the binding and the tightening are applied
      as: admin
      request:
        method: POST
        path: '/v1/approvals/${approval_id}/approve'
        body: { expected_action_digest: '${digest}' }
      expect:
        status: 200
        body:
          - { path: data.state, equals: consumed }
          - { path: data.resolution, equals: approved }
    - as: admin
      request:
        method: GET
        path: '/v1/policies?kind=tool_invocation&tool=ext:sv:${uniq}:lookup&subject_type=agent&state=published&limit=200'
      expect: { status: 200, body: [{ path: data, length: 1 }] }
      save: { tightening: data.0.id }
    - name: bound, the same simulation gives the agent's tighter mode, and names the agent's policy as what contributed
      as: admin
      request:
        method: POST
        path: /v1/policies/${everyone_policy}/simulate
        body:
          subject: { type: service, id: '${sp}' }
          action: { tool_ref: 'ext:sv:${uniq}:lookup', arguments: { q: 'as bound ${uniq}' } }
      expect:
        status: 200
        body:
          - { path: data.decision, equals: deny }
          - path: data.considered.policies
            contains_members: { id: '${tightening}', result: deny, contributed: true }
          - path: data.considered.policies
            contains_members: { id: '${everyone_policy}', result: ask }
    - name: the administrator unbinds the agent
      as: admin
      request: { method: DELETE, path: '/v1/agents/${agent}/principal' }
      expect: { status: 204 }
    - name: unbound again, the agent's policy no longer reaches the service principal
      as: admin
      request:
        method: POST
        path: /v1/policies/${everyone_policy}/simulate
        body:
          subject: { type: service, id: '${sp}' }
          action:
            { tool_ref: 'ext:sv:${uniq}:lookup', arguments: { q: 'as unbound again ${uniq}' } }
      expect:
        status: 200
        body:
          - { path: data.decision, equals: '${everyone_decision}' }
          - { path: data.considered.policies, lacks_where: { key: id, equals: '${tightening}' } }
  cleanup:
    - name: whatever the steps did, the agent is unbound
      as: admin
      request: { method: DELETE, path: '/v1/agents/${agent}/principal' }
      expect: { status: 204 }
    - name: and the policies are retired
      as: admin
      request: { method: POST, path: '/v1/policies/${tightening}/retire' }
      expect: { status: 200 }
    - as: admin
      request: { method: POST, path: '/v1/policies/${everyone_policy}/retire' }
      expect: { status: 200 }
- id: rev18-simulate-as-a-service-principal-own-policies
  title: An administrator simulates as a service principal - its own service policy decides, while the policy of another service principal and the policy of a role are not composed
  tags: [hosted]
  only: hosted
  requires: policies
  advertises: [proposals]
  serves_policy_subject_type: [service, role]
  needs: [admin, other_service]
  fixtures: [admin_role]
  steps:
    - name: the service principal simulated, and another of the same organisation
      as: creator
      request:
        method: POST
        path: /v1/records
        body: { tool_ref: 'so:${uniq}', decision: allow, enforced: false }
      expect: { status: 201, body: [{ path: data.actor.id, exists: true }] }
      save: { sp: data.actor.id }
    - as: other_service
      request:
        method: POST
        path: /v1/records
        body: { tool_ref: 'so:other:${uniq}', decision: allow, enforced: false }
      expect: { status: 201, body: [{ path: data.actor.id, exists: true }] }
      save: { other_sp: data.actor.id }
    - name: a tool
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:so:${uniq}:lookup'
          transport: external
          input_schema: { type: object }
          side_effect_level: read
          owner_kind: org
      expect: { status: 201 }
    - name: a policy of the simulated service principal that denies
      as: admin
      request:
        method: POST
        path: /v1/policies
        body:
          kind: tool_invocation
          subjects: [{ type: service, id: '${sp}' }]
          targets: { tools: ['ext:so:${uniq}:lookup'] }
          config: { mode: deny }
      expect: { status: 201 }
      save: { own_policy: data.id }
    - as: admin
      request: { method: POST, path: '/v1/policies/${own_policy}/publish' }
      expect: { status: 200 }
    - name: a policy of the other service principal, which the simulated one does not hold
      as: admin
      request:
        method: POST
        path: /v1/policies
        body:
          kind: tool_invocation
          subjects: [{ type: service, id: '${other_sp}' }]
          targets: { tools: ['ext:so:${uniq}:lookup'] }
          config: { mode: always_allow }
      expect: { status: 201 }
      save: { other_policy: data.id }
    - as: admin
      request: { method: POST, path: '/v1/policies/${other_policy}/publish' }
      expect: { status: 200 }
    - name: a role policy, which a simulation as a service principal does not hold
      as: admin
      request:
        method: POST
        path: /v1/policies
        body:
          kind: tool_invocation
          subjects: [{ type: role, id: '${admin_role}' }]
          targets: { tools: ['ext:so:${uniq}:lookup'] }
          config: { mode: always_allow }
      expect: { status: 201 }
      save: { role_policy: data.id }
    - as: admin
      request: { method: POST, path: '/v1/policies/${role_policy}/publish' }
      expect: { status: 200 }
    - name: as the service principal, its own policy decides, and neither the other principal's nor the role's is considered
      as: admin
      request:
        method: POST
        path: /v1/policies/${own_policy}/simulate
        body:
          subject: { type: service, id: '${sp}' }
          action: { tool_ref: 'ext:so:${uniq}:lookup', arguments: { q: 'as own ${uniq}' } }
      expect:
        status: 200
        body:
          - { path: data.decision, equals: deny }
          - path: data.considered.policies
            contains_members: { id: '${own_policy}', result: deny }
          - { path: data.considered.policies, lacks_where: { key: id, equals: '${other_policy}' } }
          - { path: data.considered.policies, lacks_where: { key: id, equals: '${role_policy}' } }
  cleanup:
    - name: the policies are retired
      as: admin
      request: { method: POST, path: '/v1/policies/${own_policy}/retire' }
      expect: { status: 200 }
    - as: admin
      request: { method: POST, path: '/v1/policies/${other_policy}/retire' }
      expect: { status: 200 }
    - as: admin
      request: { method: POST, path: '/v1/policies/${role_policy}/retire' }
      expect: { status: 200 }
