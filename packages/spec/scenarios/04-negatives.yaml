- id: negative-consume-wrong-action
  title: /consume with a different tool_ref or arg_digest is 409 approval_conflict, and the obligation stays consumable
  tags: [both, negative]
  needs: [approver]
  requires: approvals
  steps:
    - as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          {
            tool_ref: 'ext:wrong:${uniq}',
            transport: external,
            input_schema: { type: object },
            side_effect_level: write,
            owner_kind: org,
          }
      expect: { status: 201 }
    - as: creator
      request:
        method: POST
        path: /v1/decisions
        body:
          action: { tool_ref: 'ext:wrong:${uniq}', arguments: { n: 1 } }
          continuation: { kind: langgraph, delivery: pull }
      expect: { status: 200 }
      save: { approval_id: data.approval.id, digest: data.action_digest }
    - as: approver
      request:
        method: POST
        path: /v1/approvals/${approval_id}/resolve
        body: { resolution: approved, expected_action_digest: '${digest}' }
      expect: { status: 200 }
    - as: creator
      request: { method: GET, path: '/v1/approvals/${approval_id}/resumption' }
      expect: { status: 200 }
      save: { token: data.resume_token }
    - name: a different tool_ref with the same arguments
      as: creator
      request:
        method: POST
        path: /v1/approvals/${approval_id}/consume
        body:
          {
            resume_token: '${token}',
            action: { tool_ref: 'ext:other:${uniq}', arguments: { n: 1 } },
          }
      expect: { status: 409, problem: approval_conflict }
    - name: the same tool_ref with different arguments
      as: creator
      request:
        method: POST
        path: /v1/approvals/${approval_id}/consume
        body:
          {
            resume_token: '${token}',
            action: { tool_ref: 'ext:wrong:${uniq}', arguments: { n: 2 } },
          }
      expect: { status: 409, problem: approval_conflict }
    - name: the same tool_ref with a different arg_digest
      as: creator
      request:
        method: POST
        path: /v1/approvals/${approval_id}/consume
        body:
          {
            resume_token: '${token}',
            action:
              {
                tool_ref: 'ext:wrong:${uniq}',
                arg_digest: '1111111111111111111111111111111111111111111111111111111111111111',
              },
          }
      expect: { status: 409, problem: approval_conflict }
    - name: the matching action still consumes
      as: creator
      request:
        method: POST
        path: /v1/approvals/${approval_id}/consume
        body:
          {
            resume_token: '${token}',
            action: { tool_ref: 'ext:wrong:${uniq}', arguments: { n: 1 } },
          }
      expect: { status: 200 }
