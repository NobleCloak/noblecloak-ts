- id: negative-replayed-resume-token
  title: A replayed resume_token is 409 obligation_consumed
  tags: [both, negative]
  needs: [approver]
  requires: approvals
  steps:
    - as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          {
            tool_ref: 'ext:neg:${uniq}',
            transport: external,
            input_schema: { type: object },
            side_effect_level: write,
            owner_kind: org,
          }
      expect: { status: 201 }
    - as: creator
      request:
        method: POST
        path: /v1/decisions
        body:
          action: { tool_ref: 'ext:neg:${uniq}', arguments: { n: 1 } }
          continuation: { kind: langgraph, delivery: pull }
      expect: { status: 200, body: [{ path: data.decision, equals: step_up }] }
      save: { approval_id: data.approval.id, digest: data.action_digest }
    - as: approver
      request:
        method: POST
        path: /v1/approvals/${approval_id}/resolve
        body: { resolution: approved, expected_action_digest: '${digest}' }
      expect: { status: 200 }
    - as: creator
      request: { method: GET, path: '/v1/approvals/${approval_id}/resumption' }
      expect: { status: 200 }
      save: { token: data.resume_token }
    - as: creator
      request:
        method: POST
        path: /v1/approvals/${approval_id}/consume
        body:
          { resume_token: '${token}', action: { tool_ref: 'ext:neg:${uniq}', arguments: { n: 1 } } }
      expect: { status: 200 }
    - as: creator
      request:
        method: POST
        path: /v1/approvals/${approval_id}/consume
        body:
          { resume_token: '${token}', action: { tool_ref: 'ext:neg:${uniq}', arguments: { n: 1 } } }
      expect: { status: 409, problem: obligation_consumed }
- id: negative-ineligible-resolve
  title: A user principal that created an obligation cannot resolve it (403 not_eligible), on any door
  tags: [both, negative]
  requires: approvals
  needs: [creator_user, approver]
  steps:
    - name: a user principal opens the obligation, so only its identity, not its kind, can refuse it
      as: creator_user
      request:
        method: POST
        path: /v1/decisions
        body:
          action: { tool_ref: '${proxied_tool}', arguments: { title: 'inelig ${uniq}' } }
          continuation: { kind: langgraph, delivery: pull }
      expect: { status: 200 }
      save: { approval_id: data.approval.id, digest: data.action_digest }
    - name: the creating principal resolves its own obligation
      as: creator_user
      request:
        method: POST
        path: /v1/approvals/${approval_id}/resolve
        body: { resolution: approved, expected_action_digest: '${digest}' }
      expect: { status: 403, problem: not_eligible }
    - name: the same principal through the approve route
      as: creator_user
      request:
        method: POST
        path: /v1/approvals/${approval_id}/approve
        body: { expected_action_digest: '${digest}' }
      expect: { status: 403, problem: not_eligible }
    - name: it is still pending
      as: approver
      request: { method: GET, path: '/v1/approvals/${approval_id}' }
      expect: { status: 200, body: [{ path: data.state, equals: pending }] }
