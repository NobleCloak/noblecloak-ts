# Rev 11: policies. The pending draft's version, retiring and discarding, simulating as a subject, the
# tightest-wins rule and where an imported policy came from. Authoring needs an administrator, so every
# scenario here needs it, and each registers its own organisation-owned tool so that its policies meet no
# other policy's (tool, subject) pair. A scenario that needs a role the administrator holds names it with the
# `admin_role` fixture (`nc-conform --admin-role`); without it the scenario is skipped as unconfigured. Each
# names the subject types its drafts use in `serves_policy_subject_type`, so a deployment whose `policy_forms`
# does not list one skips it by capability rather than refusing a draft it may refuse.
- id: policy-draft-version-names-the-pending-draft
  title: A published policy with a pending draft names the draft's version in draft_version, on the read and on its list row, and not once the draft is published
  tags: [hosted]
  only: hosted
  requires: policies
  serves_policy_subject_type: role
  needs: [admin]
  steps:
    - name: register the tool the policy governs
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:dv:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
      expect: { status: 201 }
    - as: admin
      request:
        method: POST
        path: /v1/policies
        body:
          kind: tool_invocation
          subjects: [{ type: role, id: member }]
          targets: { tools: ['ext:dv:${uniq}'] }
          config: { mode: ask }
      expect: { status: 201, body: [{ path: data.draft_version, exists: false }] }
      save: { policy_id: data.id }
    - as: admin
      request: { method: POST, path: '/v1/policies/${policy_id}/publish' }
      expect: { status: 200, body: [{ path: data.draft_version, exists: false }] }
    - name: a write after the publish is the pending draft
      as: admin
      request:
        method: PUT
        path: /v1/policies/${policy_id}
        body:
          kind: tool_invocation
          subjects: [{ type: role, id: member }]
          targets: { tools: ['ext:dv:${uniq}'] }
          config: { mode: always_allow }
      expect: { status: 200 }
      save: { draft: data.version }
    - name: the read names it
      as: admin
      request: { method: GET, path: '/v1/policies/${policy_id}' }
      expect:
        status: 200
        body:
          - { path: data.state, equals: published }
          - { path: data.draft_version, equals: '${draft}' }
    - name: so does its row of the list
      as: admin
      request: { method: GET, path: '/v1/policies?tool=ext:dv:${uniq}&limit=200' }
      expect:
        status: 200
        body:
          - path: data
            contains_members: { id: '${policy_id}', draft_version: '${draft}' }
    - as: admin
      request: { method: POST, path: '/v1/policies/${policy_id}/publish' }
      expect: { status: 200 }
    - name: published, there is no pending draft
      as: admin
      request: { method: GET, path: '/v1/policies/${policy_id}' }
      expect: { status: 200, body: [{ path: data.draft_version, exists: false }] }
- id: policy-retire-and-discard
  title: Where a hosted deployment advertises policies.retire, an administrator retires a published policy and discards drafts, and a policy never published is not retired
  tags: [hosted]
  only: hosted
  requires: policies
  features: [policies.retire]
  serves_policy_subject_type: role
  needs: [admin]
  fixtures: [admin_role]
  steps:
    - name: register the tool the policies govern
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:rt:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
      expect: { status: 201 }
    - as: admin
      request:
        method: POST
        path: /v1/policies
        body:
          kind: tool_invocation
          subjects: [{ type: role, id: '${admin_role}' }]
          targets: { tools: ['ext:rt:${uniq}'] }
          config: { mode: ask }
      expect: { status: 201 }
      save: { retired_id: data.id }
    - as: admin
      request: { method: POST, path: '/v1/policies/${retired_id}/publish' }
      expect: { status: 200 }
      save: { retired_version: data.version }
    - name: an administrator retires it
      as: admin
      request: { method: POST, path: '/v1/policies/${retired_id}/retire' }
      expect: { status: 200, body: [{ path: data.retired_at, exists: true }] }
    - name: a retired policy is not read
      as: admin
      request: { method: GET, path: '/v1/policies/${retired_id}' }
      expect: { status: 404, problem: not_found }
    - name: nor listed
      as: admin
      request: { method: GET, path: '/v1/policies?tool=ext:rt:${uniq}&limit=200' }
      expect:
        status: 200
        body:
          - { path: data, lacks_where: { key: id, equals: '${retired_id}' } }
    - name: its versions stay, each saying when it was retired
      as: admin
      request: { method: GET, path: '/v1/policies/${retired_id}/versions' }
      expect:
        status: 200
        body:
          - { path: data.0.version, equals: '${retired_version}' }
          - { path: data.0.retired_at, exists: true }
    - name: register a tool of its own for the policies below, so none meets the retired one's pair
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:rk:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
      expect: { status: 201 }
    - name: a draft never published
      as: admin
      request:
        method: POST
        path: /v1/policies
        body:
          kind: tool_invocation
          subjects: [{ type: role, id: '${admin_role}' }]
          targets: { tools: ['ext:rk:${uniq}'] }
          config: { mode: ask }
      expect: { status: 201 }
      save: { draft_id: data.id }
    - name: is not retired
      as: admin
      request: { method: POST, path: '/v1/policies/${draft_id}/retire' }
      expect: { status: 400, problem: invalid_request }
    - name: discarding it deletes it
      as: admin
      request: { method: DELETE, path: '/v1/policies/${draft_id}/draft' }
      expect: { status: 204 }
    - as: admin
      request: { method: GET, path: '/v1/policies/${draft_id}' }
      expect: { status: 404, problem: not_found }
    - name: a published policy
      as: admin
      request:
        method: POST
        path: /v1/policies
        body:
          kind: tool_invocation
          subjects: [{ type: role, id: '${admin_role}' }]
          targets: { tools: ['ext:rk:${uniq}'] }
          config: { mode: ask }
      expect: { status: 201 }
      save: { kept_id: data.id }
    - as: admin
      request: { method: POST, path: '/v1/policies/${kept_id}/publish' }
      expect: { status: 200 }
    - name: with no pending draft has none to discard
      as: admin
      request: { method: DELETE, path: '/v1/policies/${kept_id}/draft' }
      expect: { status: 404, problem: not_found }
    - as: admin
      request:
        method: PUT
        path: /v1/policies/${kept_id}
        body:
          kind: tool_invocation
          subjects: [{ type: role, id: '${admin_role}' }]
          targets: { tools: ['ext:rk:${uniq}'] }
          config: { mode: always_allow }
      expect: { status: 200 }
    - name: its pending draft is discarded, and the published version stays
      as: admin
      request: { method: DELETE, path: '/v1/policies/${kept_id}/draft' }
      expect: { status: 204 }
    - as: admin
      request: { method: GET, path: '/v1/policies/${kept_id}' }
      expect:
        status: 200
        body:
          - { path: data.config.mode, equals: ask }
          - { path: data.draft_version, exists: false }
- id: negative-policy-retire-needs-an-administrator
  title: A member of the organisation who is not an administrator is 403 forbidden when it retires a policy or discards a draft
  tags: [hosted, negative]
  only: hosted
  requires: policies
  serves_policy_subject_type: role
  features: [policies.retire]
  needs: [admin, member]
  steps:
    - as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:rn:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
      expect: { status: 201 }
    - as: admin
      request:
        method: POST
        path: /v1/policies
        body:
          kind: tool_invocation
          subjects: [{ type: role, id: member }]
          targets: { tools: ['ext:rn:${uniq}'] }
          config: { mode: ask }
      expect: { status: 201 }
      save: { policy_id: data.id }
    - name: a member cannot discard the draft
      as: member
      request: { method: DELETE, path: '/v1/policies/${policy_id}/draft' }
      expect: { status: 403, problem: forbidden }
    - as: admin
      request: { method: POST, path: '/v1/policies/${policy_id}/publish' }
      expect: { status: 200 }
    - name: nor retire the policy
      as: member
      request: { method: POST, path: '/v1/policies/${policy_id}/retire' }
      expect: { status: 403, problem: forbidden }
    - name: it is still in force
      as: admin
      request: { method: GET, path: '/v1/policies/${policy_id}' }
      expect: { status: 200, body: [{ path: data.state, equals: published }] }
