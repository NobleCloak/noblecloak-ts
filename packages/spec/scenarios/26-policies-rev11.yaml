        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:rti:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
      expect: { status: 201 }
    - as: admin
      request:
        method: POST
        path: /v1/policies
        body:
          kind: tool_invocation
          subjects: [{ type: role, id: member }]
          targets: { tools: ['ext:rti:${uniq}'] }
          config: { mode: ask }
      expect: { status: 201 }
      save: { policy_id: data.id }
    - as: other_org
      request: { method: DELETE, path: '/v1/policies/${policy_id}/draft' }
