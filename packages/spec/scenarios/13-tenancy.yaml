- id: tenancy-approvals-isolated
  title: Another organisation cannot read, resolve, withdraw, consume or list an organisation's approval
  tags: [both, negative, tenancy]
  requires: approvals
  needs: [other_org, approver]
  steps:
    - as: creator
      request:
        method: POST
        path: /v1/decisions
        body:
          action: { tool_ref: '${proxied_tool}', arguments: { title: 'tenancy ${uniq}' } }
          continuation: { kind: langgraph, delivery: pull }
      expect: { status: 200 }
      save: { approval_id: data.approval.id, digest: data.action_digest }
    - name: read
      as: other_org
      request: { method: GET, path: '/v1/approvals/${approval_id}' }
      expect: { status: 404, problem: not_found }
    - name: resolve with the right digest
      as: other_org
      request:
        method: POST
        path: /v1/approvals/${approval_id}/resolve
        body: { resolution: approved, expected_action_digest: '${digest}' }
      expect: { status: 404, problem: not_found }
    - name: withdraw
      as: other_org
      request: { method: POST, path: '/v1/approvals/${approval_id}/withdraw' }
      expect: { status: 404, problem: not_found }
    - name: consume
      as: other_org
      request:
        method: POST
        path: /v1/approvals/${approval_id}/consume
        body:
          resume_token: not-a-token
          action: { tool_ref: '${proxied_tool}', arguments: { title: 'tenancy ${uniq}' } }
      expect: { status: 404, problem: not_found }
    - name: read the Resumption
      as: other_org
      request: { method: GET, path: '/v1/approvals/${approval_id}/resumption' }
      expect: { status: 404, problem: not_found }
    - name: approve through the alias
      as: other_org
      request:
        method: POST
        path: /v1/approvals/${approval_id}/approve
        body: { expected_action_digest: '${digest}' }
      expect: { status: 404, problem: not_found }
    - name: deny through the alias
      as: other_org
      request:
        method: POST
        path: /v1/approvals/${approval_id}/deny
        body: { expected_action_digest: '${digest}' }
      expect: { status: 404, problem: not_found }
    - name: wait
      as: other_org
      request: { method: GET, path: '/v1/approvals/${approval_id}/wait?timeout=0' }
      expect: { status: 404, problem: not_found }
    - name: append a record that links the approval
      as: other_org
      request:
        method: POST
        path: /v1/records
        body:
          tool_ref: 'tn:link:${uniq}'
          decision: allow
          approval_id: '${approval_id}'
          outcome: { status: succeeded }
      expect: { status: 404, problem: not_found }
    - name: list
      as: other_org
      request: { method: GET, path: '/v1/approvals?limit=200' }
      expect:
        status: 200
        body:
          - { path: data, lacks_where: { key: id, equals: '${approval_id}' } }
    - name: the obligation is untouched
      as: approver
      request: { method: GET, path: '/v1/approvals/${approval_id}' }
      expect: { status: 200, body: [{ path: data.state, equals: pending }] }
- id: tenancy-records-isolated
  title: Another organisation cannot read or list an organisation's records
  tags: [both, negative, tenancy, floor]
  needs: [other_org]
  steps:
    - as: creator
      request:
        method: POST
        path: /v1/records
        body: { tool_ref: 'tn:${uniq}', decision: allow, outcome: { status: succeeded } }
      expect: { status: 201 }
      save: { record_id: data.id }
    - as: other_org
      request: { method: GET, path: '/v1/records/${record_id}' }
      expect: { status: 404, problem: not_found }
    - as: other_org
      request: { method: GET, path: '/v1/records?tool=tn:${uniq}&limit=200' }
      expect: { status: 200, body: [{ path: data, length: 0 }] }
    - name: the owner still reads it
      as: creator
      request: { method: GET, path: '/v1/records/${record_id}' }
      expect: { status: 200 }
