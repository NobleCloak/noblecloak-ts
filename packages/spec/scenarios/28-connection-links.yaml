      expect: { status: 204 }
- id: edge-rev11-hosted-only-surfaces
  title: An edge deployment answers the rev 11 hosted-only routes 404 not_available_on_deployment, carries no my_link on an OAuth registration, and no blocked_on on an approval
  tags: [edge, negative]
  only: edge
  requires: [connections, approvals]
  serves_connection_owner_kind: org
  serves_connection_transport: mcp
  needs: [admin]
  steps:
    - as: admin
      request:
        method: POST
        path: /v1/connections
        body:
          name: 'edge ${uniq}'
          url: 'https://edge-${uniq}.example.com/mcp'
          transport: mcp
          owner_kind: org
          auth: { kind: oauth }
      expect: { status: 201, body: [{ path: data.my_link, exists: false }] }
      save: { connection_id: data.id }
    - as: admin
      request: { method: GET, path: '/v1/connections/${connection_id}' }
      expect: { status: 200, body: [{ path: data.my_link, exists: false }] }
    - as: admin
      request:
        method: POST
        path: /v1/connections/${connection_id}/authorize
        body: { return_to: 'https://module.example.com/return' }
      expect: { status: 404, problem: not_available_on_deployment }
    - as: admin
      request:
        method: POST
        path: /v1/connections/${connection_id}/link
        body: { consent: true }
      expect: { status: 404, problem: not_available_on_deployment }
    - as: admin
      request: { method: DELETE, path: '/v1/connections/${connection_id}/link/consent' }
      expect: { status: 404, problem: not_available_on_deployment }
    - as: admin
      request: { method: POST, path: /v1/policies/pol_x/retire }
      expect: { status: 404, problem: not_available_on_deployment }
    - as: admin
      request: { method: DELETE, path: /v1/policies/pol_x/draft }
      expect: { status: 404, problem: not_available_on_deployment }
    - name: an approval on the edge says nothing of a link
      as: creator
      request:
        method: POST
        path: /v1/decisions
        body:
          action: { tool_ref: '${proxied_tool}', arguments: { q: 'edge ${uniq}' } }
          continuation: { kind: langgraph, delivery: pull }
      expect: { status: 200, body: [{ path: data.decision, equals: step_up }] }
      save: { approval_id: data.approval.id }
    - as: creator
      request: { method: GET, path: '/v1/approvals/${approval_id}' }
      expect: { status: 200, body: [{ path: data.blocked_on, exists: false }] }
    - as: admin
      request: { method: DELETE, path: '/v1/connections/${connection_id}' }
      expect: { status: 204 }
