- id: approval-arguments-state-withheld-before-not-enabled
  title: A reader who is neither the creator nor eligible to approve is told `withheld` for a pending approval on a tool whose setting is off, where the creator and an eligible approver are told `not_enabled`
  tags: [both, negative, lifecycle]
  requires: approvals
  needs: [creator_user, approver, member]
  steps:
    - name: register a tool the organisation shares, with the setting off
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:wbn:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
      expect: { status: 201 }
    - name: a user opens an approval
      as: creator_user
      request:
        method: POST
        path: /v1/decisions
        body:
          action: { tool_ref: 'ext:wbn:${uniq}', arguments: { q: 'wbn-${uniq}' } }
          continuation: { kind: adk, delivery: pull }
      expect: { status: 200, body: [{ path: data.decision, equals: step_up }] }
      save: { a_id: data.approval.id }
    - name: the member who may not approve is told withheld, not the tool's setting
      as: member
      request: { method: GET, path: '/v1/approvals/${a_id}' }
      expect:
        status: 200
        body:
          - { path: data.arguments, exists: false }
          - { path: data.arguments_state, equals: withheld }
    - name: the creator is told the setting is off
      as: creator_user
      request: { method: GET, path: '/v1/approvals/${a_id}' }
      expect:
        status: 200
        body:
          - { path: data.arguments_state, equals: not_enabled }
    - name: an eligible approver is told the setting is off
      as: approver
      request: { method: GET, path: '/v1/approvals/${a_id}' }
      expect:
        status: 200
        body:
          - { path: data.arguments_state, equals: not_enabled }
- id: approval-list-rows-carry-arguments-state
  title: Each row of the approval list carries `arguments_state` for an eligible approver (`shown`, `not_enabled`, `not_sent`) and never `arguments`
  tags: [both, lifecycle]
  requires: approvals
  needs: [creator_user, approver]
  steps:
    - name: register a tool that shows its arguments
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:las-on:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
          show_arguments_to_approvers: true
      expect: { status: 201 }
    - name: register a tool that does not
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:las-off:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
      expect: { status: 201 }
    - name: a user opens an approval with arguments on the tool that shows them
      as: creator_user
      request:
        method: POST
        path: /v1/decisions
        body:
          action:
            tool_ref: 'ext:las-on:${uniq}'
            arguments: { q: 'las-${uniq}' }
          continuation: { kind: adk, delivery: pull }
      expect: { status: 200, body: [{ path: data.decision, equals: step_up }] }
    - name: the approver lists it - the state is shown, the arguments are not on the row
      as: approver
      request: { method: GET, path: '/v1/approvals?approver=me&state=pending&limit=1' }
      expect:
        status: 200
        body:
          - { path: data.0.arguments, exists: false }
          - { path: data.0.arguments_state, equals: shown }
    - name: a user opens an approval on the tool that does not
      as: creator_user
      request:
        method: POST
        path: /v1/decisions
        body:
          action:
            tool_ref: 'ext:las-off:${uniq}'
            arguments: { q: 'las-${uniq}' }
          continuation: { kind: adk, delivery: pull }
      expect: { status: 200, body: [{ path: data.decision, equals: step_up }] }
    - name: the approver lists it - not_enabled
      as: approver
      request: { method: GET, path: '/v1/approvals?approver=me&state=pending&limit=1' }
      expect:
        status: 200
        body:
          - { path: data.0.arguments, exists: false }
          - { path: data.0.arguments_state, equals: not_enabled }
    - name: a user opens an approval naming the digest only on the tool that shows them
      as: creator_user
      request:
        method: POST
        path: /v1/decisions
        body:
          action:
            tool_ref: 'ext:las-on:${uniq}'
            arg_digest: '${uniq}${uniq}${uniq}${uniq}${uniq}0000'
          continuation: { kind: adk, delivery: pull }
      expect: { status: 200, body: [{ path: data.decision, equals: step_up }] }
    - name: the approver lists it - not_sent
      as: approver
      request: { method: GET, path: '/v1/approvals?approver=me&state=pending&limit=1' }
      expect:
        status: 200
        body:
          - { path: data.0.arguments, exists: false }
          - { path: data.0.arguments_state, equals: not_sent }
