    - name: and one that is the organisation's
      as: member
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:so:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: read
          owner_kind: org
      expect: { status: 201 }
      save: { sp_org_id: data.id }
    - name: the service principal registers a tool of its own
      as: creator
      request:
