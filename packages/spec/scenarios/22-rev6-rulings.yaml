- id: approval-names-its-agent
  title: An approval opened by an actor that names an agent carries `agent.name`, the name the agent was registered under and never its id; an approval opened with no agent carries no `agent` member
  tags: [both, lifecycle]
  requires: [approvals, agents]
  needs: [creator_user]
  steps:
    - name: register an agent
      as: creator_user
      request: { method: POST, path: /v1/agents, body: { name: 'Ledger agent ${uniq}' } }
      expect: { status: 201 }
      save: { an_agent_id: data.id }
    - name: register a tool the organisation shares
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:an:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
      expect: { status: 201 }
    - name: an approval is opened for the agent
      as: creator_user
      request:
        method: POST
        path: /v1/decisions
        body:
          action: { tool_ref: 'ext:an:${uniq}', arguments: { q: 'an-${uniq}' } }
          actor: { agent_id: '${an_agent_id}' }
          continuation: { kind: adk, delivery: pull }
      expect: { status: 200, body: [{ path: data.decision, equals: step_up }] }
      save: { an_id: data.approval.id }
    - name: it names the agent by its name
      as: creator_user
      request: { method: GET, path: '/v1/approvals/${an_id}' }
      expect:
        status: 200
        body:
          - { path: data.agent.id, equals: '${an_agent_id}' }
          - { path: data.agent.name, equals: 'Ledger agent ${uniq}' }
          - { path: data.agent.name, not_equals: '${an_agent_id}' }
    - name: an approval is opened with no agent
      as: creator_user
      request:
        method: POST
        path: /v1/decisions
        body:
          action: { tool_ref: 'ext:an:${uniq}', arguments: { q: 'an2-${uniq}' } }
          continuation: { kind: adk, delivery: pull }
      expect: { status: 200, body: [{ path: data.decision, equals: step_up }] }
      save: { an2_id: data.approval.id }
    - name: it carries no agent
      as: creator_user
      request: { method: GET, path: '/v1/approvals/${an2_id}' }
      expect:
        status: 200
        body:
          - { path: data.agent, exists: false }
