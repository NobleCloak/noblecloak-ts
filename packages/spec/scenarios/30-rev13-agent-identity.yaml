      expect:
        status: 200
        follow_pages: true
        body:
          - {
              path: data,
              lacks_where_matches: { key: id, matches: '(^|[:/])everyone$', ignore_case: true },
            }
          - {
              path: data,
              lacks_where_matches: { key: display_name, matches: '^everyone$', ignore_case: true },
            }
    - name: nor the roles an administrator lists
      as: admin
      request: { method: GET, path: '/v1/principals?type=role&limit=200' }
      expect:
        status: 200
        follow_pages: true
        body:
          - {
              path: data,
              lacks_where_matches: { key: id, matches: '(^|[:/])everyone$', ignore_case: true },
            }
          - {
              path: data,
              lacks_where_matches: { key: display_name, matches: '^everyone$', ignore_case: true },
            }
    - name: nor any listing an administrator reads
      as: admin
      request: { method: GET, path: '/v1/principals?limit=200' }
      expect:
        status: 200
        follow_pages: true
        body:
          - {
              path: data,
              lacks_where_matches: { key: id, matches: '(^|[:/])everyone$', ignore_case: true },
            }
          - {
              path: data,
              lacks_where_matches: { key: display_name, matches: '^everyone$', ignore_case: true },
            }
- id: simulate-set-without-anything-stored
  title: Proposed policies are simulated with nothing stored - each is listed with a null id and version, its proposed_index and no source, a malformed body is refused with a member naming it, an empty set is 400, and only an administrator simulates as a subject
  tags: [both]
  requires: policies
  serves_policy_subject_type: role
  needs: [admin]
  steps:
    - as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:s0:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
      expect: { status: 201 }
    - name: two proposed policies are listed, each by its index, with no source
      as: creator
      request:
        method: POST
        path: /v1/policies/simulate
        body:
          policies:
            - kind: tool_invocation
              subjects: [{ type: role, id: everyone }]
              targets: { tools: ['ext:s0:${uniq}'] }
              config: { mode: always_allow }
            - kind: tool_invocation
              subjects: [{ type: role, id: everyone }]
              targets: { tools: ['ext:s0:${uniq}'] }
              config: { mode: always_allow }
          action: { tool_ref: 'ext:s0:${uniq}', arguments: { q: 'set-${uniq}' } }
      expect:
        status: 200
        body:
          - { path: data.enforced, equals: false }
          - path: data.considered.policies
            contains_members: { id: null, version: null, proposed_index: 0, result: always_allow }
          - path: data.considered.policies
            contains_members: { id: null, version: null, proposed_index: 1, result: always_allow }
          # A proposed entry is not a default of the deployment: it never carries `source`.
          - path: data.considered.policies
            lacks_members: { proposed_index: 0, source: default }
          - path: data.considered.policies
            lacks_members: { proposed_index: 1, source: default }
    - name: a body no deployment can enforce is refused, naming the member
      as: creator
      request:
        method: POST
        path: /v1/policies/simulate
        body:
          policies:
            - kind: duplicate_requests
              subjects: [{ type: role, id: everyone }]
              config: { after_rejection: deny }
          action: { tool_ref: 'ext:s0:${uniq}', arguments: { q: 'bad-${uniq}' } }
      expect:
        status: 422
        problem: unsupported_policy_form
        body:
          - { path: member, matches: '^policies\[0\]\.subjects' }
    - name: an empty set is not a request
      as: creator
      request:
        method: POST
        path: /v1/policies/simulate
        body:
          policies: []
          action: { tool_ref: 'ext:s0:${uniq}', arguments: {} }
      expect: { status: 400, problem: invalid_request }
    - name: only an administrator simulates as a subject
      as: creator
      request:
        method: POST
        path: /v1/policies/simulate
        body:
          policies:
            - kind: tool_invocation
              subjects: [{ type: role, id: everyone }]
              targets: { tools: ['ext:s0:${uniq}'] }
              config: { mode: always_allow }
          subject: { type: role, id: everyone }
          action: { tool_ref: 'ext:s0:${uniq}', arguments: {} }
      expect: { status: 403, problem: forbidden }
- id: simulate-set-stands-beside-stored-policies
  title: A proposed policy stands beside the policies in force and never replaces one - a stored everyone-role deny and a proposed everyone-role always_allow are both listed and the deny decides
  tags: [hosted, negative]
  only: hosted
  requires: policies
  serves_policy_subject_type: role
  needs: [admin]
  steps:
    - as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:s1:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
      expect: { status: 201 }
    - name: a stored policy on the everyone role that denies
      as: admin
      request:
        method: POST
        path: /v1/policies
        body:
          kind: tool_invocation
          subjects: [{ type: role, id: everyone }]
          targets: { tools: ['ext:s1:${uniq}'] }
          config: { mode: deny }
      expect: { status: 201 }
      save: { stored: data.id }
    - as: admin
      request: { method: POST, path: '/v1/policies/${stored}/publish' }
      expect: { status: 200 }
    - name: a proposed body for the same subject and tool is listed beside it
      as: creator
      request:
        method: POST
        path: /v1/policies/simulate
        body:
          policies:
            - kind: tool_invocation
              subjects: [{ type: role, id: everyone }]
              targets: { tools: ['ext:s1:${uniq}'] }
              config: { mode: always_allow }
          action: { tool_ref: 'ext:s1:${uniq}', arguments: { q: 'beside-${uniq}' } }
      expect:
        status: 200
        body:
          - { path: data.decision, equals: deny }
          - path: data.considered.policies
            contains_members: { id: '${stored}', result: deny, contributed: true }
          - path: data.considered.policies
            contains_members: { id: null, version: null, result: always_allow, proposed_index: 0 }
# Publishes an organisation duplicate-requests policy equal to the default (deny, 24 hours), as the last step of
# 25-rejected-duplicate-ask-again.yaml does, so that the setting in force after it is what it was before.
- id: simulate-set-duplicate-stands-beside-in-force
  title: A proposed duplicate_requests body stands beside the organisation's duplicate-requests setting in force and never replaces it - both are listed, and a second proposed duplicate_requests body is 422 naming its index
  tags: [hosted, negative]
  only: hosted
  requires: policies
  needs: [admin]
  steps:
    - as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:s2:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
      expect: { status: 201 }
    - name: the setting in force is a published duplicate-requests policy
      as: admin
      request:
        method: POST
        path: /v1/policies
        body:
          kind: duplicate_requests
          name: 'conformance duplicate default ${uniq}'
          subjects: [{ type: organization }]
          config: { after_rejection: deny, window_seconds: 86400 }
      expect: { status: 201 }
      save: { in_force: data.id }
    - as: admin
      request: { method: POST, path: '/v1/policies/${in_force}/publish' }
      expect: { status: 200 }
    - name: a proposed body is listed beside it
      as: creator
      request:
        method: POST
        path: /v1/policies/simulate
        body:
          policies:
            - kind: duplicate_requests
              subjects: [{ type: organization }]
              config: { after_rejection: ask_again, max_reasks: 1 }
          action: { tool_ref: 'ext:s2:${uniq}', arguments: { q: 'dup-${uniq}' } }
      expect:
        status: 200
        body:
          - path: data.considered.policies
            contains_members: { kind: duplicate_requests, id: '${in_force}' }
          - path: data.considered.policies
            contains_members:
              { kind: duplicate_requests, id: null, version: null, proposed_index: 0 }
    - name: a second proposed body of the kind is refused, naming it
      as: creator
      request:
        method: POST
        path: /v1/policies/simulate
        body:
          policies:
            - kind: duplicate_requests
              subjects: [{ type: organization }]
              config: { after_rejection: ask_again }
            - kind: duplicate_requests
              subjects: [{ type: organization }]
              config: { after_rejection: deny }
          action: { tool_ref: 'ext:s2:${uniq}', arguments: {} }
      expect:
        status: 422
        problem: unsupported_policy_form
        body:
          - { path: member, equals: 'policies[1].kind' }
- id: unsupported-policy-form-names-member
  title: Every unsupported_policy_form the deployment can be driven to answer names the offending member in member - a create, a set simulation and a simulation as a subject
  tags: [hosted, negative]
