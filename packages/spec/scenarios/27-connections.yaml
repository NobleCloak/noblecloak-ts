- id: negative-connection-refresh-registers-its-tools
  title: Refresh registers the tools the server offers, with the connection's transport and id; discover enumerates them live and registers nothing
  tags: [both, negative]
  requires: connections
  serves_connection_owner_kind: org
  serves_connection_transport: mcp
  needs: [admin]
  fixtures: [connection_server_url]
  steps:
    - as: admin
      request:
        method: POST
        path: /v1/connections
        body:
          name: 'refresh ${uniq}'
          url: '${connection_server_url}'
          transport: mcp
          owner_kind: org
      expect: { status: 201 }
      save: { connection_id: data.id }
    - as: admin
      request: { method: GET, path: '/v1/tools?connection=${connection_id}&limit=200' }
      expect: { status: 200 }
      save: { before: data }
    - name: discover enumerates
      as: admin
      request: { method: POST, path: '/v1/connections/${connection_id}/discover' }
      expect: { status: 200, body: [{ path: data.0.tool_ref, exists: true }] }
    - name: and registers nothing
      as: admin
      request: { method: GET, path: '/v1/tools?connection=${connection_id}&limit=200' }
      expect: { status: 200, body: [{ path: data, equals: '${before}' }] }
    - name: refresh registers
      as: admin
      request: { method: POST, path: '/v1/connections/${connection_id}/refresh' }
      expect: { status: 200, body: [{ path: data.tool_count, exists: true }] }
    - as: admin
      request: { method: GET, path: '/v1/tools?connection=${connection_id}&limit=200' }
      expect:
        status: 200
        body:
          - path: data
            contains_members: { connection_id: '${connection_id}', transport: mcp, status: active }
    - as: admin
      request: { method: DELETE, path: '/v1/connections/${connection_id}' }
      expect: { status: 204 }
- id: negative-connection-delete-withdraws-and-readd-rebinds
  title: Deleting a connection withdraws its tools, whose policies remain and list them as unenforced, and a decision for one is deny unknown_tool; registering the same server again makes them active under the same tool_ref
  tags: [hosted, negative]
  only: hosted
  requires: [connections, policies]
  serves_connection_owner_kind: org
  serves_connection_transport: mcp
  needs: [admin]
  fixtures: [connection_server_url]
  steps:
    - as: admin
      request:
        method: POST
        path: /v1/connections
        body:
          name: 'readd ${uniq}'
          url: '${connection_server_url}'
          transport: mcp
          owner_kind: org
      expect: { status: 201 }
      save: { connection_id: data.id }
    - as: admin
      request: { method: POST, path: '/v1/connections/${connection_id}/refresh' }
      expect: { status: 200 }
    - as: admin
      request: { method: GET, path: '/v1/tools?connection=${connection_id}&limit=200' }
      expect: { status: 200, body: [{ path: data.0.tool_ref, exists: true }] }
      save: { tool_ref: data.0.tool_ref }
    - name: a policy on one of its tools
      as: admin
      request:
        method: POST
        path: /v1/policies
        body:
          kind: tool_invocation
          subjects: [{ type: user, id: '00000000-0000-4000-8000-${uniq}' }]
          targets: { tools: ['${tool_ref}'] }
          config: { mode: ask }
      expect: { status: 201 }
      save: { policy_id: data.id }
    - as: admin
      request: { method: DELETE, path: '/v1/connections/${connection_id}' }
      expect: { status: 204 }
    - name: its tools are withdrawn, and keep the connection they came from
      as: admin
      request: { method: GET, path: '/v1/tools?connection=${connection_id}&limit=200' }
      expect:
        status: 200
        body:
          - path: data
            contains_members: { tool_ref: '${tool_ref}', status: withdrawn }
    - name: the policy remains, and lists the tool as unenforced
      as: admin
      request: { method: GET, path: '/v1/policies/${policy_id}' }
      expect: { status: 200, body: [{ path: data.unenforced_targets, contains: '${tool_ref}' }] }
    - name: a decision for a withdrawn tool is deny unknown_tool
      as: creator
      request:
        method: POST
        path: /v1/decisions
        body: { action: { tool_ref: '${tool_ref}', arguments: {} } }
      expect:
        status: 200
        body:
          - { path: data.decision, equals: deny }
          - { path: data.reason, equals: unknown_tool }
    - name: the same server registered again
      as: admin
      request:
        method: POST
        path: /v1/connections
        body:
          name: 'readd again ${uniq}'
          url: '${connection_server_url}'
          transport: mcp
          owner_kind: org
      expect: { status: 201 }
      save: { second_id: data.id }
    - name: makes its tools active under the same tool_ref
      as: admin
      request: { method: GET, path: '/v1/tools?connection=${second_id}&limit=200' }
      expect:
        status: 200
        body:
          - path: data
            contains_members: { tool_ref: '${tool_ref}', status: active }
    - as: admin
      request: { method: DELETE, path: '/v1/connections/${second_id}' }
      expect: { status: 204 }
