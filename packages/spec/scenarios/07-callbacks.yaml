- id: callback-public-accepted
  title: A public https callback is accepted by /v1/continuations/test and the guard follows no special-casing of https
  tags: [both, ssrf]
  requires: approvals
  serves_delivery: push
  steps:
    - as: creator
      request:
        method: POST
        path: /v1/continuations/test
        body:
          continuation:
            { kind: webhook, delivery: push, callback_url: '${callback_base_url}/noblecloak' }
      expect:
        status: 200
        body:
          - { path: data.valid, equals: true }
    - name: plain http is refused by the schema
      as: creator
      request:
        method: POST
        path: /v1/continuations/test
        body:
          continuation:
            { kind: webhook, delivery: push, callback_url: 'http://hooks.example.com/noblecloak' }
      expect: { status: 400 }
    - name: a push continuation needs a callback_url
      as: creator
      request:
        method: POST
        path: /v1/continuations/test
        body:
          continuation: { kind: webhook, delivery: push }
      expect: { status: 400, problem: invalid_request }
