- id: rejection-yields-a-resumption
  title: A rejected approval has a signed Resumption with resolution rejected and no resume_token, which the creator reads and which the verifier does not accept as an approval
  tags: [both, lifecycle, resumption]
  needs: [approver]
  requires: approvals
  steps:
    - name: register an external tool, for which approval would issue a resume_token
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:rej:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
      expect: { status: 201 }
    - as: creator
      request:
        method: POST
        path: /v1/decisions
        body:
          action: { tool_ref: 'ext:rej:${uniq}', arguments: { n: 1 } }
          continuation: { kind: adk, delivery: pull }
      expect:
        status: 200
        body:
          - { path: data.approval.resume_token_will_issue, equals: true }
      save: { r_id: data.approval.id, r_digest: data.action_digest }
    - name: the approver rejects it
      as: approver
      request:
        method: POST
        path: /v1/approvals/${r_id}/deny
        body: { expected_action_digest: '${r_digest}' }
      expect: { status: 200, body: [{ path: data.state, equals: rejected }] }
    - name: the creator reads a Resumption that says rejected and carries no token
      as: creator
      request: { method: GET, path: '/v1/approvals/${r_id}/resumption' }
      expect:
        status: 200
        body:
          - { path: data.approval_id, equals: '${r_id}' }
          - { path: data.resolution, equals: rejected }
          - { path: data.resume_token, exists: false }
      save: { resumption: data, r_resolved_at: data.resolved_at }
    - name: reading it again is the same answer, since a rejection is not a consumption
      as: creator
      request: { method: GET, path: '/v1/approvals/${r_id}/resumption' }
      expect:
        status: 200
        body:
          - { path: data.approval_id, equals: '${r_id}' }
          - { path: data.resolution, equals: rejected }
          - { path: data.resolved_at, equals: '${r_resolved_at}' }
          - { path: data.resume_token, exists: false }
    - as: none
      request: { method: GET, path: /.well-known/jwks.json }
      expect: { status: 200 }
      save: { jwks: '$' }
    - name: its signature verifies and the verifier, which accepts approved only, refuses it for that reason
      verify_resumption:
        resumption: '${resumption}'
        jwks: '${jwks}'
        expect: { tool_ref: 'ext:rej:${uniq}', arg_digest: '${r_digest}' }
        result: not_approved
    - name: a tampered digest breaks the signature, so the refusal above was not a signature failure
      verify_resumption:
        resumption: '${resumption}'
        jwks: '${jwks}'
        expect: { tool_ref: 'ext:rej:${uniq}', arg_digest: '${r_digest}' }
        tamper: action_digest
        result: bad_signature
    - name: a rejection through resolve is the same, for a second external approval
      as: creator
      request:
        method: POST
        path: /v1/decisions
        body:
          action: { tool_ref: 'ext:rej:${uniq}', arguments: { n: 2 } }
          continuation: { kind: adk, delivery: pull }
      expect: { status: 200 }
      save: { x_id: data.approval.id, x_digest: data.action_digest }
    - as: approver
      request:
        method: POST
        path: /v1/approvals/${x_id}/resolve
        body: { resolution: rejected, expected_action_digest: '${x_digest}' }
      expect: { status: 200, body: [{ path: data.state, equals: rejected }] }
    - name: the creator reads a rejected Resumption without a token
      as: creator
      request: { method: GET, path: '/v1/approvals/${x_id}/resumption' }
      expect:
        status: 200
        body:
          - { path: data.approval_id, equals: '${x_id}' }
          - { path: data.resolution, equals: rejected }
          - { path: data.resume_token, exists: false }
      save: { x_resumption: data }
    - name: the verifier refuses it as not approved
      verify_resumption:
        resumption: '${x_resumption}'
        jwks: '${jwks}'
        expect: { tool_ref: 'ext:rej:${uniq}', arg_digest: '${x_digest}' }
        result: not_approved
    - name: a proxied tool, whose approval would carry no token either, is rejected through deny
      as: creator
      request:
        method: POST
        path: /v1/decisions
        body:
          action: { tool_ref: '${proxied_tool}', arguments: { title: 'rej ${uniq}' } }
          continuation: { kind: adk, delivery: pull }
      expect: { status: 200 }
      save: { y_id: data.approval.id, y_digest: data.action_digest }
    - as: approver
      request:
        method: POST
        path: /v1/approvals/${y_id}/deny
        body: { expected_action_digest: '${y_digest}' }
      expect: { status: 200, body: [{ path: data.state, equals: rejected }] }
    - name: the creator reads its rejected Resumption
      as: creator
      request: { method: GET, path: '/v1/approvals/${y_id}/resumption' }
      expect:
        status: 200
        body:
          - { path: data.approval_id, equals: '${y_id}' }
          - { path: data.resolution, equals: rejected }
          - { path: data.resume_token, exists: false }
      save: { y_resumption: data }
    - name: the verifier refuses it as not approved
      verify_resumption:
        resumption: '${y_resumption}'
        jwks: '${jwks}'
        expect: { tool_ref: '${proxied_tool}', arg_digest: '${y_digest}' }
        result: not_approved
- id: approval-arguments-beyond-the-advertised-bound
  title: Arguments larger than limits.approval_arguments_max_bytes, for a tool that shows its arguments to approvers, are 400 invalid_request and never truncated, and arguments within it are kept
  tags: [both, negative, lifecycle]
  needs: [approver]
  requires: approvals
  advertises: [approval_arguments_max_bytes]
  steps:
    - name: register a tool that shows its arguments to approvers
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:argX:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
          show_arguments_to_approvers: true
      expect: { status: 201 }
    - name: arguments larger than the bound are refused
      as: creator
      request:
        method: POST
        path: /v1/decisions
        body:
          action:
            tool_ref: 'ext:argX:${uniq}'
            arguments: { items: { $repeat: '${approval_arguments_max_bytes}', item: 'x' } }
          continuation: { kind: adk, delivery: pull }
      expect: { status: 400, problem: invalid_request }
    - name: and through POST /v1/approvals
      as: creator
      request:
        method: POST
        path: /v1/approvals
        body:
          action:
            tool_ref: 'ext:argX:${uniq}'
            arguments: { items: { $repeat: '${approval_arguments_max_bytes}', item: 'x' } }
          continuation: { kind: adk, delivery: pull }
      expect: { status: 400, problem: invalid_request }
    - name: small arguments are kept and read back whole
      as: creator
      request:
        method: POST
        path: /v1/decisions
        body:
          action: { tool_ref: 'ext:argX:${uniq}', arguments: { q: 'small-${uniq}' } }
          continuation: { kind: adk, delivery: pull }
      expect: { status: 200 }
      save: { x_id: data.approval.id }
    - as: approver
      request: { method: GET, path: '/v1/approvals/${x_id}' }
      expect:
        status: 200
        body:
          - { path: data.arguments, equals_canonical: { q: 'small-${uniq}' } }
- id: approval-arguments-not-sent-when-opened-with-a-digest
  title: An approval opened with only an argument digest, on a tool that shows arguments to approvers, says `not_sent` and carries no arguments, to its creator and to an eligible approver alike
  tags: [both, lifecycle]
  requires: approvals
  needs: [creator_user, approver]
  steps:
    - name: register a tool that shows its arguments to approvers
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:ns:${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
          show_arguments_to_approvers: true
      expect: { status: 201 }
    - name: a user opens an approval naming the digest and no arguments
      as: creator_user
      request:
        method: POST
        path: /v1/decisions
        body:
          action:
            tool_ref: 'ext:ns:${uniq}'
            arg_digest: '${uniq}${uniq}${uniq}${uniq}${uniq}0000'
          continuation: { kind: adk, delivery: pull }
      expect: { status: 200 }
      save: { ns_id: data.approval.id }
    - name: its creator reads it, and is told no arguments were sent
      as: creator_user
      request: { method: GET, path: '/v1/approvals/${ns_id}' }
      expect:
        status: 200
        body:
          - { path: data.state, equals: pending }
          - { path: data.arguments, exists: false }
          - { path: data.arguments_state, equals: not_sent }
    - name: an eligible approver reads it, and is told the same
      as: approver
      request: { method: GET, path: '/v1/approvals/${ns_id}' }
      expect:
        status: 200
        body:
          - { path: data.arguments, exists: false }
          - { path: data.arguments_state, equals: not_sent }
