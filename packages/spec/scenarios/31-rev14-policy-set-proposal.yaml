          - { path: member, equals: 'action.arguments.policies[0].policy.targets.tools[0]' }
- id: proposal-refused-baseline-exists
  title: A baseline for a tool that a published policy of the role everyone already governs is refused with code baseline_exists, so that a proposal never loosens or replaces the organisation's baseline unseen
  tags: [hosted, negative]
  only: hosted
  requires: [agents, approvals, policies]
  features: [policies.retire]
  advertises: [deployment_applied]
  arguments_bytes: 4096
  needs: [admin, creator_user]
  steps:
    - name: an agent, a tool, and a published baseline for it
      as: creator
      request: { method: POST, path: /v1/agents, body: { name: 'baselined agent ${uniq}' } }
      expect: { status: 201 }
      save: { agent: data.id }
    - as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:pe:${uniq}:send'
          transport: external
          input_schema: { type: object }
          side_effect_level: external
          owner_kind: org
      expect: { status: 201 }
    - as: admin
      request:
        method: POST
        path: /v1/policies
        body:
          kind: tool_invocation
          subjects: [{ type: role, id: everyone }]
          targets: { tools: ['ext:pe:${uniq}:send'] }
          config: { mode: ask }
      expect: { status: 201 }
      save: { existing: data.id }
    - as: admin
      request: { method: POST, path: '/v1/policies/${existing}/publish' }
      expect: { status: 200 }
    - name: the proposal carries another baseline for it
      as: creator_user
      request:
        method: POST
        path: /v1/approvals
        body:
          action:
            tool_ref: 'tool:noblecloak:propose-policy-set'
            arguments:
              agent: { id: '${agent}' }
              policies:
                - role: baseline
                  rationale: The organisation lets it send.
                  assessment:
                    {
                      side_effect_level: external,
                      blast_radius: one_record,
                      reversible: false,
                      external_party: true,
                      financial: false,
                    }
                  policy:
                    kind: tool_invocation
                    subjects: [{ type: role, id: everyone }]
                    targets: { tools: ['ext:pe:${uniq}:send'] }
                    config: { mode: always_allow }
          continuation: { kind: mcp_held, delivery: held }
      expect:
        status: 422
        problem: proposal_refused
        body:
          - { path: code, equals: baseline_exists }
          - { path: member, equals: 'action.arguments.policies[0]' }
  cleanup:
    - name: the baseline that was published is retired
      as: admin
      request: { method: POST, path: '/v1/policies/${existing}/retire' }
      expect: { status: 200 }
