# Contract revision 14: a deployment-applied reference, `tool:noblecloak:propose-policy-set`. A person opens it through
# POST /v1/approvals, an administrator approves it, and the deployment registers the tools, binds the service
# principal and creates and publishes the policies in one step, or applies nothing.
#
# Every scenario that applies a proposal binds the agent to a service principal and publishes policies, and undoes
# both in `cleanup` (unbind, and retire each policy), which runs whether the steps passed or failed, so that a run can
# repeat on a real deployment. A tool a proposal registers stays registered (there is no route that deletes a tool),
# under a reference no other run uses. Each proposal sends well under 4096 bytes of arguments: a deployment that
# advertises a smaller `approval_arguments_max_bytes` skips the scenario (`arguments_bytes`), and the scenario
# `proposal-arguments-bound` is the one that meets the bound. A scenario that applies a proposal needs `admin` (the
# approver) and `creator_user` (the person who opens it): a service principal cannot open one.
- id: proposal-reserved-namespace
  title: The tool:noblecloak namespace is reserved - registering a tool under it is 422 reserved_tool_ref, the reference of the proposal is never listed by GET /v1/tools and a decision on it is a deny for an unknown tool
  tags: [both, floor, negative]
  steps:
    - name: a tool cannot be registered under the namespace
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'tool:noblecloak:mine-${uniq}'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
      expect: { status: 422, problem: reserved_tool_ref }
    - name: nor under the reference of the proposal itself
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'tool:noblecloak:propose-policy-set'
          transport: external
          input_schema: { type: object }
          side_effect_level: write
          owner_kind: org
      expect: { status: 422, problem: reserved_tool_ref }
    - name: the reference is no tool of the catalog
      as: admin
      request: { method: GET, path: '/v1/tools?limit=200' }
      expect:
        status: 200
        follow_pages: true
        body:
          - path: data
            lacks_where_matches: { key: tool_ref, matches: '^tool:noblecloak:' }
    - name: a decision on it is not decided as an ordinary tool
      as: creator
      request:
        method: POST
        path: /v1/decisions
        body:
          action:
            { tool_ref: 'tool:noblecloak:propose-policy-set', arguments: { q: 'decide-${uniq}' } }
      expect:
        status: 200
        body:
          - { path: data.decision, equals: deny }
          - { path: data.reason, equals: unknown_tool }
- id: proposal-policy-immutable
  title: No policy targets a deployment-applied reference - authoring one, replacing a draft with one and simulating a body that names one are each 422 policy_immutable
  tags: [hosted, negative]
  only: hosted
  requires: policies
  needs: [admin]
  steps:
    - name: a policy that targets the reference is refused
      as: admin
      request:
        method: POST
        path: /v1/policies
        body:
          kind: tool_invocation
          subjects: [{ type: role, id: everyone }]
          targets: { tools: ['tool:noblecloak:propose-policy-set'] }
          config: { mode: always_allow }
      expect: { status: 422, problem: policy_immutable }
    - name: so is one that names it among others
      as: admin
      request:
        method: POST
        path: /v1/policies
        body:
          kind: tool_invocation
          subjects: [{ type: role, id: everyone }]
          targets: { tools: ['ext:pi:${uniq}', 'tool:noblecloak:propose-policy-set'] }
          config: { mode: always_allow }
      expect: { status: 422, problem: policy_immutable }
    - name: a draft that does not target it, replaced with a body that does
      as: admin
      request:
        method: POST
        path: /v1/policies
        body:
          kind: tool_invocation
          subjects: [{ type: role, id: everyone }]
          targets: { tools: ['ext:pi:${uniq}'] }
          config: { mode: ask }
      expect: { status: 201 }
      save: { draft: data.id }
    - as: admin
      request:
        method: PUT
        path: '/v1/policies/${draft}'
        body:
          kind: tool_invocation
          subjects: [{ type: role, id: everyone }]
          targets: { tools: ['tool:noblecloak:propose-policy-set'] }
          config: { mode: always_allow }
      expect: { status: 422, problem: policy_immutable }
    - name: a simulation of a proposed body that names it
      as: admin
      request:
        method: POST
        path: /v1/policies/simulate
        body:
          policies:
            - kind: tool_invocation
              subjects: [{ type: role, id: everyone }]
              targets: { tools: ['tool:noblecloak:propose-policy-set'] }
              config: { mode: always_allow }
          action: { tool_ref: 'ext:pi:${uniq}', arguments: { q: 'immutable-${uniq}' } }
      expect: { status: 422, problem: policy_immutable }
  cleanup:
    - name: the draft that was made goes
      as: admin
      request: { method: DELETE, path: '/v1/policies/${draft}/draft' }
      expect: { status: 204 }
- id: proposal-unroutable-where-not-applied
  title: A reference in the namespace that the deployment does not apply is 422 approval_unroutable
  tags: [both]
  requires: approvals
  needs: [creator_user]
  steps:
    - as: creator_user
      request:
        method: POST
        path: /v1/approvals
        body:
          action:
            { tool_ref: 'tool:noblecloak:nothing-${uniq}', arguments: { q: 'unrouted-${uniq}' } }
          continuation: { kind: mcp_held, delivery: held }
      expect: { status: 422, problem: approval_unroutable }
- id: proposal-applied-on-approval
  title: An administrator's approval applies a proposal as one step - the tools are registered, the service principal is bound, the policies are published and the bound service principal now holds the tightening - and the approval is approved and at once consumed
  tags: [hosted]
  only: hosted
  requires: [agents, approvals, policies]
  features: [policies.retire]
  advertises: [deployment_applied]
  arguments_bytes: 4096
  needs: [admin, creator_user]
  steps:
    - name: an agent, and the service principal the proposal binds to it
      as: creator
      request: { method: POST, path: /v1/agents, body: { name: 'proposed agent ${uniq}' } }
      expect: { status: 201, body: [{ path: data.principal_id, equals: null }] }
      save: { agent: data.id }
    - name: the creator appends a record, which names it as the actor
      as: creator
      request:
        method: POST
        path: /v1/records
        body: { tool_ref: 'pp:${uniq}', decision: allow, enforced: false }
      expect: { status: 201, body: [{ path: data.actor.id, exists: true }] }
      save: { sp: data.actor.id }
    - name: a person opens the proposal
      as: creator_user
      request:
        method: POST
        path: /v1/approvals
        body:
          action:
            tool_ref: 'tool:noblecloak:propose-policy-set'
            arguments:
              agent: { id: '${agent}', principal_id: '${sp}' }
              tools:
                - tool_ref: 'ext:pp:${uniq}:lookup'
                  transport: external
                  input_schema: { type: object }
                  side_effect_level: read
                  owner_kind: org
                - tool_ref: 'ext:pp:${uniq}:send'
                  transport: external
                  input_schema: { type: object }
                  side_effect_level: external
                  owner_kind: org
              policies:
                - role: baseline
                  rationale: Looking a record up changes nothing, so the organisation asks before it anyway.
                  assessment:
                    {
                      side_effect_level: read,
                      blast_radius: one_record,
                      reversible: true,
                      external_party: false,
                      financial: false,
                    }
                  policy:
                    kind: tool_invocation
                    subjects: [{ type: role, id: everyone }]
                    targets: { tools: ['ext:pp:${uniq}:lookup'] }
                    config: { mode: ask }
                - role: baseline
                  rationale: Sending is routine for the people of the organisation.
                  assessment:
                    {
                      side_effect_level: external,
                      blast_radius: one_record,
                      reversible: false,
                      external_party: true,
                      financial: false,
                    }
                  policy:
                    kind: tool_invocation
                    subjects: [{ type: role, id: everyone }]
                    targets: { tools: ['ext:pp:${uniq}:send'] }
                    config: { mode: always_allow }
                - role: tightening
                  rationale: This agent asks before it sends.
                  assessment:
                    {
                      side_effect_level: external,
                      blast_radius: one_record,
                      reversible: false,
                      external_party: true,
                      financial: false,
                    }
                  policy:
                    kind: tool_invocation
                    subjects: [{ type: agent, id: '${agent}' }]
                    targets: { tools: ['ext:pp:${uniq}:send'] }
                    config: { mode: ask }
          continuation: { kind: mcp_held, delivery: held }
      expect:
        status: 201
        body:
          - { path: data.created, equals: true }
          - { path: data.state, equals: pending }
          - { path: data.resume_token_will_issue, equals: false }
      save: { approval_id: data.id }
    - name: opening applies nothing - the agent is unbound and no policy is stored
      as: creator
      request: { method: GET, path: '/v1/agents/${agent}' }
      expect: { status: 200, body: [{ path: data.principal_id, equals: null }] }
    - as: admin
      request:
        method: GET
        path: '/v1/policies?kind=tool_invocation&tool=ext:pp:${uniq}:send&limit=200'
      expect: { status: 200, body: [{ path: data, length: 0 }] }
    - name: the administrator reads the approval, its arguments and its preview
      as: admin
      request: { method: GET, path: '/v1/approvals/${approval_id}' }
      expect:
        status: 200
        body:
          - { path: data.state, equals: pending }
          - { path: data.arguments_state, equals: shown }
          - { path: data.arguments.agent.id, equals: '${agent}' }
          - { path: data.preview.simulations, length: 2 }
          - { path: data.preview.simulations.0.tool_ref, equals: 'ext:pp:${uniq}:lookup' }
          - { path: data.preview.simulations.0.result.decision, equals: step_up }
          - { path: data.preview.simulations.1.tool_ref, equals: 'ext:pp:${uniq}:send' }
          - { path: data.preview.simulations.1.result.decision, equals: step_up }
          - path: data.preview.loosening
            contains_members: { tool_ref: 'ext:pp:${uniq}:send', to: always_allow }
          - path: data.preview.loosening
            lacks_where: { key: tool_ref, equals: 'ext:pp:${uniq}:lookup' }
      save: { digest: data.action_digest }
    - name: the administrator approves
      as: admin
      request:
        method: POST
        path: '/v1/approvals/${approval_id}/approve'
        body: { expected_action_digest: '${digest}' }
      expect:
        status: 200
        body:
          - { path: data.state, equals: consumed }
          - { path: data.resolution, equals: approved }
          - path: data.resolution_history
            contains_members: { resolution: approved }
    - name: the service principal is bound
      as: creator
      request: { method: GET, path: '/v1/agents/${agent}' }
      expect: { status: 200, body: [{ path: data.principal_id, equals: '${sp}' }] }
    - name: the tools are registered - registering one again is refused
      as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:pp:${uniq}:send'
          transport: external
          input_schema: { type: object }
          side_effect_level: external
          owner_kind: org
      expect: { status: 400, problem: invalid_request }
    - name: the baseline is published
      as: admin
      request:
        method: GET
        path: '/v1/policies?kind=tool_invocation&tool=ext:pp:${uniq}:send&subject_type=role&state=published&limit=200'
      expect:
        status: 200
        body:
          - { path: data, length: 1 }
          - { path: data.0.state, equals: published }
          - { path: data.0.subjects.0.id, equals: everyone }
      save: { first: data.0.id }
    - name: and so is the tightening
      as: admin
      request:
        method: GET
        path: '/v1/policies?kind=tool_invocation&tool=ext:pp:${uniq}:send&subject_type=agent&state=published&limit=200'
      expect:
        status: 200
        body:
          - { path: data, length: 1 }
          - { path: data.0.state, equals: published }
          - { path: data.0.subjects.0.id, equals: '${agent}' }
      save: { second: data.0.id }
    - as: admin
      request:
        method: GET
        path: '/v1/policies?kind=tool_invocation&tool=ext:pp:${uniq}:lookup&state=published&limit=200'
      expect: { status: 200, body: [{ path: data, length: 1 }] }
      save: { third: data.0.id }
    - name: the bound service principal holds the tightening, beside the baseline
      as: creator
      request:
        method: POST
        path: /v1/policies/simulate
        body:
          policies:
            - kind: tool_invocation
              subjects: [{ type: role, id: member }]
              targets: { tools: ['ext:pp:${uniq}:send'] }
              config: { mode: always_allow }
          action: { tool_ref: 'ext:pp:${uniq}:send', arguments: { q: 'applied-${uniq}' } }
      expect:
        status: 200
        body:
          - { path: data.decision, equals: step_up }
          - path: data.considered.policies
            contains_members:
              {
                kind: tool_invocation,
                result: ask,
                subject: { type: agent, id: '${agent}' },
                contributed: true,
              }
          - path: data.considered.policies
            contains_members:
              { kind: tool_invocation, result: always_allow, subject: { type: role, id: everyone } }
    - name: the approval is final - it shows neither its arguments nor its preview any more
      as: admin
      request: { method: GET, path: '/v1/approvals/${approval_id}' }
      expect:
        status: 200
        body:
          - { path: data.state, equals: consumed }
          - { path: data.arguments_state, equals: final }
          - { path: data.arguments, exists: false }
          - { path: data.preview, exists: false }
  cleanup:
    - name: whatever the steps did, the agent is unbound
      as: admin
      request: { method: DELETE, path: '/v1/agents/${agent}/principal' }
      expect: { status: 204 }
    - name: and the policies the approval published are retired
      as: admin
      request: { method: POST, path: '/v1/policies/${first}/retire' }
      expect: { status: 200 }
    - as: admin
      request: { method: POST, path: '/v1/policies/${second}/retire' }
      expect: { status: 200 }
    - as: admin
      request: { method: POST, path: '/v1/policies/${third}/retire' }
      expect: { status: 200 }
- id: proposal-refused-at-approval-applies-nothing
  title: A policy that cannot be published when the proposal is approved applies nothing, whatever the steps before it did - the approval is rejected, the last entry of its history says proposal_refused:policy_conflict, and the tools, the binding and the earlier policy are not there
  tags: [hosted, negative]
  only: hosted
  requires: [agents, approvals, policies]
  features: [policies.retire]
  advertises: [deployment_applied]
  arguments_bytes: 4096
  needs: [admin, creator_user]
  steps:
    - name: an agent, and the service principal the proposal binds to it
      as: creator
      request: { method: POST, path: /v1/agents, body: { name: 'conflicted agent ${uniq}' } }
      expect: { status: 201 }
      save: { agent: data.id }
    - as: creator
      request:
        method: POST
        path: /v1/records
        body: { tool_ref: 'pc:${uniq}', decision: allow, enforced: false }
      expect: { status: 201, body: [{ path: data.actor.id, exists: true }] }
      save: { sp: data.actor.id }
    - name: a person opens the proposal - a baseline on one new tool, and a tightening of the agent on another
      as: creator_user
      request:
        method: POST
        path: /v1/approvals
        body:
          action:
            tool_ref: 'tool:noblecloak:propose-policy-set'
            arguments:
              agent: { id: '${agent}', principal_id: '${sp}' }
              tools:
                - tool_ref: 'ext:pc:${uniq}:lookup'
                  transport: external
                  input_schema: { type: object }
                  side_effect_level: read
                  owner_kind: org
                - tool_ref: 'ext:pc:${uniq}:send'
                  transport: external
                  input_schema: { type: object }
                  side_effect_level: external
                  owner_kind: org
              policies:
                - role: baseline
                  rationale: The organisation asks before a lookup.
                  assessment:
                    {
                      side_effect_level: read,
                      blast_radius: one_record,
                      reversible: true,
                      external_party: false,
                      financial: false,
                    }
                  policy:
                    kind: tool_invocation
                    subjects: [{ type: role, id: everyone }]
                    targets: { tools: ['ext:pc:${uniq}:lookup'] }
                    config: { mode: ask }
                - role: tightening
                  rationale: This agent asks before it sends.
                  assessment:
                    {
                      side_effect_level: external,
                      blast_radius: one_record,
                      reversible: false,
                      external_party: true,
                      financial: false,
                    }
                  policy:
                    kind: tool_invocation
                    subjects: [{ type: agent, id: '${agent}' }]
                    targets: { tools: ['ext:pc:${uniq}:send'] }
                    config: { mode: ask }
          continuation: { kind: mcp_held, delivery: held }
      expect: { status: 201 }
      save: { approval_id: data.id }
    - as: admin
      request: { method: GET, path: '/v1/approvals/${approval_id}' }
      expect: { status: 200 }
      save: { digest: data.action_digest }
    - name: between the opening and the approval, a policy of the same agent for the same tool is published
      as: admin
      request:
        method: POST
        path: /v1/policies
        body:
          kind: tool_invocation
          subjects: [{ type: agent, id: '${agent}' }]
          targets: { tools: ['ext:pc:${uniq}:send'] }
          config: { mode: ask }
      expect: { status: 201 }
      save: { blocker: data.id }
    - as: admin
      request: { method: POST, path: '/v1/policies/${blocker}/publish' }
      expect: { status: 200 }
    - name: the administrator approves, and the deployment refuses to apply it
      as: admin
      request:
        method: POST
        path: '/v1/approvals/${approval_id}/approve'
        body: { expected_action_digest: '${digest}' }
      expect:
        status: 200
        body:
          - { path: data.state, equals: rejected }
          - { path: data.resolution, equals: rejected }
          - path: data.resolution_history
            contains_members: { resolution: rejected, reason: 'proposal_refused:policy_conflict' }
    - name: nothing was applied - the agent is unbound
      as: creator
      request: { method: GET, path: '/v1/agents/${agent}' }
      expect: { status: 200, body: [{ path: data.principal_id, equals: null }] }
    - name: the baseline that came before the conflict is not published
      as: admin
      request:
        method: GET
        path: '/v1/policies?kind=tool_invocation&tool=ext:pc:${uniq}:lookup&limit=200'
      expect: { status: 200, body: [{ path: data, length: 0 }] }
    - name: and the tools are not registered
      as: admin
      request:
        method: POST
        path: /v1/policies/simulate
        body:
          policies:
            - kind: tool_invocation
              subjects: [{ type: role, id: member }]
              targets: { tools: ['ext:pc:${uniq}:lookup'] }
              config: { mode: ask }
          action: { tool_ref: 'ext:pc:${uniq}:lookup', arguments: { q: 'refused-${uniq}' } }
      expect: { status: 200, body: [{ path: data.reason, equals: unknown_tool }] }
  cleanup:
    - name: whatever the steps did, the agent is unbound
      as: admin
      request: { method: DELETE, path: '/v1/agents/${agent}/principal' }
      expect: { status: 204 }
    - name: and the policy published between is retired
      as: admin
      request: { method: POST, path: '/v1/policies/${blocker}/retire' }
      expect: { status: 200 }
- id: proposal-rechecked-at-approval
  title: Approving re-runs the checks of opening against the state of that moment - a tightening that a baseline published since makes looser is refused with proposal_refused:tightening_looser, although no policy of the proposal meets a published one of the same tool and subject, and nothing is applied
  tags: [hosted, negative]
  only: hosted
  requires: [agents, approvals, policies]
  features: [policies.retire]
  advertises: [deployment_applied]
  arguments_bytes: 4096
  needs: [admin, creator_user]
  steps:
    - name: an agent and a tool that no policy governs
      as: creator
      request: { method: POST, path: /v1/agents, body: { name: 'rechecked agent ${uniq}' } }
      expect: { status: 201 }
      save: { agent: data.id }
    - as: admin
      request:
        method: POST
        path: /v1/tools
        body:
          tool_ref: 'ext:rc:${uniq}:send'
          transport: external
          input_schema: { type: object }
          side_effect_level: external
          owner_kind: org
      expect: { status: 201 }
    - name: a person opens a proposal whose tightening asks, which nothing in force is tighter than
      as: creator_user
      request:
        method: POST
        path: /v1/approvals
        body:
          action:
            tool_ref: 'tool:noblecloak:propose-policy-set'
            arguments:
              agent: { id: '${agent}' }
              policies:
                - role: tightening
                  rationale: This agent asks before it sends.
                  assessment:
                    {
                      side_effect_level: external,
                      blast_radius: one_record,
                      reversible: false,
                      external_party: true,
                      financial: false,
                    }
                  policy:
                    kind: tool_invocation
                    subjects: [{ type: agent, id: '${agent}' }]
                    targets: { tools: ['ext:rc:${uniq}:send'] }
                    config: { mode: ask }
          continuation: { kind: mcp_held, delivery: held }
      expect: { status: 201 }
      save: { approval_id: data.id }
    - as: admin
      request: { method: GET, path: '/v1/approvals/${approval_id}' }
      expect: { status: 200 }
      save: { digest: data.action_digest }
    - name: between the opening and the approval, a baseline that denies the tool is published for everyone
      as: admin
      request:
        method: POST
        path: /v1/policies
        body:
          kind: tool_invocation
          subjects: [{ type: role, id: everyone }]
          targets: { tools: ['ext:rc:${uniq}:send'] }
          config: { mode: deny }
      expect: { status: 201 }
      save: { denial: data.id }
    - as: admin
      request: { method: POST, path: '/v1/policies/${denial}/publish' }
      expect: { status: 200 }
    - name: the administrator approves, and the deployment refuses to apply a tightening that is now looser
      as: admin
      request:
        method: POST
        path: '/v1/approvals/${approval_id}/approve'
        body: { expected_action_digest: '${digest}' }
      expect:
        status: 200
        body:
          - { path: data.state, equals: rejected }
          - path: data.resolution_history
            contains_members: { resolution: rejected, reason: 'proposal_refused:tightening_looser' }
    - name: nothing was applied - the only policy of the tool is the baseline published between
      as: admin
      request:
        method: GET
        path: '/v1/policies?kind=tool_invocation&tool=ext:rc:${uniq}:send&limit=200'
      expect:
        status: 200
        body:
          - { path: data, length: 1 }
          - { path: data.0.id, equals: '${denial}' }
  cleanup:
    - name: the baseline published between is retired
      as: admin
      request: { method: POST, path: '/v1/policies/${denial}/retire' }
      expect: { status: 200 }
- id: proposal-denied-applies-nothing
  title: Denying a proposal applies nothing - the approval is rejected, the agent stays unbound and no policy is stored
  tags: [hosted, negative]
  only: hosted
  requires: [agents, approvals, policies]
  features: [policies.retire]
  advertises: [deployment_applied]
  arguments_bytes: 4096
  needs: [admin, creator_user]
  steps:
    - name: an agent, and the service principal the proposal binds to it
      as: creator
      request: { method: POST, path: /v1/agents, body: { name: 'denied agent ${uniq}' } }
      expect: { status: 201 }
      save: { agent: data.id }
    - as: creator
      request:
        method: POST
        path: /v1/records
        body: { tool_ref: 'pd:${uniq}', decision: allow, enforced: false }
      expect: { status: 201, body: [{ path: data.actor.id, exists: true }] }
      save: { sp: data.actor.id }
    - name: a person opens the proposal
      as: creator_user
      request:
        method: POST
        path: /v1/approvals
        body:
          action:
            tool_ref: 'tool:noblecloak:propose-policy-set'
            arguments:
              agent: { id: '${agent}', principal_id: '${sp}' }
              tools:
                - tool_ref: 'ext:pd:${uniq}:send'
                  transport: external
                  input_schema: { type: object }
                  side_effect_level: external
                  owner_kind: org
              policies:
                - role: baseline
                  rationale: The organisation asks before it sends.
                  assessment:
                    {
                      side_effect_level: external,
                      blast_radius: one_record,
                      reversible: false,
                      external_party: true,
                      financial: false,
                    }
                  policy:
                    kind: tool_invocation
                    subjects: [{ type: role, id: everyone }]
                    targets: { tools: ['ext:pd:${uniq}:send'] }
                    config: { mode: ask }
          continuation: { kind: mcp_held, delivery: held }
      expect: { status: 201 }
      save: { approval_id: data.id }
    - as: admin
      request: { method: GET, path: '/v1/approvals/${approval_id}' }
      expect: { status: 200 }
      save: { digest: data.action_digest }
    - name: the administrator denies
      as: admin
      request:
        method: POST
        path: '/v1/approvals/${approval_id}/deny'
        body: { expected_action_digest: '${digest}', reason: 'not this one' }
      expect:
        status: 200
        body:
          - { path: data.state, equals: rejected }
          - path: data.resolution_history
            contains_members: { resolution: rejected, reason: 'not this one' }
    - name: nothing was applied - the agent is unbound
      as: creator
      request: { method: GET, path: '/v1/agents/${agent}' }
      expect: { status: 200, body: [{ path: data.principal_id, equals: null }] }
    - name: no policy is stored for the tool
      as: admin
      request:
        method: GET
        path: '/v1/policies?kind=tool_invocation&tool=ext:pd:${uniq}:send&limit=200'
      expect: { status: 200, body: [{ path: data, length: 0 }] }
    - name: and the tool is not registered
      as: admin
      request:
        method: POST
        path: /v1/policies/simulate
        body:
          policies:
            - kind: tool_invocation
              subjects: [{ type: role, id: member }]
              targets: { tools: ['ext:pd:${uniq}:send'] }
              config: { mode: ask }
          action: { tool_ref: 'ext:pd:${uniq}:send', arguments: { q: 'denied-${uniq}' } }
      expect: { status: 200, body: [{ path: data.reason, equals: unknown_tool }] }
  cleanup:
    - name: whatever the steps did, the agent is unbound
      as: admin
      request: { method: DELETE, path: '/v1/agents/${agent}/principal' }
      expect: { status: 204 }
- id: proposal-preview-is-for-approvers
  title: The preview of a pending proposal is read by a person who may approve it and by no one else - the person who opened it with their own token, and a user who may not approve, read the proposal and see none
  tags: [hosted, negative]
  only: hosted
  requires: [agents, approvals, policies]
  advertises: [deployment_applied]
  arguments_bytes: 4096
  needs: [admin, creator_user, member]
  steps:
    - name: an agent
      as: creator
      request: { method: POST, path: /v1/agents, body: { name: 'previewed agent ${uniq}' } }
      expect: { status: 201 }
      save: { agent: data.id }
    - name: a person opens a proposal
      as: creator_user
      request:
        method: POST
        path: /v1/approvals
        body:
          action:
            tool_ref: 'tool:noblecloak:propose-policy-set'
            arguments:
              agent: { id: '${agent}' }
              tools:
                - tool_ref: 'ext:pv:${uniq}:send'
                  transport: external
                  input_schema: { type: object }
                  side_effect_level: external
                  owner_kind: org
              policies:
                - role: baseline
                  rationale: The organisation lets it send.
                  assessment:
                    {
                      side_effect_level: external,
                      blast_radius: one_record,
                      reversible: false,
                      external_party: true,
                      financial: false,
                    }
                  policy:
                    kind: tool_invocation
                    subjects: [{ type: role, id: everyone }]
                    targets: { tools: ['ext:pv:${uniq}:send'] }
                    config: { mode: always_allow }
          continuation: { kind: mcp_held, delivery: held }
      expect: { status: 201 }
      save: { approval_id: data.id }
    - name: an administrator sees the preview
      as: admin
      request: { method: GET, path: '/v1/approvals/${approval_id}' }
      expect:
        status: 200
        body:
          - { path: data.state, equals: pending }
          - { path: data.preview.simulations, length: 1 }
          - path: data.preview.loosening
            contains_members: { tool_ref: 'ext:pv:${uniq}:send', to: always_allow }
      save: { digest: data.action_digest }
    - name: the person who opened it reads it with their own token, and sees no preview
      as: creator_user
      request: { method: GET, path: '/v1/approvals/${approval_id}' }
      expect:
        status: 200
        body:
          - { path: data.state, equals: pending }
          - { path: data.preview, exists: false }
    - name: a user who may not approve reads it, and sees no preview
      as: member
      request: { method: GET, path: '/v1/approvals/${approval_id}' }
      expect:
        status: 200
        body:
          - { path: data.state, equals: pending }
          - { path: data.preview, exists: false }
    - name: the listing carries none either
      as: admin
      request: { method: GET, path: '/v1/approvals?state=pending&limit=200' }
      expect:
        status: 200
        body:
          - { path: data, lacks_key: preview }
  cleanup:
    - name: the proposal is denied, so that it is not left pending
      as: admin
      request:
        method: POST
        path: '/v1/approvals/${approval_id}/deny'
        body: { expected_action_digest: '${digest}', reason: 'preview only' }
      expect: { status: 200 }
