- id: proposal-import-skips-reference
  title: An import never brings in a policy that names a deployment-applied reference - the report lists it under unsupported with a reason that names policy_immutable, and applies nothing
  tags: [hosted, negative]
  only: hosted
  requires: policies
  features: [policies.import_export]
  needs: [admin]
  steps:
    - name: a Cedar policy whose resource is the reference
      as: admin
      request:
        method: POST
        path: '/v1/policies/import?format=cedar'
        content_type: text/plain
        body: 'permit (principal, action, resource == NobleCloak::Tool::"tool:noblecloak:propose-policy-set");'
      expect:
        status: 200
        body:
          - { path: data.applied, length: 0 }
          - { path: data.unsupported.0.reason, matches: policy_immutable }
- id: proposal-arguments-bound
  title: A proposal whose arguments are larger than the bound the deployment advertises is 400 invalid_request, as for a tool that shows its arguments to approvers, and nothing is opened
  tags: [hosted, negative]
  only: hosted
  requires: [agents, approvals]
  advertises: [deployment_applied, approval_arguments_max_bytes]
  needs: [creator_user]
  steps:
    - name: an agent
      as: creator
      request: { method: POST, path: /v1/agents, body: { name: 'oversized agent ${uniq}' } }
      expect: { status: 201 }
      save: { agent: data.id }
    - name: a proposal whose tool carries an input schema larger than the bound
      as: creator_user
      request:
        method: POST
        path: /v1/approvals
        body:
          action:
            tool_ref: 'tool:noblecloak:propose-policy-set'
            arguments:
              agent: { id: '${agent}' }
              tools:
                - tool_ref: 'ext:po:${uniq}:send'
                  transport: external
                  input_schema:
                    {
                      type: object,
                      examples: { $repeat: '${approval_arguments_max_bytes}', item: 'x' },
                    }
                  side_effect_level: external
                  owner_kind: org
              policies:
                - role: baseline
                  rationale: The organisation asks before it sends.
                  assessment:
                    {
                      side_effect_level: external,
                      blast_radius: one_record,
                      reversible: false,
                      external_party: true,
                      financial: false,
                    }
                  policy:
                    kind: tool_invocation
                    subjects: [{ type: role, id: everyone }]
                    targets: { tools: ['ext:po:${uniq}:send'] }
                    config: { mode: ask }
          continuation: { kind: mcp_held, delivery: held }
      expect: { status: 400, problem: invalid_request }
