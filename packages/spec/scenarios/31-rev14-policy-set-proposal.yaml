- id: proposal-refused-agent-and-principal
  title: A proposal for an agent that is none of the organisation's is refused with code unknown_agent, and one that binds a service principal already bound to another agent with code principal_bound, each naming its member
  tags: [hosted, negative]
  only: hosted
  requires: [agents, approvals]
  advertises: [deployment_applied]
  arguments_bytes: 4096
  needs: [admin, creator_user]
  steps:
    - name: two agents, and the service principal that is bound to the first
      as: creator
      request: { method: POST, path: /v1/agents, body: { name: 'bound holder ${uniq}' } }
      expect: { status: 201 }
      save: { holder: data.id }
    - as: creator
      request: { method: POST, path: /v1/agents, body: { name: 'bound claimant ${uniq}' } }
      expect: { status: 201 }
      save: { claimant: data.id }
    - as: creator
      request:
        method: POST
        path: /v1/records
        body: { tool_ref: 'pg:${uniq}', decision: allow, enforced: false }
      expect: { status: 201, body: [{ path: data.actor.id, exists: true }] }
      save: { sp: data.actor.id }
    - as: admin
      request:
        method: PUT
        path: '/v1/agents/${holder}/principal'
        body: { principal_id: '${sp}' }
      expect: { status: 200 }
    - name: an agent that is none of the organisation's
      as: creator_user
      request:
        method: POST
        path: /v1/approvals
        body:
          action:
            tool_ref: 'tool:noblecloak:propose-policy-set'
            arguments:
              agent: { id: 'agent_missing_${uniq}' }
              tools:
                - tool_ref: 'ext:pg:${uniq}:send'
                  transport: external
                  input_schema: { type: object }
                  side_effect_level: external
                  owner_kind: org
              policies:
                - role: baseline
                  rationale: The organisation asks.
                  assessment:
                    {
                      side_effect_level: external,
                      blast_radius: one_record,
                      reversible: false,
                      external_party: true,
                      financial: false,
                    }
                  policy:
                    kind: tool_invocation
                    subjects: [{ type: role, id: everyone }]
                    targets: { tools: ['ext:pg:${uniq}:send'] }
                    config: { mode: ask }
          continuation: { kind: mcp_held, delivery: held }
      expect:
        status: 422
        problem: proposal_refused
        body:
          - { path: code, equals: unknown_agent }
          - { path: member, equals: 'action.arguments.agent.id' }
    - name: a service principal that another agent holds
      as: creator_user
      request:
        method: POST
        path: /v1/approvals
        body:
          action:
            tool_ref: 'tool:noblecloak:propose-policy-set'
            arguments:
              agent: { id: '${claimant}', principal_id: '${sp}' }
              tools:
                - tool_ref: 'ext:pg:${uniq}:send'
                  transport: external
                  input_schema: { type: object }
                  side_effect_level: external
                  owner_kind: org
              policies:
                - role: baseline
                  rationale: The organisation asks.
                  assessment:
                    {
                      side_effect_level: external,
                      blast_radius: one_record,
                      reversible: false,
                      external_party: true,
                      financial: false,
                    }
                  policy:
                    kind: tool_invocation
                    subjects: [{ type: role, id: everyone }]
                    targets: { tools: ['ext:pg:${uniq}:send'] }
                    config: { mode: ask }
          continuation: { kind: mcp_held, delivery: held }
      expect:
        status: 422
        problem: proposal_refused
        body:
          - { path: code, equals: principal_bound }
          - { path: member, equals: 'action.arguments.agent.principal_id' }
  cleanup:
    - name: whatever the steps did, the first agent is unbound
      as: admin
      request: { method: DELETE, path: '/v1/agents/${holder}/principal' }
      expect: { status: 204 }
