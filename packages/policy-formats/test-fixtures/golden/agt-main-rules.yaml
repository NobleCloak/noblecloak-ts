# NobleCloak tool_invocation policies, written by @noblecloak/policy-formats.
# Format: AGT main, ACS manifest 0.4.0-alpha.1 with a Cedar policy set at pre_tool_call.
# A call no policy matches is denied by the target engine.
# The manifest binds this policy set at pre_tool_call; AGT binds one policy per intervention point, so it replaces any policy bound there.
# Tool names follow the toolNames map for 3 of 4 tools; the others are the tool_refs verbatim. The catalog's noblecloak_tool_ref records each tool_ref.
# AGT passes one escalate reason to its resolver: when several ask or escalate policies match a call, only the first declared one reaches it, where NobleCloak requires every one.
# Lossy: policy "pol_deploy_by_env" /config/expires_after: kept in @noblecloak_expires_after only; AGT does not enforce it
# Lossy: policy "pol_deploy_by_env" /config/mode: escalate is exported as a permit with @advice escalate: AGT sends every escalation to its default resolver, and the routing of escalate is not carried
# Lossy: policy "pol_deploy_by_env" /config/rules: kept in @noblecloak_rules only; AGT applies only the statement's outcome (escalate, the tightest the policy can reach), not the per-call rules, and NobleCloak asks where a fact of the call has no value
# Lossy: policy "pol_mail_exclude" /config/approvers: kept in @noblecloak_approvers only; AGT does not enforce it
# Lossy: policy "pol_mail_exclude" /config/exclude: kept in @noblecloak_exclude only; AGT does not enforce it
# Lossy: policy "pol_mail_exclude" /config/mode: ask is exported as a permit with @advice escalate: AGT has one approval path, so ask and escalate are not told apart
# Lossy: policy "pol_never_wire" /config/rules: kept in @noblecloak_rules only; AGT applies only the statement's outcome (deny, the tightest the policy can reach), not the per-call rules, and NobleCloak asks where a fact of the call has no value
# Lossy: policy "pol_open_read" /config/rules: kept in @noblecloak_rules only; AGT applies only the statement's outcome (always_allow, the tightest the policy can reach), not the per-call rules
# Lossy: policy "pol_open_read" /subjects: the organization subject is an unconstrained principal: it covers every agent the manifest governs, which is the organisation exactly only when the manifest is deployed for it alone
# Lossy: policy "pol_payments_by_amount" /config/approvers: kept in @noblecloak_approvers only; AGT applies only the statement's outcome (deny, the tightest the policy can reach), not the per-call rules, and NobleCloak asks where a fact of the call has no value
# Lossy: policy "pol_payments_by_amount" /config/exclude: kept in @noblecloak_exclude only; AGT applies only the statement's outcome (deny, the tightest the policy can reach), not the per-call rules, and NobleCloak asks where a fact of the call has no value
# Lossy: policy "pol_payments_by_amount" /config/rules: kept in @noblecloak_rules only; AGT applies only the statement's outcome (deny, the tightest the policy can reach), not the per-call rules, and NobleCloak asks where a fact of the call has no value

agent_control_specification_version: "0.4.0-alpha.1"
metadata:
  name: "noblecloak-tool-policies"
policies:
  noblecloak_tool_invocation:
    type: cedar
    policy_set: |
      @noblecloak_policy("pol_deploy_by_env")
      @noblecloak_kind("tool_invocation")
      @noblecloak_mode("escalate")
      @noblecloak_name("Production deploys escalate")
      @noblecloak_expires_after("PT30M")
      @noblecloak_rules("[{\"then\":\"always_allow\",\"when\":[{\"fact\":\"env\",\"op\":\"eq\",\"value\":\"staging\"}]},{\"then\":\"ask\",\"when\":[{\"fact\":\"env\",\"op\":\"not_in\",\"value\":[\"staging\",\"dev\"]}]}]")
      @noblecloak_encoding("rules_tightest")
      @id("noblecloak.escalate:pol_deploy_by_env")
      @advice("{\"reason\":\"noblecloak.escalate:pol_deploy_by_env\",\"verdict\":\"escalate\"}")
      permit (
        principal == Agent::"agt_release_bot",
        action == Action::"pre_tool_call",
        resource == Tool::"external:deploy"
      );

      @noblecloak_policy("pol_mail_exclude")
      @noblecloak_kind("tool_invocation")
      @noblecloak_mode("ask")
      @noblecloak_name("Mail needs a second person")
      @noblecloak_approvers("[{\"role\":\"manager\"}]")
      @noblecloak_exclude("[\"requester\"]")
      @id("noblecloak.ask:pol_mail_exclude")
      @advice("{\"reason\":\"noblecloak.ask:pol_mail_exclude\",\"verdict\":\"escalate\"}")
      permit (
        principal == Agent::"agt_support",
        action == Action::"pre_tool_call",
        resource == Tool::"send_email"
      );

      @noblecloak_policy("pol_never_wire")
      @noblecloak_kind("tool_invocation")
      @noblecloak_mode("ask")
      @noblecloak_name("Wires over the limit are denied")
      @noblecloak_rules("[{\"then\":\"deny\",\"when\":[{\"fact\":\"lines\",\"op\":\"lt\",\"value\":0}]}]")
      @noblecloak_encoding("rules_tightest")
      @id("noblecloak.deny:pol_never_wire")
      forbid (
        principal == Agent::"agt_support",
        action == Action::"pre_tool_call",
        resource
      );

      @noblecloak_policy("pol_open_read")
      @noblecloak_kind("tool_invocation")
      @noblecloak_mode("always_allow")
      @noblecloak_name("Reads with a declared scope stay open")
      @noblecloak_rules("[{\"then\":\"always_allow\",\"when\":[{\"fact\":\"scope\",\"op\":\"exists\"}]}]")
      @noblecloak_encoding("rules_tightest")
      @id("noblecloak.always_allow:pol_open_read")
      permit (
        principal,
        action == Action::"pre_tool_call",
        resource
      );

      @noblecloak_policy("pol_payments_by_amount")
      @noblecloak_kind("tool_invocation")
      @noblecloak_mode("always_allow")
      @noblecloak_name("Large payments need finance")
      @noblecloak_approvers("[{\"role\":\"finance\"}]")
      @noblecloak_exclude("[\"requester\"]")
      @noblecloak_rules("[{\"approvers\":[{\"role\":\"finance\"},{\"user\":\"usr_cfo\",\"when\":[{\"fact\":\"amount\",\"op\":\"gte\",\"value\":5000}]}],\"then\":\"ask\",\"when\":[{\"fact\":\"amount\",\"op\":\"gt\",\"value\":500},{\"fact\":\"currency\",\"op\":\"in\",\"value\":[\"eur\",\"usd\"]}]},{\"then\":\"always_allow\",\"when\":[{\"fact\":\"reason\",\"op\":\"exists\"}]},{\"then\":\"deny\",\"when\":[{\"fact\":\"amount\",\"op\":\"lte\",\"value\":1}]}]")
      @noblecloak_encoding("rules_tightest")
      @id("noblecloak.deny:pol_payments_by_amount")
      forbid (
        principal == Agent::"agt_support",
        action == Action::"pre_tool_call",
        resource == Tool::"create_refund"
      );
intervention_points:
  pre_tool_call:
    policy_target: "$.tool_call.args"
    tool_name_from: "$.tool_call.name"
    policy:
      id: noblecloak_tool_invocation
tools:
  create_refund:
    noblecloak_tool_ref: "mcp:stripe:main:create_refund"
  "external:deploy":
    noblecloak_tool_ref: "external:deploy"
  list_messages:
    noblecloak_tool_ref: "mcp:gmail:main:list_messages"
  send_email:
    noblecloak_tool_ref: "mcp:gmail:main:send_email"
